      const cls = x[k] < lo || x[k] > hi ? 'low' : '';
      return editable
        ? `<button type="button" class="lab-val ${cls} ${le && le.k === k && le.date === x.date ? 'on' : ''}" data-act="labEdit" data-v="${k}|${x.date}" aria-label="Change ${label} on ${isoLabel(x.date)}, now ${x[k]}">${isoLabel(x.date)}: ${x[k]}</button>`
        : `<span class="${cls}">${isoLabel(x.date)}: ${x[k]}</span>`;
    };
    const editRow = (k) => {
      if (!le || le.k !== k) return '';
      const [, , label, unit] = CBC_RANGE[k];
      const was = (ev.sets.find((x) => x.date === le.date) || {})[k];
      return `<tr class="lab-edit"><td colspan="5"><div class="ov lab-ov">
        <div class="ov-h">Change ${label} on ${isoLabel(le.date)}<span>Saved as V${latestVer().n + 1}, with your reason</span></div>
        <div class="lab-ov-grid">
          <label>${label} (${unit}), was ${was}<input type="number" step="0.01" data-le="val" value="${esc(String(le.val))}" id="labEditVal"></label>
          <label>Why<input type="text" data-le="why" value="${esc(le.why)}" placeholder="e.g. Lab corrected the result"></label>
        </div>
        ${le.err ? `<div class="err" role="alert" style="margin-top: 8px">${le.err}</div>` : ''}
        <div class="row"><button type="button" class="btn primary sm" data-act="labSave">Save as V${latestVer().n + 1}</button><button type="button" class="btn secondary sm" data-act="labCancel">Cancel</button><span class="ov-hint">The decision updates as soon as it saves.</span></div>
      </div></td></tr>`;
    };
    const rows = ['alc', 'wbc', 'hgb', 'plt', 'anc'].map((k) => {
      const [lo, hi, label, unit] = CBC_RANGE[k];
      const out = ev.sets.filter((x) => x[k] < lo || x[k] > hi);
      return `<tr>
        <th scope="row">${label} <span class="u">${unit}</span></th>
        <td class="r mono">${ev.sets.length}</td>
        <td class="r mono ${out.length ? 'low' : ''}">${out.length}</td>
        <td>${trendSvg(ev.sets, k, false)}</td>
        <td class="recent">${ev.sets.slice().reverse().map((x) => val(k, x)).join('<br>')}</td>
      </tr>${editRow(k)}`;
    }).join('');
    body = `<div class="thr"><strong>Thresholds used:</strong> ALC below 1.0 K/µL is low. WBC 4.0–11.0, Hgb 12.0–15.5, Plt 150–400, ANC 1.8–7.7.</div>
      <div class="lsum-wrap"><table class="lsum">
        <thead><tr><th scope="col">Test</th><th scope="col" class="r">n</th><th scope="col" class="r">Out of range</th><th scope="col">Trend</th><th scope="col">Recent</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="thr" style="margin: 10px 0 0">Shaded: the reference range. Amber points are out of range. ${editable ? 'Click a result to change it; the change is saved as a new version.' : `You're looking at V${viewed.n}; go back to the latest to change a result.`}</div>`;
  } else if (tab === 'testing') {
    body = testingRows(ev);
  } else {
    body = `<dl class="kv">${SUPP.map(([k, v, miss]) => `<dt>${k}</dt><dd class="${v ? '' : 'missing'}">${v ? esc(v) : '<span class="pa missing">Missing</span> ' + miss}</dd>`).join('')}</dl>`;
  }
  const t = (id, label) => `<button type="button" role="tab" aria-selected="${tab === id}" data-act="noteTab" data-v="${id}">${label}</button>`;
  return `
    <section class="card" aria-label="Triage note evidence">
      <div class="ctabs" role="tablist" aria-label="Evidence">${t('labs', 'Lab summary')}${t('testing', 'Testing')}${t('supp', 'Supplementary')}</div>
      <div class="cbody" role="tabpanel">${body}</div>
    </section>`;
}

// The right card: the triage note itself. Its summary and missing list come from the algorithm.
// What the referral is still waiting on, as a card on the main screen.
function awaitingCard(p) {
  const items = itemsFor(p.mrn);
  const open = openItems(items);
  return `
    <section class="card aw-card" aria-label="Awaiting items">
      <div class="card-h"><span class="card-t grow">Awaiting items</span>${items.length ? `<span class="pill ${open ? 't-awaiting' : 't-met'}" style="height: 20px">${open ? open + ' open' : 'All in'}</span>` : ''}</div>
      <div class="aw-body">${items.length
        ? '<div class="aw-cols aw-grid"><span>Item</span><span class="r">Asked</span><span class="r">Due</span></div>' + items.map((a) => awaitingRow(a, 'patient')).join('')
        : `<div class="aw-none">Nothing awaiting on ${p.name}. ${p.status === 'new' ? 'Untouched — nothing has been asked for yet.' : ''}</div>`}</div>
    </section>`;
}

// Lab names and values in the triage note become links that open that lab's trend.
const LAB_NAME = { alc: 'Absolute lymphocyte count', wbc: 'White blood cell count', hgb: 'Hemoglobin', plt: 'Platelet count', anc: 'Absolute neutrophil count' };
const LAB_KEY = { ALC: 'alc', WBC: 'wbc', Hgb: 'hgb', Plt: 'plt', ANC: 'anc' };
const LAB_RE = /\b(ALC|WBC|Hgb|Plt|ANC)\b(\s+\d+(?:\.\d+)?(?:\s*(?:K\/µL|g\/dL))?)?|\b(low lymphocyte count|lymphocyte count|low lymphocytes|lymphocytes)\b/g;
function labLinks(html) {
  // Only the text between tags is touched, never an attribute.
  return html.split(/(<[^>]+>)/).map((part) => (part.startsWith('<') ? part : part.replace(LAB_RE, (m, abbr) => {
    const k = abbr ? LAB_KEY[abbr] : 'alc';
    return `<button type="button" class="lab-link" data-act="labTrend" data-v="${k}" aria-label="${m}: open the ${LAB_NAME[k].toLowerCase()} trend">${m}</button>`;
  }))).join('');
}

function noteBody(p) {
  const latest = latestVer();
  const ev = evaluate(latest);
  const miss = missingFor(ev);
  const order = RECORD.find((f) => f.missing);
  const now = new Date();
  const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  return `
    <div class="pnote">
        <div class="pnote-h"><span class="tnote-t grow">Isolated lymphopenia</span><span class="ai-tag" title="Drafted from the algorithm. Review before charting.">AI draft · V${latest.n}</span></div>
        <dl class="kv tight">
          <dt>Date/time</dt><dd>${TODAY_LONG} · ${time}</dd>
          <dt>Patient</dt><dd>${p.name} · MRN ${p.mrn} · F</dd>
          <dt>Referring</dt><dd>J. Whitfield, MD · Northgate Primary Care</dd>
          <dt>Assessment (labs)</dt><dd>${labLinks(`Lymphopenia · ALC ${ev.last.alc} K/µL on ${isoLabel(ev.last.date)}`)}</dd>
        </dl>
        <div class="kicker" style="margin-top: 16px">Snapshot</div>
        <ol class="exec-lines">${summaryLines(ev).map((l) => `<li>${labLinks(l)}</li>`).join('')}</ol>
        <div class="exec-miss">
          <div class="kicker">To Complete</div>
          ${miss.map((m) => `<div class="miss-row"><strong>${m.label}</strong> — ${labLinks(m.why)}</div>`).join('')}
          ${order ? `<div class="miss-row"><strong>Referral order</strong> — ${order.v.toLowerCase()}</div>` : ''}
          ${miss.length || order ? '' : '<div class="miss-row">Nothing. The algorithm has what it needs.</div>'}
          ${miss.length ? `<button type="button" class="btn secondary sm" data-act="toPip">${ICON.pip} Collect in the companion</button>` : ''}
        </div>
    </div>`;
}

/* ---------- Chat: the decision note is drafted here ---------- */

// What the patient page shows, in a few lines: status, path, labs, what's awaited and what's left.
function pageSummary(p) {
  const items = itemsFor(p.mrn);
  const open = items.filter((a) => !S.done[a.id]);
  const aw = open.length
    ? `<strong>Awaiting:</strong> ${open.length} open — ${open.map((a) => `${esc(a.item)} (due ${dueLabel(a)}${dueTone(a) === 'late' ? ', late' : ''})`).join('; ')}.`
    : '<strong>Awaiting:</strong> nothing open.';
  if (p.mrn !== WORKED) {
    return [`<strong>${esc(p.name)}</strong> · ${esc(p.source)} referral ${esc(p.ref)}, received ${esc(p.received)}, ${p.days} days in triage.`,
      `<strong>Status:</strong> ${STATUS[p.status].label}. The decision tree has not been run on this referral in the prototype.`, aw];
  }
  const v = latestVer();
  const ev = evaluate(v);
  const path = chainOf(ev.end).reverse().filter((id) => SHORT[id]).map((id) => `${SHORT[id]} ${stepSub(ev.steps[id]).toLowerCase()}`).join(' → ');
  const l = ev.last;
  const labs = ['alc', 'wbc', 'hgb', 'plt', 'anc'].map((k) => {
    const [lo, hi, label] = CBC_RANGE[k];
    return `${label} ${l[k]}${l[k] < lo ? ' (low)' : l[k] > hi ? ' (high)' : ''}`;
  }).join(', ');
  const miss = missingFor(ev).map((m) => m.label);
  return [
    `<strong>${esc(p.name)}</strong> · ${esc(p.source)} referral ${esc(p.ref)}, received ${esc(p.received)}, ${p.days} days in triage.`,
    `<strong>Status:</strong> ${OUTCOME[ev.end]} (V${v.n}${v.n > 1 ? `, after ${v.n - 1} change${v.n > 2 ? 's' : ''}` : ', from the AI'}).`,
    `<strong>Path:</strong> ${path}.`,
    `<strong>Labs, ${isoLabel(l.date)}:</strong> ${labs}.`,
    aw,
    miss.length ? `<strong>To complete:</strong> ${miss.join('; ')}${/[.?]$/.test(miss[miss.length - 1]) ? '' : '.'}` : '<strong>To complete:</strong> nothing; the tree has what it needs.',
    `<strong>Next:</strong> ${NEXT[ev.end].replace(/^Next:\s*/, '')}`
  ];
}

function ask(q) {
  const p = byMrn(S.current);
  const thread = S.chat[p.mrn] || (S.chat[p.mrn] = []);
  const ql = q.toLowerCase();
  thread.push({ who: 'you', text: q });
  if (/summar/.test(ql)) {
    thread.push({ who: 'copilot', kind: 'summary', when: 'V' + latestVer().n, lines: pageSummary(p) });
  } else if (/message|referring|provider|letter|fax/.test(ql)) {
    thread.push(newMessage(p));
  } else if (/note|draft|document|chart|write/.test(ql)) {
    thread.push(p.mrn === WORKED
      ? { who: 'copilot', kind: 'note' }
      : { who: 'copilot', text: `The tree has not been run on ${p.name}'s referral in this prototype, so there is nothing to draft the note from.` });
  } else if (/await|missing|outstanding|wait|left|due/.test(ql)) {
    const open = itemsFor(p.mrn).filter((a) => !S.done[a.id]);
    thread.push({ who: 'copilot', text: open.length
      ? `${open.length} still open on ${surname(p)}: ` + open.map((a) => `${a.item} (due ${dueLabel(a)}${dueTone(a) === 'late' ? ', late' : ''})`).join('; ') + '.'
      : `Nothing is still awaiting on ${p.name}.` });
  } else {
    thread.push({ who: 'copilot', text: 'In this prototype I can draft the decision note, draft a message to the referring provider, or list what is still awaiting. Try one of the suggestions above the box.' });
  }
  S.scrollChat = true;
  S.panelTab = 'chat';
  S.trackCollapsed = false;
  if (matchMedia('(max-width: 767px)').matches) S.drawer = 'track';
}

// One message covers one patient. It asks for whatever is still open on their awaiting list;
// the copilot never sends it — the triager copies it into the EHR or a fax, then marks it sent.
// Things only the referring practice can supply, that the algorithm is missing and the awaiting list doesn't cover.
function algorithmAsks(p) {
  if (p.mrn !== WORKED) return [];
  const asked = itemsFor(p.mrn).filter((a) => !S.done[a.id]).map((a) => a.id);
  return missingFor(evaluate(latestVer()))
    .filter((m) => (m.kind === 'cbc' && !asked.includes('cbc')) || m.kind === 'ai')
    .map((m) => ({ id: 'alg-' + m.id, item: m.kind === 'cbc' ? 'A recent CBC with differential' : 'Allergy and Immunology evaluation', why: m.why }));
}

function newMessage(p) {
  const prov = PROVIDERS[p.mrn];
  const include = {};
  itemsFor(p.mrn).filter((a) => !S.done[a.id]).forEach((a) => { include[a.id] = true; });
  algorithmAsks(p).forEach((a) => { include[a.id] = true; });
  const m = {
    who: 'copilot', kind: 'message', include, sent: false,
    to: prov ? prov.name + ' · ' + prov.practice : '',
    subject: `Referral ${p.ref} — information needed to complete triage`
  };
  m.body = messageBody(p, m);
  return m;
}

function messageBody(p, m) {
  const prov = PROVIDERS[p.mrn];
  const asks = itemsFor(p.mrn).filter((a) => !S.done[a.id] && m.include[a.id]);
  const extra = algorithmAsks(p).filter((a) => m.include[a.id]);
  const lines = asks.map((a) => `• ${a.item} — ${a.asked !== '—' ? 'first requested ' + a.asked + ', ' : ''}needed by ${dueLabel(a)}`)
    .concat(extra.map((a) => `• ${a.item} — ${a.why}`)).join('\n');
  const need = asks.length || extra.length
    ? `Thank you for this referral to hematology. To finish triaging it, we still need:\n${lines}\n\nOnce these are in, we will re-triage it — no new referral order is needed.${p.mrn === WORKED ? ' The window for this referral closes Jan 12, 2027.' : ''}`
    : 'Thank you for this referral to hematology. We have what we need for now and will be in touch once triage is complete.';
  return `Dear ${prov ? prov.salutation : 'colleague'},\n\nRe: ${p.name} · MRN ${p.mrn} · referral ${p.ref}, received ${p.received}, 2026\n\n${need}\n\nThank you,\nMelissa\nHematology referral triage`;
}

const messageText = (m) => `To: ${m.to}\nSubject: ${m.subject}\n\n${m.body}`;

function renderMessage(p, m, i) {
  const open = itemsFor(p.mrn).filter((a) => !S.done[a.id] || m.include[a.id]);
  const off = m.sent ? 'disabled' : '';
  const extra = algorithmAsks(p);
  const asks = open.length || extra.length
    ? open.map((a) => `<label><input type="checkbox" data-act="msgItem" data-v="${i}:${a.id}" ${m.include[a.id] ? 'checked' : ''} ${off}> ${a.item}<span class="d">due ${dueLabel(a)}</span></label>`).join('')
      + extra.map((a) => `<label><input type="checkbox" data-act="msgItem" data-v="${i}:${a.id}" ${m.include[a.id] ? 'checked' : ''} ${off}> ${a.item}<span class="d">from the algorithm</span></label>`).join('')
    : '<div class="none">Nothing open on the awaiting list or missing from the algorithm, so there is nothing to ask for.</div>';
  return `<div class="msg-bot"><span class="logo sm">${ICON.logoSm}</span><div class="bot-card">
    <div class="note-head"><span class="kicker">Message to the referring provider · ${m.sent ? 'sent' : 'draft'}</span><span class="grow"></span>
      ${m.sent ? '<span class="pill xs t-accepted">Logged as sent</span>' : '<span class="ai-tag" title="Drafted by the copilot. Review and edit before sending.">AI draft</span>'}</div>
    <div class="mc">
      <label class="mc-row"><span class="k">To</span><input class="mc-in" data-msg="${i}" data-f="to" value="${esc(m.to)}" placeholder="Referring provider not on file — enter who it goes to" ${off}></label>
      <label class="mc-row"><span class="k">Subject</span><input class="mc-in" data-msg="${i}" data-f="subject" value="${esc(m.subject)}" ${off}></label>
      <fieldset class="mc-ask"><legend>What to include</legend>${asks}</fieldset>
      <textarea class="field mc-body" data-msg="${i}" data-f="body" aria-label="Message" ${off}>${esc(m.body)}</textarea>
    </div>
    <div class="note-foot">
      <span class="why">${m.sent
        ? `Logged as sent by Melissa, ${TODAY_SHORT} — in the notes and the history.`
        : 'Nothing is sent from here. Copy it into the EHR message or a fax, then mark it sent so it is logged.' + (m.edited ? ' Ticking an item redrafts the text.' : '')}</span>
      <button type="button" class="btn secondary sm" data-act="copy" data-v="${i}">${S.copied === i ? '✓ Copied' : 'Copy message'}</button>
      ${m.sent ? '' : `<button type="button" class="btn primary sm" id="msgSent${i}" data-act="msgSent" data-v="${i}" ${m.to.trim() ? '' : 'disabled'}>Mark as sent</button>`}
    </div>
  </div></div>`;
}

// What the note says now: frozen once added, the triager's edits if any, otherwise the live draft.
const noteText = (m) => m.frozen || (m.edited ? m.text : draftNote());

function renderChat(p) {
  const thread = S.chat[p.mrn] || [];
  if (!thread.length) return `<div class="chat-home">
      <h2 class="chat-hi">Melissa, take it away</h2>
    </div>`;
  const msgs = thread.map((m, i) => {
    if (m.who === 'you') return `<div class="msg-you"><div class="bubble">${esc(m.text)}</div></div>`;
    if (m.kind === 'summary') return `<div class="msg-bot"><span class="logo sm">${ICON.logoSm}</span><div class="bot-card"><div class="bot-text">
      <div class="kicker">Page summary · ${esc(m.when)}</div><ul class="sum-list">${m.lines.map((l) => `<li>${l}</li>`).join('')}</ul></div></div></div>`;
    if (m.kind === 'message') return renderMessage(p, m, i);
    if (m.kind !== 'note') return `<div class="msg-bot"><span class="logo sm">${ICON.logoSm}</span><div class="bot-card"><div class="bot-text">${esc(m.text)}</div></div></div>`;
    const text = noteText(m);
    const meta = m.frozen ? 'Added to the notes on the right. Undo to edit it again'
      : m.edited ? 'Edited by you; it no longer redrafts on its own'
        : (latestVer().n > 1 ? 'Drafted from V' + latestVer().n : 'Drafted from the tree');
    return `<div class="msg-bot"><span class="logo sm">${ICON.logoSm}</span><div class="bot-card">
      <div class="note-head"><span class="kicker">Decision note · ${m.frozen ? 'added' : 'draft'}</span><span class="grow"></span>
        <span class="ai-tag" title="Drafted by the copilot. Review before charting.">${m.edited ? 'AI draft · edited' : 'AI draft'}</span></div>
      <textarea class="field note-edit" data-note="${i}" aria-label="Decision note" ${m.frozen ? 'disabled' : ''}>${esc(text)}</textarea>
      <div class="note-foot">
        <span class="why">${meta}. Nothing is charted until you paste it.</span>
        ${m.frozen
          ? `<button type="button" class="btn secondary sm" data-act="noteUndo" data-v="${i}">Undo</button>`
          : `<button type="button" class="btn secondary sm" data-act="noteDiscard" data-v="${i}">Discard</button>
             ${m.edited ? `<button type="button" class="btn secondary sm" data-act="noteReset" data-v="${i}">Reset to draft</button>` : ''}`}
        <button type="button" class="btn secondary sm" data-act="copy" data-v="${i}">${S.copied === i ? '✓ Copied' : 'Copy'}</button>
        <button type="button" class="btn primary sm ${m.frozen ? 'done' : ''}" data-act="noteToLog" data-v="${i}" ${m.frozen ? 'disabled' : ''}>${m.frozen ? '✓ Added to notes' : 'Add to notes'}</button>
      </div>
    </div></div>`;
  }).join('');
  return `<div class="chat" aria-label="Chat about this referral">${msgs}</div>`;
}

/* ---------- Right pane: awaiting, running notes ---------- */

const TAG_TONE = { 'Decision note': 't-gap', 'Message sent': 't-accepted' };
const tagTone = (tag) => TAG_TONE[tag] || (/^V\d/.test(tag) ? 't-new' : 't-gap');

function logEvent(t, b, color) {
  const list = S.history[S.current] || (S.history[S.current] = []);
  list.push({ date: TODAY_LONG.toUpperCase(), fill: color, ring: color, t, b, fresh: true });
}

function logNote(tag, text) {
  S.added[S.current] = [{ date: TODAY_SHORT.toUpperCase(), who: 'Melissa', text, tag, fresh: true }].concat(S.added[S.current] || []);
}

// A note's icon by what it records, and a short summary for the collapsed list.
const NOTE_ICON = {
  call: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  version: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.5 6h3a4 4 0 0 1 4 4v-.5"/>',
  note: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
};
function noteIcon(n) {
  const kind = n.icon || (/^V\d/.test(n.tag || '') ? 'version' : n.tag === 'Message sent' ? 'send' : n.tag === 'Decision note' ? 'doc' : 'note');
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NOTE_ICON[kind]}</svg>`;
}
function historyIcon(e) {
  const t = e.t.toLowerCase();
  const kind = /^v\d/.test(t) ? 'version' : /message|sent|fax/.test(t) ? 'send' : /referral|received/.test(t) ? 'doc' : /still|waiting on/.test(t) ? 'clock' : /awaiting|set to|accept|decline/.test(t) ? 'flag' : 'note';
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NOTE_ICON[kind]}</svg>`;
}
function noteSummary(n) {
  if (n.sum) return n.sum;
  const first = n.text.split(/(?<=\.)\s|\n/)[0].replace(/\.$/, '');
  const short = first.length > 44 ? first.slice(0, 42).replace(/\s+\S*$/, '') + '…' : first;
  return n.tag ? `${n.tag.split(' · ')[0]}: ${short}` : short;
}

function awaitingRow(a, scope) {
  const done = !!S.done[a.id];
  const tick = `<button type="button" class="tick" data-act="tick" data-v="${a.id}" aria-pressed="${done}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${a.item}">${done ? ICON.check : ''}</button>`;
  // Late shows as the red date; the word stays for screen readers and on hover, so it is not told by colour alone to them.
  const late = dueTone(a) === 'late' && !done;
  const due = `<span class="due ${done ? '' : dueTone(a)}"${late ? ' title="Late"' : ''}>${late ? '<span class="sr-only">Late, </span>' : ''}${dueLabel(a)}</span>`;
  if (scope === 'pip') {
    return `<div class="aw-row ${done ? 'done' : ''}"><div class="aw-item">${tick}<span class="aw-text grow">${a.item}</span>${due}</div></div>`;
  }
  return `<div class="aw-row ${done ? 'done' : ''}"><div class="aw-grid">
    <span class="aw-item">${tick}<span class="aw-text">${a.item}</span></span>
    <span class="aw-sub" style="text-align: right">${a.asked}</span>${due}
  </div></div>`;
}

function draftNote() {
  const latest = latestVer();
  const ev = evaluate(latest);
  const changes = S.alg.versions.slice(1).map((v) => `V${v.n} (${v.by}, ${v.date}): ${v.what}. Why: ${v.why}`);
  const missing = missingFor(ev).map((m) => m.label + ' — ' + m.why);
  return [
    `Triage decision: ${OUTCOME[ev.end].toUpperCase()}.`,
    `Tree applied: isolated lymphopenia, external referral, rev. 4 · V${latest.n}${latest.n > 1 ? ', with changes' : ', as read from the chart'}.`,
    STEPS.map((q, i) => { const st = ev.steps['g' + (i + 1)]; return `${q.n}. ${q.q} ${TONE[st.status].label}${st.overridden ? ' (overridden)' : ''}. ${st.found}`; }).join('\n'),
    changes.length ? 'Changes:\n' + changes.join('\n') : '',
    missing.length ? 'Still missing:\n' + missing.join('\n') : '',
    NEXT[ev.end]
  ].filter(Boolean).join('\n\n');
}

/* ---------- The companion: stays over the EHR and fills in what the algorithm is missing ---------- */

const blankComp = () => ({ date: '', alc: '', wbc: '', hgb: '', plt: '', anc: '', exception: '', ai: '', src: '', err: '', sent: '' });
const comp = () => S.comp || (S.comp = blankComp());
const speechRec = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;

// Dictation fills one field: a number for a lab value, yes or no for a question, or free text for the source.
function dictate(field) {
  const Rec = speechRec();
  if (!Rec || S.listening) return;
  const r = new Rec();
  r.lang = 'en-US';
  r.interimResults = false;
  S.listening = field;
  r.onresult = (e) => {
    const said = e.results[0][0].transcript;
    const c = comp();
    if (field === 'src') c.src = said;
    else if (field === 'exception') c.exception = /\b(no|doesn'?t|does not)\b/i.test(said) ? 'false' : /\b(yes|applies)\b/i.test(said) ? 'true' : c.exception;
    else { const num = said.match(/\d+(?:\.\d+)?/); if (num) c[field] = num[0]; }
  };
  r.onerror = () => { S.listening = null; redraw(); };
  r.onend = () => { S.listening = null; redraw(); };
  r.start();
}

// Sending saves what was found in the chart as the next version, with where it was found as the reason.
function sendFromCompanion(v) {
  const [kind, step] = v.split(':');
  const c = comp();
  if (!c.src.trim()) { c.err = 'Say where in the chart you found it. That is saved as the reason.'; return; }
  const latest = latestVer();
  const data = latest.data;
  let change;
  if (kind === 'cbc') {
    const alc = parseFloat(c.alc);
    if (!(alc > 0)) { c.err = 'Enter the ALC value from the result.'; return; }
    const date = c.date || isoToday();
    const l = evaluate(latest).last;
    const set = { date, alc, src: 'Entered from the chart through the companion' };
    ['wbc', 'hgb', 'plt', 'anc'].forEach((k) => { set[k] = c[k] !== '' ? parseFloat(c[k]) : l[k]; });
    change = { step, data: Object.assign({}, data, { cbc: data.cbc.filter((x) => x.date !== date).concat(set) }), what: `CBC ${isoLabel(date)} added from the chart (ALC ${alc})` };
  } else if (kind === 'yesno') {
    if (!c.exception) { c.err = 'Pick whether an exception applies.'; return; }
    change = { step, data: Object.assign({}, data, { exception: c.exception === 'true' }), what: c.exception === 'true' ? 'Step 5 answered: an exception applies' : 'Step 5 answered: no exception applies' };
  } else {
    if (!c.ai) { c.err = 'Pick whether the evaluation is on file.'; return; }
    change = { step, data: Object.assign({}, data, { ai: Object.assign({}, data.ai, { seen: c.ai === 'true' }) }), what: c.ai === 'true' ? 'Allergy and Immunology evaluation found in the chart' : 'Allergy and Immunology evaluation not in the chart' };
  }
  const v2 = addVersion(Object.assign(change, { why: 'Found in the chart: ' + c.src.trim(), via: 'companion' }));
  S.comp = Object.assign(blankComp(), { sent: `Saved as V${v2.n}. The decision is now: ${OUTCOME[evaluate(latestVer()).end]}.` });
}

/* ---------- Algorithm: evaluate a version of the inputs ---------- */

const isoParts = (iso) => iso.split('-').map(Number);
const isoLabel = (iso, withYear) => { const [y, m, d] = isoParts(iso); return MONTHS[m - 1] + ' ' + d + (withYear || y !== TODAY.y ? ', ' + y : ''); };
const isoAge = (iso) => { const [y, m, d] = isoParts(iso); return daysSince(y, m, d); };
const isoAdd = (iso, n) => { const [y, m, d] = isoParts(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const isoGap = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const isoToday = () => toIso(dayKey(TODAY.y, TODAY.m, TODAY.d));
const latestVer = () => S.alg.versions[S.alg.versions.length - 1];
const viewedVer = () => (S.alg.view === null ? latestVer() : S.alg.versions[S.alg.view - 1]);

// Runs the isolated-lymphopenia tree on one version: each step's answer and what it found,
// and the outcome the path reaches. The first step that isn't met ends the path.
function evaluate(ver) {
  const d = ver.data;
  const sets = d.cbc.slice().sort((a, b) => a.date.localeCompare(b.date));
  const last = sets[sets.length - 1];
  const steps = {};

  const outside = ['wbc', 'hgb', 'plt', 'anc'].filter((k) => last[k] < CBC_RANGE[k][0] || last[k] > CBC_RANGE[k][1]);
  const lowNow = last.alc < CBC_RANGE.alc[0];
  steps.g1 = lowNow && !outside.length
    ? { status: 'met', found: `Yes. ALC ${last.alc} K/µL on ${isoLabel(last.date)} is low, and WBC ${last.wbc}, Hgb ${last.hgb}, Plt ${last.plt} and ANC ${last.anc} are all inside the reference range, so no other cell line is involved.` }
    : { status: 'missing', found: !lowNow
      ? `No. The newest ALC, ${last.alc} K/µL on ${isoLabel(last.date)}, is inside the reference range, so there is no isolated lymphopenia here.`
      : `No. ALC is low, but ${outside.map((k) => CBC_RANGE[k][2]).join(', ')} ${outside.length === 1 ? 'is' : 'are'} outside the reference range, so more than one cell line is involved.` };
  steps.g1.field = 'Results · CBC collected ' + isoLabel(last.date, true);

  const lows = sets.filter((x) => x.alc < CBC_RANGE.alc[0]);
  let pair = null;
  lows.forEach((a, i) => lows.slice(i + 1).forEach((b) => {
    const gap = isoGap(a.date, b.date);
    if (gap >= 14 && gap <= 84) pair = [a, b, gap];
  }));
  const repeat = AWAITING.find((a) => a.id === 'cbc');
  steps.g2 = pair
    ? { status: 'met', found: `Yes. ALC was low on ${isoLabel(pair[0].date)} (${pair[0].alc}) and ${isoLabel(pair[1].date)} (${pair[1].alc}), ${pair[2]} days apart and inside 12 weeks.` }
    : { status: 'missing', found: `Not established. The branch needs two low results at least two weeks apart, both inside 12 weeks. ${lows.length ? 'Only ' + lows.map((x) => isoLabel(x.date)).join(' and ') + (lows.length === 1 ? ' is' : ' are') + ' on file.' : 'No low result is on file.'}`,
      pending: repeat && !S.done.cbc ? `Repeat CBC with differential — requested ${repeat.asked}, due ${dueLabel(repeat)}, not back yet.` : '' };
  steps.g2.field = `Results · ${lows.length} low ${lows.length === 1 ? 'result' : 'results'} on file` + (pair ? '' : '  ·  Orders · no matching order returned');

  const age = isoAge(last.date);
  const expires = isoLabel(isoAdd(last.date, 30));
  steps.g3 = age <= 30
    ? { status: 'met', found: `It is. The newest result, ${isoLabel(last.date)}, is ${age} days old, inside the 30-day limit. It passes 30 days on ${expires}.` }
    : { status: 'missing', found: `No. The newest result, ${isoLabel(last.date)}, is ${age} days old — past the 30-day limit since ${expires}.` };
  steps.g3.field = 'Results · CBC collected ' + isoLabel(last.date, true);

  steps.g4 = d.ai.seen
    ? { status: 'met', found: `Yes. Evaluation completed ${isoLabel(d.ai.date)} at ${d.ai.where}. No immunodeficiency identified, which clears the required-department step.`, field: 'Outside records · evaluation ' + isoLabel(d.ai.date, true) }
    : { status: 'missing', found: 'No Allergy and Immunology evaluation is on file for this referral.', field: 'Outside records · no evaluation found' };

  steps.g5 = d.exception === null
    ? { status: 'gap', found: 'Cannot be answered. This branch defines no exception threshold for external referrals, so there is nothing to test the referral against. Nothing was assumed in its place.', field: 'Tree · isolated lymphopenia, external, rev. 4' }
    : { status: 'met', found: d.exception ? 'An exception applies — answered by Melissa, since the tree defines none for external referrals.' : 'No exception applies — answered by Melissa, since the tree defines none for external referrals.', field: 'Answered by Melissa · the tree is silent here' };

  // An overridden answer replaces what the tree worked out, and says so.
  Object.keys(ver.answers || {}).forEach((g) => { steps[g] = Object.assign({}, steps[g], { status: ver.answers[g], overridden: true, pending: '' }); });

  const end = steps.g1.status !== 'met' ? 'b1' : steps.g2.status !== 'met' ? 'b2' : steps.g3.status !== 'met' ? 'b3' : steps.g4.status !== 'met' ? 'b4' : 'accept';
  return { steps, end, sets, last, lows, age, expires, data: d };
}

// Changes made in the versions up to this one, by step; the most recent change to a step wins.
function overridesIn(ver) {
  const out = {};
  S.alg.versions.slice(1, ver.n).forEach((v) => { if (v.step) out[v.step] = v; });
  return out;
}

// Saves a change as the next version. The reason travels with it into the notes and the history.
function addVersion({ step, what, why, via, data, answers, replaceAnswers }) {
  const prev = latestVer();
  const v = {
    n: prev.n + 1, by: 'Melissa', date: TODAY_SHORT, what, why, via: via || 'override', step: step || null,
    data: data || prev.data,
    answers: replaceAnswers ? Object.assign({}, answers) : Object.assign({}, prev.answers, answers || {})
  };
  const before = evaluate(prev).end;
  const after = evaluate(v).end;
  S.alg.versions.push(v);
  S.alg.view = null;
  S.lastOv = { step: v.step, n: v.n, dismissed: false };
  const outcome = before === after ? `Decision unchanged: ${OUTCOME[after]}.` : `Decision changed from "${OUTCOME[before]}" to "${OUTCOME[after]}".`;
  logNote(`V${v.n} · ${v.via === 'companion' ? 'companion' : 'override'}`, `${what}. ${outcome}\nWhy: ${why}`);
  logEvent(`V${v.n}: ${what}`, `${outcome} By Melissa${v.via === 'companion' ? ' through the companion' : ''}. Why: ${why}`, '#2F5FA8');
  if (S.tree && v.step) S.tree.sel = v.step;
  showToast(`Saved as V${v.n}. ${outcome}`);
  return v;
}

// What the algorithm still needs before it can finish, in the order the tree asks for it.
function missingFor(ev) {
  const s = ev.steps;
  const m = [];
  if (s.g2.status !== 'met' && !s.g2.overridden) m.push({ id: 'cbc', step: 'g2', kind: 'cbc', label: 'A repeat CBC result', why: 'to confirm the low count is persistent (step 2)' });
  else if (s.g3.status !== 'met' && !s.g3.overridden) m.push({ id: 'cbc', step: 'g3', kind: 'cbc', label: 'A CBC from the last 30 days', why: 'the newest result is too old (step 3)' });
  if (s.g4.status !== 'met' && !s.g4.overridden) m.push({ id: 'ai', step: 'g4', kind: 'ai', label: 'Allergy and Immunology evaluation', why: 'required before hematology (step 4)' });
  if (s.g5.status === 'gap') m.push({ id: 'exception', step: 'g5', kind: 'yesno', label: 'Does an exception apply?', why: "the tree doesn't define one for external referrals (step 5), so it's your call" });
  return m;
}

const LEAD = {
  b2: 'Hold as awaiting until a repeat CBC confirms the low count.',
  b3: 'Hold as awaiting: the newest CBC is too old, so a new one is needed.',
  b4: 'Decline for now: Allergy and Immunology should see the patient first.',
  b1: 'Move to the cytopenia tree: this is not an isolated low lymphocyte count.',
  accept: 'Accept for a face-to-face hematology visit.'
};
const NEXT = {
  b2: 'Next: chase the repeat CBC with Northgate.',
  b3: 'Next: request a new CBC from Northgate.',
  b4: 'Next: ask the practice to refer to Allergy and Immunology.',
  b1: 'Next: triage on the cytopenia tree.',
  accept: 'Next: send to scheduling for a new-patient visit.'
};

// The executive summary: five short, directive lines worked out from the same evaluation as the tree.
function summaryLines(ev) {
  const s = ev.steps;
  const l = ev.last;
  const repeat = AWAITING.find((a) => a.id === 'cbc');
  return [
    LEAD[ev.end],

    s.g2.status === 'met'

      : `Persistence isn't confirmed: ${ev.lows.length} low result on file.` + (repeat && !S.done.cbc ? ` Repeat CBC requested ${repeat.asked}, due ${dueLabel(repeat)}.` : ''),
    ev.age <= 30

      : `The newest result is ${ev.age} days old, past the 30-day limit.`,
    NEXT[ev.end] + (s.g5.status === 'gap' ? " The exception (step 5) is your call; the tree doesn't define one." : '')
  ];
}

// What each node was read from, opened on request. The kind varies with the step:

const LAB_COLS = ['Test', 'Result', 'Reference', 'Flag'];
function sourcesFor(id, ev) {

  const repeat = AWAITING.find((a) => a.id === 'cbc');

  const all = {
    root: [{ kind: 'Referral', title: 'REF-2026-4471 · received Oct 27, 2026', kv: RECORD.map((f) => [f.k, f.v]) }],
    g1: [{ kind: 'Labs', title: 'CBC with differential · collected ' + isoLabel(l.date, true), from: l.src, cols: LAB_COLS, rows: ['wbc', 'alc', 'hgb', 'plt', 'anc'].map(lab) }],
    g2: [
      { kind: 'Labs', title: 'Lymphocyte count over time', from: 'Every CBC on file', cols: ['Collected', 'ALC', 'Reference', 'Flag'],

        quote: 'Evaluated for recurrent infection and immunodeficiency. Immunoglobulin levels within normal limits. No primary immunodeficiency identified. Lymphopenia persists; defer to hematology as referred.' }]
      : [{ kind: 'Outside records', title: 'No Allergy and Immunology evaluation found', foot: 'Nothing in the outside records or the chart. Marked not on file.' }],

      kv: [['Internal referrals', 'Exception criteria are listed'], ['External referrals', 'No exception criteria in this revision']],
      foot: 'Read from the decision tree document. Nothing is inferred where the tree is silent.' }],
    b2: [
      { kind: 'Status history', title: 'Set to awaiting', kv: [['Set', 'Oct 28, 2026 · K. Lozano'], ['Waiting on', 'Repeat CBC with differential'], ['Window closes', 'Jan 12, 2027']] },
      ...def('Outcome · awaiting, persistence not confirmed', 'Hold; request a repeat CBC; re-triage on receipt')
    ],
    accept: def('Outcome · accept, face-to-face', 'Send to scheduling for a new-patient hematology visit'),
    b1: def('Outcome · leave this tree', 'Triage on the cytopenia tree instead'),
    b3: def('Outcome · awaiting, newest draw too old', 'Request a repeat CBC; hold until it is drawn'),
    b4: def('Outcome · decline', 'Recommend Allergy and Immunology evaluation first; re-refer after')
  };
  return all[id];
}
const chainOf = (id) => { const out = []; for (let c = id; c; c = NODE[c].parent) out.push(c); return out; };
const OUTCOME = {
  b2: 'Awaiting — hold for the repeat CBC',

};

function nodeInfo(n, ev) {
  if (n.kind === 'step') {
    const st = ev.steps[n.id];
    return { kicker: 'Step ' + (n.step + 1), title: STEPS[n.step].q, status: st.status, chip: TONE[st.status].label, chipCls: 't-' + st.status };

      : { kicker: n.kicker, title: n.title, status: 'cold', chip: 'Not reached', chipCls: 't-cold' };
  }
  return { kicker: n.kicker, title: n.title, status: 'root', chip: '', chipCls: '' };
}

function showToast(text) {
  const key = Date.now();
  S.toast = { text, key };
  setTimeout(() => { if (S.toast && S.toast.key === key) { S.toast = null; redraw(); } }, 4200);
}

const LANES = [['root'], ['g1', 'b1'], ['g2', 'b2'], ['g3', 'b3'], ['g4', 'b4'], ['g5'], ['accept']];

function treeNode(id, ev, path, ov) {
  const n = NODE[id];
  const on = path.has(id);
  const sel = S.tree.sel === id;
  let title; let sub; let mark = ''; let cls = '';
  let badge = '';
  if (n.kind === 'step') {
    const st = ev.steps[id];
    title = SHORT[id]; sub = on ? stepSub(st) : 'Not reached · ' + stepSub(st); mark = markFor(st); cls = st.status;
    badge = st.pending ? '<span class="sn-badge">Pending</span>' : ov[id] ? `<span class="sn-badge blue">Changed in V${ov[id].n}</span>` : '';
  } else if (n.kind === 'end') {
    title = n.title; sub = id === ev.end ? (id === 'accept' ? 'Ends here' : 'Stopped here') : 'Not reached'; cls = 'end';
  } else {
    title = 'Lymphopenia · external'; sub = 'REF-2026-4471';

  return `<button type="button" class="tnode ${cls} ${on ? 'on' : 'off'} ${sel ? 'sel' : ''}" data-act="treeSel" data-v="${id}" aria-pressed="${sel}">

// The evidence a doctor would want for each step, in the form that suits it.
function evidenceFor(id, ev) {
  const l = ev.last;
  if (id === 'g1') {
    const rows = ['alc', 'wbc', 'hgb', 'plt', 'anc'].map((k) => {
      const [lo, hi, label, unit] = CBC_RANGE[k];
      const f = l[k] < lo ? 'Low' : l[k] > hi ? 'High' : 'In range';
      return `<tr><th scope="row">${label}</th><td class="mono">${l[k]} <span class="u">${unit}</span></td><td class="mono u">${lo}–${hi}</td><td><span class="pa ${f === 'In range' ? 'present' : 'pending'}">${f}</span></td></tr>`;
    }).join('');
    return `<p>Every cell line on the newest CBC (${isoLabel(l.date, true)}). Isolated means only the lymphocytes are out of range.</p>
      <div class="lsum-wrap" style="margin-top: 10px"><table class="lsum"><thead><tr><th scope="col">Line</th><th scope="col">Result</th><th scope="col">Range</th><th scope="col">Flag</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (id === 'g2') {

      <div class="trend-box">${trendSvg(ev.sets, 'alc', true)}</div>

  }
  if (id === 'g3') {

    return `<p>Newest CBC ${isoLabel(l.date, true)}: <strong>${ev.age} days old</strong> of a 30-day limit. ${ev.age <= 30 ? 'It passes 30 days on ' + ev.expires + '.' : 'Past the limit since ' + ev.expires + '.'}</p>
      <div class="meter" role="img" aria-label="${ev.age} of 30 days"><i class="${ev.age > 30 ? 'over' : ev.age > 21 ? 'near' : ''}" style="width: ${pct}%"></i></div>
      <div class="meter-x"><span>Collected</span><span>30 days</span></div>`;
  }
  if (id === 'g4') {
    const d = ev.data.ai;
    return d.seen
      ? `<div class="ev-row" style="border: 0; padding-top: 0"><div class="grow"><div class="t">Allergy and Immunology evaluation</div><div class="d">${d.where} · ${isoLabel(d.date, true)}</div>

      : `<div class="ev-row" style="border: 0; padding-top: 0"><div class="grow"><div class="t">Allergy and Immunology evaluation</div><div class="d">Not in the outside records or the chart.</div></div>${presence('absent', 'Absent')}</div>`;

  }

  }
  return '';
}

      ${sec('Evidence', evidenceFor(id, ev))}
      ${pvSec}
      ${st.status === 'gap' ? `<div class="s-aside purple"><strong>A gap in the tree, not in the chart.</strong> Flagged for the tree owner. Answer it with an override if you can.</div>` : ''}
      ${o ? sec('Change history', `<div class="s-aside blue" style="margin-top: 0"><strong>V${o.n}</strong> · ${o.by}, ${o.date}: ${esc(o.what)}.<br>Why: “${esc(o.why)}”</div>`) : ''}
      ${prevRow}
      ${S.lastOv && S.lastOv.step === id ? nextStepPanel('side') : ''}
      ${sec('Override', readOnly ? '<p class="muted">This is an earlier version. Go back to the latest to change this step.</p>'
        : S.ov && S.ov.id === id ? overrideForm(id) : `<button type="button" class="btn secondary sm" data-act="ovOpen" data-v="${id}">Override this step</button>`)}`;
  } else if (n.kind === 'end') {
    const reached = id === ev.end;
    head = '<span class="lane-tag">Outcome</span>';
    body = `<div class="side-ic">${nodeIcon('end')}</div>
      <h3 class="side-t">${n.title}</h3>
      <span class="pill ${reached ? (id === 'accept' ? 't-met' : 't-awaiting') : 't-cold'}">${reached ? (id === 'accept' ? 'Ends here' : 'Stopped here') : 'Not reached'}</span>
      ${sec('What it means', `<p>${n.reason}</p>`)}
      ${reached ? sec('Next', `<p>${NEXT[id]}</p>`) : ''}
      ${pvSec}
      ${prevRow}`;
  } else {
    head = '<span class="lane-tag">Referral</span>';
    body = `<div class="side-ic">${nodeIcon('root')}</div>
      <h3 class="side-t">Lymphopenia · external request</h3>
      ${sec('How it was routed', `<p>${n.reason}</p>`)}
      ${sec('The referral', evidenceFor('root', ev))}
      ${pvSec}`;
  }
  return `<aside class="tm-side" aria-label="Selected node">
    <div class="side-top">${head}<span class="grow"></span><button type="button" class="icon-btn lg" data-act="treeSel" data-v="" aria-label="Close the sidebar">${ICON.close}</button></div>
    ${body}
  </aside>`;
}

// One lab over time, opened from a link in the triage note.
function renderLabTrend() {
  const k = S.labTrend;
  if (!k || S.view !== 'patient' || S.current !== WORKED) return '';
  const ev = evaluate(latestVer());
  const [lo, hi, label, unit] = CBC_RANGE[k];
  const sets = ev.sets;
  const rows = sets.slice().reverse().map((x) => {
    const flag = x[k] < lo ? 'Low' : x[k] > hi ? 'High' : 'In range';
    return `<tr><td class="mono">${isoLabel(x.date, true)}</td><td class="mono ${flag === 'In range' ? '' : 'low'}">${x[k]} <span class="u">${unit}</span></td>
      <td><span class="pill xs ${flag === 'In range' ? 't-met' : 't-awaiting'}">${flag}</span></td><td class="lt-src">${esc(x.src || 'Chart')}</td></tr>`;
  }).join('');
  return `<div class="lt-wrap">
    <button type="button" class="lt-scrim" data-act="labTrendClose" aria-label="Close the trend" tabindex="-1"></button>
    <div class="lt" role="dialog" aria-modal="true" aria-labelledby="ltTitle">
      <div class="lt-head">
        <div class="grow"><div class="kicker">Lab trend</div><h2 id="ltTitle" class="lt-t">${label} · ${LAB_NAME[k]}</h2>
          <div class="lt-sub">Reference ${lo}–${hi} ${unit} · ${sets.length} result${sets.length === 1 ? '' : 's'} on file${latestVer().n > 1 ? ` · as of V${latestVer().n}` : ''}</div></div>
        <button type="button" class="icon-btn lg" id="ltClose" data-act="labTrendClose" aria-label="Close the trend">${ICON.close}</button>
      </div>
      <div class="trend-box">${trendSvg(sets, k, true)}</div>
      <div class="lsum-wrap lt-table"><table class="lsum">
        <thead><tr><th scope="col">Collected</th><th scope="col">${label}</th><th scope="col">Flag</th><th scope="col">Source</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="lt-foot"><span class="grow">Shaded: the reference range. Amber points are out of range.</span>
        <button type="button" class="btn secondary sm" data-act="labTrendShow" data-v="${k}">Show in the Lab summary</button></div>
    </div>
  </div>`;
}

function renderTreeModal() {
  if (!S.tree || S.view !== 'patient' || S.current !== WORKED) return '';
  const viewed = viewedVer();
  const ev = evaluate(viewed);
  const path = new Set(chainOf(ev.end));
  const ov = overridesIn(viewed);
  const laneN = (id) => {
    if (id === 'root') return '';
    if (id === 'accept') return ev.end === 'accept' ? 'Ends here' : '';
    const st = ev.steps[id];
    return path.has(id) ? stepSub(st) : 'Not reached';
  };
  const lanes = LANES.map(([a, b], i) => {
    const last = i === LANES.length - 1;
    const inEdge = i > 0 && path.has(a) && path.has(LANES[i - 1][0]);
    const outEdge = !last && path.has(a) && path.has(LANES[i + 1][0]);
    const down = b && path.has(b);
    return `<div class="lane">
      <div class="lane-h"><span class="lane-tag">${LANE[a]}</span><span class="lane-n">${laneN(a)}</span></div>
      <div class="lcell a">
        ${i > 0 ? `<i class="ln l ${inEdge ? 'on' : ''}"></i>` : ''}
        ${last ? '' : `<i class="ln r ${outEdge ? 'on' : ''}"></i>`}
        ${b ? `<i class="ln d ${down ? 'on' : ''}"></i>` : ''}
        ${treeNode(a, ev, path, ov)}
      </div>
      <div class="lcell b">${b ? `<i class="ln u ${down ? 'on' : ''}"></i>${treeNode(b, ev, path, ov)}` : ''}</div>
    </div>`;
  }).join('');
  return `
    <div class="tm-scrim" role="dialog" aria-modal="true" aria-label="Decision tree">
      <div class="tm">
        <div class="tm-head">
          <span class="tm-ic">${NODE_ICON.g1.replace(/18/g, '22')}</span>
          <div class="grow" style="min-width: 0">
            <div class="tm-t">Isolated lymphopenia · external</div>
            <div class="tm-s">${byMrn(WORKED).name} · rev. 4 · showing V${viewed.n}</div>
          </div>
          ${versionChips()}
          <button type="button" class="icon-btn lg" data-act="treeClose" aria-label="Close the tree" title="Close (Esc)">${ICON.close}</button>
        </div>
        <div class="tm-sub">${decisionLine()}${restoreRow()}</div>
        <div class="tm-main">
          <div class="tree-body"><div class="lanes">${lanes}</div>
            <div class="tree-key"><span><i class="ln-k on"></i> The path to the decision</span><span><i class="ln-k"></i> Not taken</span><span>Click any step to see the decision, how it was made and the evidence.</span></div>
          </div>
          ${S.tree.sel ? treeSide(S.tree.sel, ev, viewed) : ''}
        </div>
      </div>
    </div>`;
}

/* ---------- Events ---------- */

const ACT = {
  day: (v) => {
    if (!S.rangeMode) { S.day = S.day === v ? null : v; return; }
    // First click starts a range, second click ends it (in either order); a third starts again.
    const r = S.range;
    if (!r.from || r.to) { S.range = { from: v, to: null }; return; }
    S.range = keyNum(v) < keyNum(r.from) ? { from: v, to: r.from } : { from: r.from, to: v };
  },
  rangeMode: () => {
    S.rangeMode = !S.rangeMode;
    S.range = S.rangeMode && S.day ? { from: S.day, to: null } : { from: null, to: null };
    S.day = null;
  },
  // Month arrows step one month, from January of the first year up to this month.
  calStep: (v) => {
    const t = S.cal.y * 12 + (S.cal.m - 1) + +v;
    const max = TODAY.y * 12 + (TODAY.m - 1);
    const min = FIRST_YEAR * 12;
    const c = Math.min(max, Math.max(min, t));
    S.cal = { y: Math.floor(c / 12), m: (c % 12) + 1 };
    S.calPicker = null;
  },
  calPick: () => { S.calPicker = S.calPicker === null ? S.cal.y : null; },
  calYear: (v) => { S.calPicker = Math.min(TODAY.y, Math.max(FIRST_YEAR, S.calPicker + +v)); },
  calMonth: (v) => { S.cal = { y: S.calPicker, m: +v }; S.calPicker = null; },
  calToday: () => { S.cal = { y: TODAY.y, m: TODAY.m }; S.calPicker = null; },
  clearDay: () => { S.day = null; S.range = { from: null, to: null }; },
  filter: (v) => { S.filter = v; },
  open: (v) => {
    if (S.current !== v) { S.copied = null; S.comp = null; }
    // Opening a profile from the day shows only the awaiting column; the list is one click away.
    if (S.view === 'queue') Object.assign(S, { railCollapsed: true, trackCollapsed: false });
    S.current = v; S.view = 'patient'; S.searchMsg = ''; S.drawer = null;
  },
  toQueue: () => { S.home = 'cards'; S.view = 'queue'; S.railCollapsed = false; S.trackCollapsed = true; S.searchMsg = ''; S.drawer = null; },
  drawer: (v) => { S.drawer = S.drawer === v ? null : v; },
  closeDrawer: () => { S.drawer = null; },
  // Where the column is a drawer, its hide button closes the drawer instead.
  collapse: (v) => {
    const drawer = matchMedia(v === 'rail' ? '(max-width: 1023px)' : '(max-width: 767px)').matches;
    if (drawer) S.drawer = null;
    else S[v + 'Collapsed'] = true;
  },
  expand: (v) => { S[v + 'Collapsed'] = false; },
  ask: (v) => { ask(v); },
  dash: (v) => { S.dash = v; },
  dashOpen: (v) => { S.home = 'dash'; S.dashFocus = v; S.dashScroll = true; },
  dashHome: () => { S.home = 'cards'; S.dashFocus = null; },
  noteTab: (v) => { S.noteTab = v; },
  panelTab: (v) => { S.panelTab = v; },
  srcToggle: (v) => { S.srcOpen[v] = !S.srcOpen[v]; },
  treeOpen: (v) => { S.tree = { sel: v || null }; S.ov = null; },
  treeClose: () => { S.tree = null; S.ov = null; },
  // Take the next step after a change: open it in the tree, or open it with the override form ready.
  nextStep: (v) => { S.tree = S.tree || { sel: null }; S.tree.sel = v; S.ov = null; },
  nextOverride: (v) => {
    S.tree = S.tree || { sel: null }; S.tree.sel = v; ACT.ovOpen(v);
    setTimeout(() => document.querySelector('.tm-side .ov')?.scrollIntoView({ block: 'center' }), 0);
  },
  nextDismiss: () => { if (S.lastOv) S.lastOv.dismissed = true; },
  treeSel: (v) => { S.tree.sel = v || null; S.ov = null; },
  // Overrides are written in the tree sidebar and saved as the next version.
  ovOpen: (v) => {
    const l = evaluate(latestVer()).last;
    S.ov = { id: v, mode: 'answer', choice: '', why: '', err: '', cbc: { date: isoToday(), alc: '', wbc: l.wbc, hgb: l.hgb, plt: l.plt, anc: l.anc } };
  },
  ovMode: (v) => { S.ov.mode = v; S.ov.choice = ''; S.ov.err = ''; },
  ovPick: (v) => { S.ov.choice = v; S.ov.err = ''; },
  ovCancel: () => { S.ov = null; },
  pnOpen: (v) => { S.pnOpen = v; S.pnErr = ''; setTimeout(() => document.getElementById('pnText')?.focus(), 0); },
  pnCancel: () => { S.pnOpen = null; S.pnErr = ''; },
  pnSave: (v) => {
    const t = (document.getElementById('pnText')?.value || '').trim();
    if (!t) { S.pnErr = 'Write the note before saving.'; return; }
    (S.pn[v] = S.pn[v] || []).unshift({ who: 'Melissa', role: 'Triage nurse (you)', date: TODAY_SHORT, src: 'Added in the decision tree', text: t, fresh: true });
    S.pnOpen = null; S.pnErr = '';
  },
  ovSave: () => {
    const o = S.ov;
    const id = o.id;
    const d = latestVer().data;
    const reason = o.why.trim();
    const lab = o.mode === 'evidence' && ['g1', 'g2', 'g3'].includes(id);
    if (lab ? !(o.cbc.date && o.cbc.alc !== '') : !o.choice) { o.err = lab ? 'Enter the collection date and the ALC.' : 'Pick an answer.'; return; }
    if (!reason) { o.err = 'Say why. The reason is saved with the version.'; return; }
    const stepN = NODE[id].step + 1;
    let change;
    if (id === 'g5') change = { data: Object.assign({}, d, { exception: o.choice === 'true' }), what: o.choice === 'true' ? 'Step 5 answered: an exception applies' : 'Step 5 answered: no exception applies' };
    else if (o.mode === 'answer') change = { answers: { [id]: o.choice }, what: `Step ${stepN} set to ${o.choice === 'met' ? 'Met' : 'Not met'}` };
    else if (id === 'g4') change = { data: Object.assign({}, d, { ai: Object.assign({}, d.ai, { seen: o.choice === 'true' }) }), what: o.choice === 'true' ? 'Allergy and Immunology evaluation marked on file' : 'Allergy and Immunology evaluation marked not on file' };
    else {
      const set = { date: o.cbc.date, src: 'Entered by Melissa' };
      ['alc', 'wbc', 'hgb', 'plt', 'anc'].forEach((k) => { set[k] = parseFloat(o.cbc[k]); });
      const exists = d.cbc.some((x) => x.date === o.cbc.date);
      change = { data: Object.assign({}, d, { cbc: d.cbc.filter((x) => x.date !== o.cbc.date).concat(set) }), what: `CBC ${isoLabel(o.cbc.date)} ${exists ? 'corrected' : 'added'} (ALC ${set.alc})` };
    }
    S.ov = null;
    addVersion(Object.assign(change, { step: id, why: reason }));
  },
  tick: (v) => { S.done[v] = !S.done[v]; },
  // Inline lab change from the Lab summary: one value on one date, saved as the next version with a reason.
  labEdit: (v) => {
    const [k, date] = v.split('|');
    if (S.labEdit && S.labEdit.k === k && S.labEdit.date === date) { S.labEdit = null; return; }
    const set = latestVer().data.cbc.find((x) => x.date === date);
    S.labEdit = { k, date, val: set ? set[k] : '', why: '', err: '' };
    setTimeout(() => document.getElementById('labEditVal')?.focus(), 0);
  },
  labCancel: () => { S.labEdit = null; },
  noteOpen: (v) => { S.noteOpen[v] = !S.noteOpen[v]; },
  labTrend: (v) => { S.labTrend = v; setTimeout(() => document.getElementById('ltClose')?.focus(), 0); },
  labTrendClose: () => { const k = S.labTrend; S.labTrend = null; setTimeout(() => document.querySelector(`.lab-link[data-v="${k}"]`)?.focus(), 0); },
  labTrendShow: () => { S.labTrend = null; S.noteTab = 'labs'; setTimeout(() => document.querySelector('.lsum')?.scrollIntoView({ block: 'nearest' }), 0); },
  labSave: () => {
    const le = S.labEdit;
    const n = parseFloat(le.val);
    if (le.val === '' || Number.isNaN(n) || n < 0) { le.err = 'Enter the corrected value as a number.'; return; }
    if (!le.why.trim()) { le.err = 'Say why. The reason is saved with the version.'; return; }
    const d = latestVer().data;
    const old = d.cbc.find((x) => x.date === le.date);
    if (old[le.k] === n) { le.err = `That is already the value on ${isoLabel(le.date)}.`; return; }
    const label = CBC_RANGE[le.k][2];
    const cbc = d.cbc.map((x) => (x.date === le.date ? Object.assign({}, x, { [le.k]: n, src: 'Corrected by Melissa' }) : x));
    S.labEdit = null;
    addVersion({ step: null, what: `${label} on ${isoLabel(le.date)} changed from ${old[le.k]} to ${n}`, why: le.why.trim(), data: Object.assign({}, d, { cbc }) });
  },
  // Versions: look at any of them; the latest drives the decision. Restoring an old one saves it as the next.
  algView: (v) => { S.alg.view = +v === latestVer().n ? null : +v; S.restoreMsg = ''; S.labEdit = null; },
  algRestore: (v) => {
    const why = ((document.querySelector((S.tree ? '.tm' : '.centre') + ' .restore-why') || {}).value || '').trim();
    if (!why) { S.restoreMsg = 'Say why before restoring it.'; return; }
    const old = S.alg.versions[+v - 1];
    S.restoreMsg = '';
    addVersion({ step: null, what: `Restored V${old.n}`, why, data: old.data, answers: old.answers, replaceAnswers: true });
  },
  compPick: (v) => { const [k, val] = v.split(':'); comp()[k] = val; comp().err = ''; },
  compSend: (v) => { sendFromCompanion(v); },
  dictate: (v) => { dictate(v); },
  noteToLog: (v) => {
    const m = S.chat[S.current][+v];
    if (!noteText(m).trim()) return;
    m.frozen = noteText(m);
    m.logged = { date: TODAY_SHORT.toUpperCase(), who: 'Melissa', text: m.frozen, tag: 'Decision note', fresh: true };
    S.added[S.current] = [m.logged].concat(S.added[S.current] || []);
  },
  // Undo takes the note back out of the patient's notes and makes it editable again.
  noteUndo: (v) => {
    const m = S.chat[S.current][+v];
    S.added[S.current] = (S.added[S.current] || []).filter((n) => n !== m.logged);
    m.text = m.frozen;
    m.edited = m.edited || m.frozen !== draftNote();
    m.frozen = null;
    m.logged = null;
  },
  // Discard drops the draft, and the request that asked for it, from the chat.
  noteDiscard: (v) => {
    const thread = S.chat[S.current];
    const i = +v;
    const from = i > 0 && thread[i - 1].who === 'you' ? i - 1 : i;
    thread.splice(from, i - from + 1);
    S.copied = null;
  },
  noteReset: (v) => {
    const m = S.chat[S.current][+v];
    m.edited = false;
    m.text = null;
  },
  msgItem: (v) => {
    const [i, id] = v.split(':');
    const m = S.chat[S.current][+i];
    if (m.sent) return;
    m.include[id] = !m.include[id];
    m.body = messageBody(byMrn(S.current), m);
    m.edited = false;
  },
  // Marking it sent records the message where the rest of the referral's story lives.
  msgSent: (v) => {
    const m = S.chat[S.current][+v];
    if (!m.to.trim() || m.sent) return;
    const asked = itemsFor(S.current).filter((a) => m.include[a.id]);
    asked.forEach((a) => { a.asked = TODAY_SHORT; });
    m.sent = true;
    const all = asked.map((a) => a.item).concat(algorithmAsks(byMrn(S.current)).filter((a) => m.include[a.id]).map((a) => a.item));
    const what = all.length ? all.join('; ') : 'no outstanding items';
    logNote('Message sent', `Sent a message to ${m.to}.\nAsked for: ${what}.\nSubject: ${m.subject}`);
    logEvent('Message sent to the referring provider', `To ${m.to}. Asked for: ${what}. Sent by Melissa outside the copilot and logged here.`, '#2F5FA8');
  },
  copy: (v) => {
    const m = S.chat[S.current][+v];
    const text = m.kind === 'message' ? messageText(m) : noteText(m);
    const keep = () => [...document.querySelectorAll('.centre-scroll, .panel-body')].map((c) => c.scrollTop);
    const done = () => {
      const top = keep(); S.copied = +v; render();
      document.querySelectorAll('.centre-scroll, .panel-body').forEach((c, i) => { c.scrollTop = top[i]; });
      setTimeout(() => { const t = keep(); S.copied = null; render(); document.querySelectorAll('.centre-scroll, .panel-body').forEach((c, i) => { c.scrollTop = t[i]; }); }, 1800);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
    else done();
  },
  toPip: () => { S.view = 'pip'; S.pipCollapsed = false; S.drawer = null; S.tree = null; S.ov = null; },
  pipCollapse: () => { S.pipCollapsed = true; },
  pipExpand: () => { S.pipCollapsed = false; },
  toFull: () => { S.view = 'patient'; S.trackCollapsed = false; }
};

const PANES = '.rail-scroll, .centre-scroll, .panel-body, .tree-body, .tm-side';

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  const scrollers = [...document.querySelectorAll(PANES)].map((s) => s.scrollTop);
  fn(el.dataset.v);
  if (el.dataset.act === 'copy') return;
  render();
  // Keep scroll positions when the same view redraws, so ticking does not jump the list.
  if (!['open', 'toQueue', 'tab', 'toFull', 'mode', 'dashOpen', 'dashHome', 'nextStep', 'nextOverride'].includes(el.dataset.act)) {
    document.querySelectorAll(PANES).forEach((s, i) => { if (scrollers[i] != null) s.scrollTop = scrollers[i]; });
  }
  scrollToChat();
  focusDash();
});

// Redraw from outside a click (the tree canvas), keeping every pane where it was scrolled.
function redraw() {
  const keep = [...document.querySelectorAll(PANES)].map((el) => el.scrollTop);
  render();
  document.querySelectorAll(PANES).forEach((el, i) => { if (keep[i] != null) el.scrollTop = keep[i]; });
}

function scrollToChat() {
  if (!S.scrollChat) return;
  S.scrollChat = false;
  const c = document.querySelector('.panel-body');
  if (c) c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' });
}

// Typing in the decision note keeps focus; the edits replace the live draft.
document.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.note;
  if (i == null) return;
  const m = (S.chat[S.current] || [])[+i];
  if (!m || m.frozen) return;
  m.text = e.target.value;
  m.edited = true;
});

// Typing in the message keeps focus: fields update the draft in place.
document.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.msg;
  if (i == null) return;
  const m = (S.chat[S.current] || [])[+i];
  if (!m || m.sent) return;
  m[e.target.dataset.f] = e.target.value;
  if (e.target.dataset.f === 'body') m.edited = true;
  const sent = document.getElementById('msgSent' + i);
  if (sent) sent.disabled = !m.to.trim();
});

// Inline lab change fields keep what's typed between redraws.
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.le;
  if (!k || !S.labEdit) return;
  S.labEdit[k] = e.target.value;
});

// Override fields keep what's typed between redraws.
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.ov;
  if (!k || !S.ov) return;
  if (k === 'why') S.ov.why = e.target.value;
  else S.ov.cbc[k] = e.target.value;
});

// Companion fields keep what's typed between redraws.
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.comp;
  if (!k) return;
  comp()[k] = e.target.value;
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'rangeFrom' || e.target.id === 'rangeTo') {
    const v = fromIso(e.target.value);
    const r = Object.assign({}, S.range, { [e.target.id === 'rangeFrom' ? 'from' : 'to']: v });
    if (!r.from && r.to) { r.from = r.to; r.to = null; }
    if (r.from && r.to && keyNum(r.to) < keyNum(r.from)) S.range = { from: r.to, to: r.from };
    else S.range = r;
    // Show the month the range starts in.
    if (S.range.from) { const [y, m] = S.range.from.split('-').map(Number); S.cal = { y, m }; }
    redraw();
    return;
  }
  // Switching patients from the companion keeps it open on the new patient.
  if (e.target.id === 'compPatient') {
    S.current = e.target.value;
    S.comp = null;
    redraw();
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'search') return;
  e.preventDefault();
  const q = document.getElementById('search').value.trim();
  if (!q) return;
  const digits = q.replace(/\D/g, '');
  const ql = q.toLowerCase();
  const hit = PEOPLE.find((p) => (digits.length >= 3 && p.mrn.replace(/\D/g, '').includes(digits)) || (ql.length >= 3 && surname(p).toLowerCase().startsWith(ql)));
  if (hit) {
    ACT.open(hit.mrn);
  } else if (S.view === 'patient') {
    S.searchMsg = '';
    ask(q);
  } else {
    S.searchMsg = digits.length >= 3
      ? `No open referral matches “${q}”. Check the MRN — closed referrals live in the master list.`
      : `No patient matches “${q}”. Open a patient to ask about their referral, or search by MRN or surname.`;
  }
  render();
  scrollToChat();
});

// Text cut off with an ellipsis shows in full on hover, or when its row has keyboard focus.
// Hovering anywhere on the row is enough; nothing shows when the text already fits.
const TRUNC = [['.aw-row', '.aw-text'], ['.rail-row', '.name'], ['.t-head', '.title']];
const tip = document.createElement('div');
tip.className = 'tip';
tip.setAttribute('role', 'tooltip');
tip.hidden = true;
document.body.appendChild(tip);

function truncatedIn(node) {
  const t = node && node.closest && node.closest('[data-tip]');
  if (t) return { textContent: t.dataset.tip, getBoundingClientRect: () => t.getBoundingClientRect(), scrollWidth: 1, clientWidth: 0 };
  for (const [row, text] of TRUNC) {
    const r = node && node.closest && node.closest(row);
    const el = r && r.querySelector(text);
    if (el) return el.scrollWidth > el.clientWidth ? el : null;
  }
  return null;
}

function showTip(el) {
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.textContent;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left - 9, innerWidth - t.width - 8));
  const top = r.top - t.height - 6 < 8 ? r.bottom + 6 : r.top - t.height - 6;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

document.addEventListener('mouseover', (e) => showTip(truncatedIn(e.target)));
document.addEventListener('focusin', (e) => showTip(truncatedIn(e.target)));
document.addEventListener('focusout', () => { tip.hidden = true; });
document.addEventListener('click', () => { tip.hidden = true; }, true);
document.addEventListener('scroll', () => { tip.hidden = true; }, true);

/* ---------- Resizing the side columns ---------- */

const SIDE_MIN = { rail: 260, track: 300 };
const SIDE_MAX = { rail: 480, track: 640 };
const CENTRE_MIN = 480; // the main screen never gets narrower than this
try { const w = JSON.parse(localStorage.getItem('tc-widths') || '{}'); S.railW = w.rail || null; S.trackW = w.track || null; } catch (err) { /* storage blocked: use the defaults */ }
const saveWidths = () => { try { localStorage.setItem('tc-widths', JSON.stringify({ rail: S.railW, track: S.trackW })); } catch (err) { /* not saved; fine */ } };

function setSideWidth(side, w) {
  const cols = document.querySelector('.cols');
  const os = side === 'rail' ? 'track' : 'rail';
  const other = document.getElementById(os);
  // The other column's width as set, not as measured: it may still be animating to it.
  const otherW = !other ? 0 : other.classList.contains('collapsed') ? 48 : (S[os + 'W'] || other.getBoundingClientRect().width);
  const room = cols.clientWidth - otherW - CENTRE_MIN;
  const v = Math.round(Math.max(SIDE_MIN[side], Math.min(SIDE_MAX[side], room, w)));
  S[side + 'W'] = v;
  cols.style.setProperty('--' + side + '-w', v + 'px');
}

let drag = null;
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-resize]');
  if (!h || e.button !== 0) return;
  e.preventDefault();
  const side = h.dataset.resize;
  drag = { side, h, x: e.clientX, w: document.getElementById(side).getBoundingClientRect().width };
  h.setPointerCapture(e.pointerId);
  h.classList.add('on');
  document.body.classList.add('resizing');
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  setSideWidth(drag.side, drag.w + (drag.side === 'rail' ? dx : -dx));
});
const endDrag = () => {
  if (!drag) return;
  drag.h.classList.remove('on');
  document.body.classList.remove('resizing');
  drag = null;
  saveWidths();
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
// A narrower window re-checks the widths so the main screen keeps its room.
window.addEventListener('resize', () => {
  if (!document.querySelector('.cols')) return;
  if (S.railW) setSideWidth('rail', S.railW);
  if (S.trackW) setSideWidth('track', S.trackW);
});
// Double-click puts the column back to its default width.
document.addEventListener('dblclick', (e) => {
  const h = e.target.closest('[data-resize]');
  if (!h) return;
  const side = h.dataset.resize;
  S[side + 'W'] = null;
  document.querySelector('.cols').style.removeProperty('--' + side + '-w');
  saveWidths();
});
// Arrow keys on a focused handle resize in 16px steps.
document.addEventListener('keydown', (e) => {
  const h = e.target.closest && e.target.closest('[data-resize]');
  if (!h || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault();
  const side = h.dataset.resize;
  const grow = (e.key === 'ArrowRight') === (side === 'rail');
  // Step from the width last set, not the measured one, which lags while the width animates.
  setSideWidth(side, (S[side + 'W'] || document.getElementById(side).getBoundingClientRect().width) + (grow ? 16 : -16));
  saveWidths();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.labTrend) { ACT.labTrendClose(); redraw(); return; }
  if (e.key === 'Escape' && S.labEdit && !S.tree) { S.labEdit = null; redraw(); return; }
  if (e.key === 'Escape' && S.tree) { if (S.pnOpen) { S.pnOpen = null; S.pnErr = ''; } else if (S.ov) S.ov = null; else if (S.tree.sel) S.tree.sel = null; else S.tree = null; redraw(); return; }
  if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); return; }
  if (e.key === 'Escape' && S.calPicker !== null) { S.calPicker = null; redraw(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    const s = document.getElementById('search');
    if (s) { e.preventDefault(); s.focus(); }
  }
});

render();
</script>
</body>
</html>
