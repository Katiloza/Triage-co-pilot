<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #F7F6F2;
  --side: #F1F3F4;      /* the side panels: a neutral grey, so the white main screen stands forward */
  --tile: #F0F2F5;      /* the home cards: grey tiles on white, no border */
  --tile-hover: #E7EAEE;
  --surface: #FFFFFF;
  --sunk: #F3F2EE;
  --border: #E7E5DF;
  --border-strong: #DEDBD4;
  --hair: #F1EFEA;
  --ink: #1B1B19;
  --ink-2: #3A3832;
  --ink-3: #4A4843;
  --muted: #57554F;     /* about 7.5:1 on white */
  --faint: #6B6963;     /* about 5.4:1 on white, 4.9:1 on the grey sidebars: the lightest text colour allowed */
  --ghost: #A5A29A;
  --primary: #2F5FA8;
  --amber-bg: #FBF1E0; --amber: #8A5A12; --amber-dot: #C98A2B;
  --red-bg: #FBE8E4;   --red: #8A3324;
  --green-bg: #E7F4EE; --green: #0E7A52;
  --blue-bg: #E9EFF8;  --blue: #2F5FA8;
  --purple-bg: #EFEBFA; --purple: #5B4BB5;
  --shadow-card: 0 1px 2px rgba(20, 20, 15, 0.04);
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #ECEAE4;
  color: var(--ink);
  font-family: 'Figtree', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
.grow { flex-grow: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* The app fills the browser window */
.stage { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.frame { flex-grow: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; background: var(--ground); overflow: hidden; position: relative; }

/* Title bar */
.titlebar { flex-shrink: 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.lights { display: flex; gap: 7px; }
.lights span { width: 11px; height: 11px; border-radius: 50%; background: #E4E1DA; }
.logo { width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: var(--primary); }
.logo.sm { width: 20px; height: 20px; margin: 0; border-radius: 6px; }
.app-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
.today { font-size: 12px; color: var(--faint); font-family: var(--mono); }
.avatar { width: 27px; height: 27px; flex-shrink: 0; border-radius: 50%; background: #F0EFEA; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #5E5B54; }
.follow-btn, .tb-btn { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.follow-btn:hover, .tb-btn:hover { border-color: #C9C6BD; color: var(--ink); }
.tb-btn { display: none; flex-shrink: 0; }
.tb-btn[aria-expanded="true"] { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
.tb-btn .count { font-family: var(--mono); font-size: 12px; padding: 0 6px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }

.cols { flex-grow: 1; min-height: 0; display: flex; position: relative; }
.scrim { display: none; }

/* Left rail */
.rail { position: relative; width: var(--rail-w, 320px); flex-shrink: 0; transition: width 0.18s ease; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--border); }
.seg { display: flex; gap: 5px; padding: 3px; background: var(--sunk); border-radius: 9px; }
.seg button { flex: 1 1 0; min-height: 30px; border: 0; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 20, 15, 0.08); }
/* The calendar and filters stay put; only the referral list scrolls */
.rail-fixed { flex-shrink: 0; }
.rail-scroll { flex-grow: 1; min-height: 0; overflow: auto; }
/* On a short window there is no room for both, so the whole rail scrolls instead */
@media (max-height: 640px) {
  .rail { overflow-y: auto; }
  .rail-scroll { flex: none; overflow: visible; }
}
.icon-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--faint); cursor: pointer; }
.icon-btn:disabled { color: #D3D0C8; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
/* Calendar header text: --muted is about 4.7:1 on the grey sidebar, passing WCAG AA; --ghost and --faint did not */
.cal .dn { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); padding-bottom: 4px; }
.cal .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 38px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.cal .cell .n { font-size: 12px; font-weight: 500; color: var(--ink); }
.cal .cell .c { font-size: 12px; font-family: var(--mono); color: var(--faint); }
.cal .cell.today { border-color: #CFCCC3; }
.cal .cell.today .n { font-weight: 700; }
.cal .cell.sel { background: var(--primary); border-color: var(--primary); }
.cal .cell.sel .n { color: #FFFFFF; font-weight: 700; }
.cal .cell.sel .c { color: #D6E3F5; }
.cal .cell:not(.sel):hover { border-color: var(--border-strong); }
.cal .blank { min-height: 38px; }
.cal .cell.future { cursor: default; }
.cal .cell.future .n { color: #C9C6BD; }
.cal-month { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 8px; margin-left: -6px; border: 0; border-radius: 8px; background: transparent; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); cursor: pointer; }
.cal-month:hover, .cal-month[aria-expanded="true"] { background: var(--sunk); }
.cal-month svg { color: var(--faint); transition: transform 0.15s; }
.cal-month[aria-expanded="true"] svg { transform: rotate(180deg); }
.cal-cap { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; font-size: 13px; color: var(--muted); }
.cal-mode { flex-shrink: 0; min-height: 28px; padding: 0 10px; border: 1px solid #E2DFD8; border-radius: 13px; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.cal-mode[aria-pressed="true"] { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
/* Date range: typed or picked on the grid, across months */
.range-in { display: flex; align-items: center; gap: 6px; padding: 0 2px 9px; font-size: 12px; color: var(--faint); }
.range-in input { flex: 1 1 0; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); font-family: var(--mono); font-size: 12px; color: var(--ink); }
.range-in input:focus { outline: none; border-color: var(--primary); }
.cal .cell.inrange { background: var(--blue-bg); }
.cal .cell.inrange .n { color: var(--primary); font-weight: 600; }
.rail-top .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.rail-top .icon-btn:not(:disabled):hover { background: var(--sunk); color: var(--ink); }
/* Month and year picker: replaces the grid until a month is chosen */
.cal-pick { padding: 2px 0 4px; }
.cal-pick-year { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; font-size: 13px; font-weight: 600; font-family: var(--mono); }
.cal-pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cal-pick-grid button { min-height: 38px; border: 1px solid var(--hair); border-radius: 9px; background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.cal-pick-grid button:hover:not(:disabled) { border-color: var(--border-strong); }
.cal-pick-grid button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.cal-pick-grid button.now { border-color: #CFCCC3; }
.cal-pick-grid button:disabled { color: #C9C6BD; cursor: default; }
.cal-pick-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
.rail-filters { padding: 2px 12px 10px; }
.rail-filters .chips { flex-wrap: nowrap; gap: 4px; }
.rail-filters .chip { flex: 1 1 auto; padding: 0 6px; white-space: nowrap; }
.rail-top .kicker { padding-left: 2px; }
.rail-title .btn-ghost { min-height: 24px; padding: 0 8px; align-self: center; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { min-height: 28px; padding: 0 10px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--muted); border: 1px solid #E2DFD8; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.chip.active { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
.chip.sm { min-height: 26px; padding: 0 9px; border-radius: 13px; font-size: 12px; }
.btn-ghost { flex-shrink: 0; min-height: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.btn-ghost:disabled { color: #C9C6BD; cursor: default; }
.rail-title { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 7px; border-top: 1px solid var(--hair); }
.rail-title .count { font-size: 12px; color: var(--faint); font-family: var(--mono); }
.rail-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left; }
.rail-row:hover { background: rgba(20, 20, 15, 0.05); }
.rail-row.here { background: var(--blue-bg); }
.rail-row .who { flex-grow: 1; min-width: 0; }
.rail-row .name { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-row .mrn { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; font-family: var(--mono); }
.rail-empty { padding: 14px 10px; font-size: 12px; line-height: 1.5; color: var(--faint); }
.rail-foot { flex-shrink: 0; padding: 10px 12px 12px; border-top: 1px solid var(--hair); }
.btn-back { display: flex; width: 100%; align-items: center; justify-content: center; gap: 7px; min-height: 36px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; }

/* Centre */
.centre { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; background: var(--surface); }
.centre-scroll { flex-grow: 1; min-height: 0; overflow: auto; }
.r { text-align: right; }
.pill { display: inline-flex; align-items: center; height: 21px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.xs { height: 19px; padding: 0 8px; font-size: 12px; }
.t-awaiting { background: var(--amber-bg); color: var(--amber); }
.t-new { background: var(--blue-bg); color: var(--blue); }
.t-accepted, .t-met { background: var(--green-bg); color: var(--green); }
.t-declined { background: var(--red-bg); color: var(--red); }
.t-missing { background: var(--amber-bg); color: var(--amber); }
.t-gap { background: var(--purple-bg); color: var(--purple); }
.t-cold { background: var(--sunk); color: var(--faint); }

.search { flex-shrink: 0; padding: 12px 20px 16px; border-top: 1px solid var(--border); background: var(--surface); }
.search form { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 14px; background: var(--surface); border: 1.5px solid #CFCCC3; border-radius: 12px; box-shadow: 0 2px 8px rgba(20, 20, 15, 0.07); }
.search form:focus-within { border-color: var(--primary); }
.search input { flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 13.5px; color: var(--ink); padding: 0; }
.search .kbd { flex-shrink: 0; font-size: 12px; color: var(--faint); font-family: var(--mono); }
.btn-send { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; color: #FFFFFF; cursor: pointer; background: var(--primary); }
.search-msg { margin: 7px 2px 0; font-size: 12px; color: var(--muted); }

/* Patient header */
.p-head { flex-shrink: 0; padding: 16px 20px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.p-back { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; margin: -4px 0 8px -8px; padding: 0 9px 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.p-back:hover { background: var(--sunk); color: var(--ink); }
.p-id { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 13px; }
.p-name { flex: 1 1 240px; min-width: 0; }
.p-id h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.p-id .meta { font-size: 14px; color: var(--muted); margin-top: 4px; font-family: var(--mono); } /* --muted: about 5.4:1 on white, passes WCAG AA */
.facts { display: flex; gap: 28px; padding-top: 2px; margin-left: auto; white-space: nowrap; }
/* Labels in --muted (about 5.4:1 on white) so they pass WCAG AA at this size; --faint would not */
.facts .k { font-size: 13px; color: var(--muted); }
.facts .v { font-size: 16px; font-weight: 600; margin-top: 3px; }
.facts .v.late { color: var(--red); }
.pad { padding: 18px 20px 24px; }

/* Verdict */
/* Changing the decision: rationale first, then where the path should end */
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.opt { min-height: 34px; padding: 0 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink-3); border: 1px solid #E2DFD8; }
.opt[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.btn { white-space: nowrap; min-height: 40px; padding: 0 15px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn.primary { border: 0; background: var(--primary); color: #FFFFFF; }
.btn.primary.done { background: var(--green); }
.btn.primary:disabled { background: #C9C6BD; cursor: default; }
.btn.primary.done:disabled { background: var(--green); }
.btn.secondary { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 12.5px; }

textarea.field { display: block; width: 100%; resize: none; padding: 10px 11px; border: 1px solid var(--border-strong); border-radius: 9px; outline: none; background: var(--surface); font-family: inherit; font-size: 12.5px; line-height: 1.55; color: var(--ink); }
textarea.field:focus { border-color: var(--primary); }

/* Steps */
.seg-sm { flex-shrink: 0; padding: 2px; gap: 2px; }
.seg-sm button { flex: 0 0 auto; min-height: 26px; padding: 0 11px; font-size: 12px; }
/* Anything off the path the tree took is greyed, whatever its own status */
/* After a change: the tree's own route stays visible, dashed */
.key { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.key::before { content: ''; width: 16px; border-top: 2px solid var(--primary); }
.key.ai::before { border-top-style: dashed; border-top-color: #8FA7CF; }
/* Source data behind a node: closed until asked for */
.source { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: #FDFCF8; overflow: hidden; }
.src-item { padding: 12px 14px; border-top: 1px solid var(--hair); }
.src-item:first-child { border-top: 0; }
.src-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.src-kind { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-3); }
.src-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.src-from { margin-top: 3px; font-size: 12px; color: var(--faint); }
.src-scroll { overflow-x: auto; }
.src-table { width: 100%; min-width: 360px; margin-top: 8px; border-collapse: collapse; font-size: 12px; }
.src-table th { padding: 5px 8px 5px 0; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); }
.src-table td { padding: 6px 8px 6px 0; font-family: var(--mono); color: var(--ink-2); border-bottom: 1px solid var(--hair); }
.src-table tr:last-child td { border-bottom: 0; }
.src-table tr.flag td { color: var(--amber); font-weight: 600; }
.src-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; }
.src-kv dt { color: var(--faint); }
.src-kv dd { margin: 0; color: var(--ink-2); }
.src-lines { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.src-quote { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--border-strong); background: var(--surface); font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.src-foot { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.s-aside { margin-top: 10px; padding: 9px 11px; border-radius: 9px; font-size: 12px; line-height: 1.5; }
.s-aside.purple { background: var(--purple-bg); color: #3F3480; }
.s-aside.blue { background: var(--blue-bg); color: #24497F; }

/* Referral and history tabs */
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-card); }
.h-row { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--hair); }
.h-row:last-child { border-bottom: 0; }
.h-dot { width: 11px; height: 11px; flex-shrink: 0; margin-top: 4px; border-radius: 50%; border: 2px solid; }
.h-date { width: 104px; flex-shrink: 0; font-size: 12px; color: var(--faint); font-family: var(--mono); padding-top: 1px; }
.h-t { font-size: 13px; font-weight: 600; }
.h-b { font-size: 12px; line-height: 1.55; margin-top: 3px; color: var(--muted); max-width: 560px; }
.n-row { padding: 12px 14px; border-bottom: 1px solid var(--hair); }
.n-row:last-child { border-bottom: 0; }
.n-meta { display: flex; align-items: baseline; gap: 7px; font-size: 12px; }
.n-meta .d { font-weight: 600; color: var(--ink-3); font-family: var(--mono); }
.n-meta .w { color: var(--faint); }
.n-text { font-size: 12.5px; line-height: 1.55; margin-top: 4px; color: var(--ink-2); }

/* Right pane */
.track { position: relative; width: var(--track-w, 380px); flex-shrink: 0; transition: width 0.18s ease; display: flex; flex-direction: column; background: var(--side); border-left: 1px solid var(--border); }
.t-head { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 14px; border-bottom: 1px solid var(--border); }
.rail-top { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 12px 8px 10px 12px; }
.col-toggle { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--faint); cursor: pointer; }
.col-toggle:hover { background: var(--sunk); color: var(--ink); }
/* A collapsed column leaves a slim strip with a way back in */
.strip { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; height: 100%; }
.strip button { width: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; font-size: 12px; font-weight: 600; }
.strip button:hover { background: var(--sunk); color: var(--ink); }
.strip .vert { writing-mode: vertical-rl; letter-spacing: 0.02em; white-space: nowrap; }
.rail .strip .vert { transform: rotate(180deg); }
.strip .count { writing-mode: horizontal-tb; font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }
.t-head .title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw-grid { display: grid; grid-template-columns: minmax(0, 1fr) 56px 70px; gap: 8px; align-items: center; }
/* Table header rows: light blue with dark blue text (about 8:1, passes WCAG AA) */
.aw-cols { flex-shrink: 0; padding: 8px 14px; background: var(--blue-bg); border-bottom: 1px solid #D3DDEC; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #24497F; }
.aw-row { padding: 9px 14px; border-bottom: 1px solid var(--border); }
.aw-row:last-child { border-bottom: 0; }
.aw-item { display: flex; align-items: center; gap: 9px; min-width: 0; }
.aw-text { font-size: 12px; line-height: 1.4; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw-row.done .aw-text { color: var(--faint); text-decoration: line-through; }
.aw-sub { font-size: 12px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.due { font-size: 12px; font-family: var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.due.late { color: var(--red); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.due.soon { color: var(--amber); font-weight: 600; }
.aw-row.done .due { color: var(--faint); font-weight: 400; }
.tick { width: 16px; height: 16px; padding: 0; flex-shrink: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--surface); border: 1.5px solid #C9C6BD; }
.tick[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); }
.tick:hover { border-color: var(--primary); }
.t-empty { padding: 18px 16px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.t-empty p { margin: 0 0 6px; }
.t-empty strong { color: var(--ink); font-weight: 600; }
/* Full text of anything cut off with an ellipsis, shown on hover or keyboard focus */
.tip { position: fixed; z-index: 100; max-width: 280px; padding: 6px 9px; border-radius: 7px; background: var(--ink); color: #FFFFFF; font-size: 12px; line-height: 1.4; box-shadow: 0 4px 14px rgba(20, 20, 15, 0.18); pointer-events: none; }
.tip[hidden] { display: none; }
.aw-none { padding: 18px 14px; font-size: 12px; line-height: 1.5; color: var(--faint); }

/* Running notes — the notes column from the spreadsheet */
.log-list { flex-grow: 1; min-height: 0; overflow: auto; padding: 0 14px; }
/* Notes tab: the latest update in full, earlier notes as icon + summary rows. Text 14–15px; dates and labels in --muted (about 4.7:1 on the panel), passing WCAG AA. */
.notes-v2 { padding: 14px 14px 18px; }
.nl-k { margin: 4px 2px 8px; font-size: 12px; color: var(--muted); }
.notes-v2 .nl-k + .nc-list, .notes-v2 .nl-card + .nl-k { margin-top: 0; }
.nl-card { margin-bottom: 18px; padding: 14px 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.nl-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nl-h .grow { display: flex; flex-direction: column; min-width: 0; }
.nl-who { font-size: 14px; font-weight: 600; color: var(--ink); }
.nl-d { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.nl-text { margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; }
.nl-ic, .nc-ic { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--blue-bg); color: var(--primary); }
.nc-list { margin: 0; padding: 0; list-style: none; }
.nc { border-radius: 10px; }
.nc.open { background: var(--surface); border: 1px solid var(--border); }
.nc-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 8px; border: 0; border-radius: 10px; background: transparent; font: inherit; text-align: left; cursor: pointer; }
.nc-row:hover { background: rgba(20, 20, 15, 0.05); }
.nc.open .nc-row:hover { background: transparent; }
.nc-sum { flex: 1 1 auto; min-width: 0; font-size: 14.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-d { flex-shrink: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.nc-full { padding: 0 12px 12px 52px; }
.nc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.nc-full p { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; }
.log-list .n-row { padding: 11px 0; border-bottom: 1px solid #F4F2ED; }
.log-list .n-row:last-child { border-bottom: 0; }
.log-list .n-meta .d { font-size: 12px; }
.log-list .n-text { font-size: 12px; line-height: 1.55; white-space: pre-line; }

/* Chat in the centre — where the decision note is drafted */
.chat { margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--border-strong); }
.msg-you { display: flex; justify-content: flex-end; margin-top: 12px; }
.msg-you .bubble { max-width: 70%; padding: 9px 13px; border-radius: 14px 14px 4px 14px; background: var(--blue-bg); color: #24497F; font-size: 13px; line-height: 1.5; }
.msg-bot { display: flex; gap: 10px; margin-top: 12px; }
.msg-bot .logo.sm { margin-top: 2px; }
.bot-card { flex-grow: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); }
.bot-text { padding: 11px 14px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.note-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 9px; }
/* The decision note is edited in place; once added to the notes it locks */
.note-edit { display: block; width: calc(100% - 28px); min-height: 300px; margin: 0 14px; padding: 13px 14px; resize: vertical; background: #FDFCF8; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.note-edit:disabled { color: var(--ink-2); background: var(--ground); }
.ai-tag { display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 8px; border-radius: 10px; background: var(--purple-bg); color: var(--purple); font-size: 12px; font-weight: 600; }
.note-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; }
.note-foot .why { flex-grow: 1; min-width: 0; font-size: 12px; line-height: 1.4; color: var(--faint); }
/* Message to the referring provider: drafted in the chat, edited there, sent from the EHR */
.mc { padding: 0 14px; }
.mc-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 8px; }
.mc-row .k { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.mc-in { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 13px; color: var(--ink); outline: none; }
.mc-in:focus, .mc-body:focus { border-color: var(--primary); }
.mc-in::placeholder { color: var(--amber); }
.mc-ask { margin: 12px 0 0; padding: 8px 12px 10px; border: 1px solid var(--hair); border-radius: 10px; background: var(--ground); }
.mc-ask legend { padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.mc-ask label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.mc-ask input { width: 15px; height: 15px; margin: 0; accent-color: var(--primary); }
.mc-ask .d { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.mc-ask .none { padding: 4px 0; font-size: 12px; color: var(--faint); }
.mc-body { margin-top: 10px; height: 250px; font-size: 12.5px; line-height: 1.6; }
.mc input:disabled, .mc textarea:disabled { background: var(--ground); color: var(--ink-2); }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 9px; }
.suggest .lab { font-size: 12px; color: var(--faint); margin-right: 2px; }

/* Follow-me window */
.desk { position: absolute; inset: 0; background: #E8E6E1; }
.ghost-win { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); }
.ghost-bar { flex-shrink: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--sunk); border-bottom: 1px solid var(--border-strong); font-size: 12.5px; color: var(--ghost); }
.ghost-bar .lights span { background: #D8D5CD; }
.ghost-body { flex-grow: 1; display: flex; min-height: 0; }
.ghost-nav { width: 196px; flex-shrink: 0; padding: 18px 14px; background: #FAF9F6; border-right: 1px solid #EDEBE5; }
.g { border-radius: 4px; background: #F0EEE8; }
.ghost-main { flex-grow: 1; min-width: 0; padding: 26px 30px; }
.ghost-rows { margin-top: 22px; border: 1px solid #EDEBE5; border-radius: 10px; overflow: hidden; }
.ghost-row { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-bottom: 1px solid #F2F0EB; }
.ghost-row:last-child { border-bottom: 0; }
.pip { position: absolute; right: 24px; bottom: 24px; width: 304px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: 0 18px 42px rgba(20, 20, 15, 0.22), 0 2px 6px rgba(20, 20, 15, 0.1); overflow: hidden; }
.pip-bar { display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 12px; border-bottom: 1px solid var(--hair); }
.pip-bar .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.pip-bar .icon-btn:hover { background: var(--sunk); color: var(--ink); }
.pip-body { padding: 12px; }
.pip .aw-row { padding: 9px 0; }
.btn-full { display: flex; width: 100%; align-items: center; justify-content: center; gap: 7px; min-height: 38px; margin-top: 10px; border: 0; border-radius: 9px; color: #FFFFFF; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--primary); }
.pill-win { position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 23px; box-shadow: 0 14px 32px rgba(20, 20, 15, 0.2), 0 2px 5px rgba(20, 20, 15, 0.08); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.pill-win .chev { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--faint); }

/* Home: the dashboard */
.home { max-width: 1060px; margin: 0 auto; padding: 48px 28px 28px; }
.hello { margin: 0; font-size: clamp(28px, 4.2cqi, 46px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12; }
.hello .sub { display: block; color: #858A93; } /* large text: about 3.5:1, passes AA for large text */
.hello .hi { display: block; background: linear-gradient(90deg, #2F5FA8, #6F58B8 55%, #B0506A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 34px; }
.dcard { min-width: 0; padding: 16px 18px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card); }
.dcard.wide { grid-column: 1 / -1; }
.dcard-h { display: flex; align-items: flex-start; gap: 10px; }
.dcard-t { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.dcard-s { margin-top: 2px; font-size: 12px; color: var(--faint); }
.dcard-foot { min-height: 14px; margin-top: 8px; font-size: 12px; color: var(--faint); }
.sample { flex-shrink: 0; height: 20px; padding: 0 8px; display: inline-flex; align-items: center; border: 1px dashed var(--border-strong); border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); }
.hero-n { margin-top: 16px; font-size: 40px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.hero-n small { margin-left: 6px; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.hero-d { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; margin-top: 30px; border-bottom: 1px solid var(--border); }
.bar { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.bar i { position: relative; display: block; min-height: 2px; background: var(--primary); border-radius: 4px 4px 0 0; }
.bar.partial i { background: repeating-linear-gradient(135deg, var(--primary) 0 3px, #9DB3D9 3px 6px); }
.bar:hover i { filter: brightness(1.15); }
.bar .v { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 4px; text-align: center; font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.bar-x { display: flex; gap: 6px; margin-top: 6px; }
.bar-x span { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.spark-big { display: block; width: 100%; height: 56px; margin-top: 14px; overflow: visible; }
.hbars { margin-top: 14px; }
.hb { display: grid; grid-template-columns: minmax(0, 104px) minmax(0, 1fr) 26px; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; }
.hb .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-2); }
.hb .t { height: 10px; }
.hb .t i { display: block; height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; }
.hb .n { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.dash-note { margin: 14px 2px 0; font-size: 12px; color: var(--faint); }
@container (max-width: 820px) { .dash { grid-template-columns: 1fr 1fr; } }
@container (max-width: 560px) {
  .home { padding: 28px 16px 20px; }
  .dash { grid-template-columns: 1fr; }
  .bar-x span:nth-child(even) { visibility: hidden; }
  .bars { gap: 3px; } .bar-x { gap: 3px; }
}

/* Home: four small action cards, each opening the dashboard at its chart */
.acards { display: grid; grid-template-columns: repeat(4, minmax(0, 184px)); gap: 12px; margin-top: 48px; }
/* The home column is as wide as the card row and sits in the middle, with the search bar matching it */
.landing .home { max-width: calc(4 * 184px + 3 * 12px + 56px); }
.landing .search form { max-width: calc(4 * 184px + 3 * 12px); margin: 0 auto; }
.acard { min-width: 0; height: 184px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 14px 14px 12px; text-align: left; background: var(--tile); border: 0; border-radius: 16px; color: var(--ink); font: inherit; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
.acard:hover { background: var(--tile-hover); }
.acard-t { font-size: 14px; font-weight: 500; line-height: 1.35; letter-spacing: -0.01em; }
.acard-p { display: block; min-height: 0; }
.ap-bars { display: flex; align-items: flex-end; gap: 2px; height: 52px; border-bottom: 1px solid var(--border); }
.ap-bars i { flex: 1 1 0; min-height: 2px; background: var(--primary); border-radius: 3px 3px 0 0; }
.ap-bars i.partial { background: repeating-linear-gradient(135deg, var(--primary) 0 3px, #9DB3D9 3px 6px); }
.ap-num { font-size: 26px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.ap-num small { margin-left: 5px; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.ap-spark { display: block; width: 100%; height: 28px; margin-top: 8px; overflow: visible; }
.ap-line { margin-top: 8px; font-size: 12px; color: var(--muted); }
.ap-pn { margin-top: 2px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.ap-pb { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.ap-pb span { flex: 1 1 auto; height: 10px; background: #DDE1E6; border-radius: 5px; overflow: hidden; }
.ap-pb i { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
.ap-pb b { flex-shrink: 0; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.dash-page { padding-top: 28px; }
.dash-title { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
.dash-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.dash-page .dash { margin-top: 22px; }
.dcard.focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--blue-bg); }
@container (max-width: 820px) { .acards { grid-template-columns: repeat(2, minmax(0, 184px)); } }
@container (max-width: 560px) { .acards { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; } .acard { height: 168px; } }

/* The patient page: the algorithm as a row of steps, then the triage note in two cards */
.card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card); }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px 18px 0; }
.card-t { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.card-sub { margin-top: 2px; font-size: 12px; color: var(--faint); }
.cbody { padding: 12px 18px 18px; }
.decision { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 12px 18px 0; }
.decision .d-k { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
.decision .d-v { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.decision .pill { align-self: center; }
.decision .d-was { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.card .ver-restore { margin: 10px 18px 0; }
.strip-wrap { overflow-x: auto; padding: 20px 18px 20px; }
.strip-row { display: flex; align-items: center; min-width: min-content; }
.snode, .tnode { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px; text-align: left; cursor: pointer; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; box-shadow: 0 2px 6px rgba(20, 20, 15, 0.05); transition: opacity 0.15s, box-shadow 0.15s; }
.snode { flex: 1 1 0; min-width: 150px; max-width: 260px; }
.snode.end { flex-grow: 1.3; min-width: 180px; max-width: 300px; }
.strip-row .sn-link { flex-grow: 0; width: 28px; }
.snode .sn-ic { width: 34px; height: 34px; }
.snode:hover, .tnode:hover { box-shadow: 0 4px 14px rgba(20, 20, 15, 0.1); }
.snode.met, .tnode.on.met { border-color: #B6DCC8; box-shadow: 0 0 0 3px rgba(14, 122, 82, 0.07); }
.snode.missing, .tnode.on.missing, .tnode.on.end { border-color: #E6C78E; box-shadow: 0 0 0 3px rgba(201, 138, 43, 0.12); }
.snode.gap, .tnode.gap { border-style: dashed; border-color: #B7ABE6; }
.snode.off, .tnode.off { opacity: 1; box-shadow: none; border-style: dashed; background: #FAFAF8; }
.snode.off .sn-t, .tnode.off .sn-t, .snode.off .sn-s, .tnode.off .sn-s { color: var(--muted); }
.snode.off .sn-ic, .tnode.off .sn-ic { color: var(--faint); }
.snode.off:hover, .tnode.off:hover { border-color: var(--faint); }
/* Off the path, everything is grey: no green, amber or purple until a step is reached. White marks on --faint stay above 5:1. */
.snode.off, .tnode.off, .snode.off.gap, .tnode.off.gap { border-color: var(--border-strong); }
.snode.off .mk, .tnode.off .mk { background: var(--faint); border-color: transparent; color: #FFFFFF; }
.snode.off .mk.pending, .tnode.off .mk.pending { background: var(--surface); border: 2px solid var(--faint); border-right-color: transparent; }
.snode.off .sn-badge, .tnode.off .sn-badge { background: var(--sunk); border-color: var(--border-strong); color: var(--muted); }
.sn-ic { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 9px; background: var(--ground); color: var(--ink-3); }
.sn-ic.sm { width: 28px; height: 28px; border-radius: 7px; }
.sn-txt { flex-grow: 1; min-width: 0; }
.sn-t { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25; letter-spacing: -0.005em; }
.sn-s { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.sn-link { width: 18px; flex-shrink: 0; border-top: 2px dashed #D9D6CE; }
.sn-link.on { border-top-style: solid; border-color: var(--amber-dot); }
.sn-badge { position: absolute; top: -9px; right: 10px; padding: 1px 7px; border: 1px solid #EBD3A5; border-radius: 6px; background: var(--amber-bg); color: var(--amber); font-size: 12px; font-weight: 600; white-space: nowrap; }
.sn-badge.blue { border-color: #C5D4EC; background: var(--blue-bg); color: var(--primary); }
.mk { width: 20px; height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: 700; color: #FFFFFF; }
.mk.met { background: #1E8456; }
.mk.missing { background: #A3670F; }
.mk.gap { background: var(--purple); }
.mk.pending { background: var(--surface); border: 2px solid var(--amber-dot); border-right-color: transparent; }
.duo { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.aw-card .aw-body { margin-top: 12px; padding-bottom: 6px; }
.aw-card .aw-cols { padding: 8px 18px; }
.aw-card .aw-row { padding: 10px 18px; }
.pnote { padding: 16px; }
.pnote-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.pnote-h .tnote-t { margin: 0; }

.lab-val { padding: 0 4px; margin: 0 -4px; border: 0; border-radius: 4px; background: transparent; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--border-strong); text-underline-offset: 3px; }
.lab-val:hover, .lab-val.on { background: var(--blue-bg); color: var(--primary); text-decoration-color: var(--primary); }

.trend .ax { font-family: var(--mono); font-size: 12px; fill: var(--faint); }

/* Lab links in the triage note, and the trend they open. Link blue is about 6:1 on white and 5:1 on the amber box. */
.lab-link { display: inline; padding: 0; border: 0; background: none; font: inherit; color: var(--primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; cursor: pointer; border-radius: 3px; }

.lt-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px; }

.trend-box { margin-top: 10px; padding: 10px 8px 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }

/* Right panel: tabs, with the chat box pinned at the bottom */

.ptabs-row { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; border-bottom: 1px solid var(--border); }
.ptabs { flex: 1 1 auto; min-width: 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.ptabs button { flex-shrink: 0; min-height: 48px; padding: 0 9px; border: 0; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); box-shadow: inset 0 -2px 0 transparent; }

.draft-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 0.12s; }
.draft-btn:hover { background: #F7F7F5; }

.panel-ask .suggest { flex-wrap: wrap; }

/* The full-screen tree: one lane per step, the path in amber, the picked node in a sidebar */
.tm-scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(27, 27, 25, 0.55); }
.tm { width: 100%; max-width: 1500px; height: 100%; max-height: 920px; display: flex; flex-direction: column; overflow: hidden; background: #F8F7F3; border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
.tm-head { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 14px 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tm-ic { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 11px; background: var(--blue-bg); color: var(--primary); }
.tm-t { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }

.icon-btn.lg:hover { background: var(--sunk); color: var(--ink); }

.lane { min-width: 0; display: flex; flex-direction: column; border-left: 1px dashed #E3E0D8; }

.lane-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lane-n { flex-shrink: 0; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.lcell { position: relative; height: 170px; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
.lcell.a { margin-top: 36px; }
.lcell.b { margin-bottom: 30px; }

.ln.d { left: calc(50% - 1px); top: 50%; bottom: 0; border-left-width: 2px; }

.tree-key span { display: inline-flex; align-items: center; gap: 7px; }
.ln-k { display: inline-block; width: 22px; border-top: 2px dashed #D9D6CE; }

.tm-side { width: 410px; flex-shrink: 0; overflow: auto; padding: 16px 20px 28px; background: #F1F0EB; border-left: 1px solid var(--border); }
.side-top { display: flex; align-items: center; }
.side-ic { width: 56px; height: 56px; margin-top: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); border-radius: 12px; background: #E9E7E1; color: var(--ink-3); }

.side-sec > .lab { margin-bottom: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.side-sec p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.side-sec p.muted { font-size: 12.5px; color: var(--faint); }
.tm-side .s-aside { margin-top: 12px; }
.read-from { display: flex; align-items: flex-start; gap: 7px; margin-top: 10px; font-size: 12px; line-height: 1.45; color: var(--muted); }
.read-from svg { margin-top: 2px; flex-shrink: 0; }
/* Provider notes in the tree sidebar */
.pv-list { display: grid; gap: 8px; }
.pv-row { padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.pv-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.pv-who { font-size: 13px; font-weight: 600; color: var(--ink); }
.pv-role { font-size: 12px; color: var(--muted); }
.pv-d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.side-sec p.pv-t { margin-top: 6px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.pv-row .read-from { margin-top: 8px; }
.pv-none { font-size: 12.5px; }
.pv-add { margin-top: 10px; }
.pv-form { margin-top: 10px; }
.pv-lab { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.pv-err { margin-top: 6px; font-size: 12px; color: var(--red); }
.pv-acts { display: flex; gap: 8px; margin-top: 8px; }
.req { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; font-weight: 500; }
.req:hover { border-color: var(--border-strong); }
.meter { height: 10px; margin-top: 12px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 5px; background: #2EA36B; }
.meter i.near { background: var(--amber-dot); }
.meter i.over { background: var(--red); }
.meter-x { display: flex; justify-content: space-between; margin-top: 5px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.tm-side .ov { background: var(--surface); }
.tm-side .lsum-wrap { background: var(--surface); }
/* The full tree in the page's own look: white work area, cool grey sidebar, blue labels, and text at 13–15px. */
.tm { background: var(--surface); }
.tm .tree-body { background: var(--surface); }
.tm .lanes { grid-template-columns: repeat(7, minmax(240px, 1fr)); }
.tm .lane { border-left-color: var(--border); }
.tm .lane:nth-child(even) { background: #F8FAFC; }
.tm-t { font-size: 20px; }
.tm-s { font-size: 14px; }
.tm .decision .d-k { font-size: 13px; color: var(--muted); }
.tm .decision .d-v { font-size: 19px; }
.tm .decision .d-was, .tm .ver-restore { font-size: 14px; }
.lane-h { min-height: 40px; }
.lane-tag { height: 28px; padding: 0 10px; font-size: 13px; background: var(--blue-bg); border-color: #D3DDEC; color: #24497F; }
.lane-n { font-size: 13px; color: var(--muted); }
.lcell { height: 190px; }
.tnode { max-width: 260px; padding: 11px 12px; }
.tm .sn-t { font-size: 15px; line-height: 1.3; }
.tm .sn-s { margin-top: 3px; font-size: 13.5px; }
.tree-key { font-size: 14px; color: var(--muted); }
.tm-side { width: 440px; background: var(--side); }
.side-ic { background: var(--blue-bg); border-color: #D3DDEC; color: var(--primary); }
.side-sec > .lab { font-size: 13px; color: var(--ink-3); }
.side-sec p, .side-sec p.pv-t { font-size: 15px; }
.side-sec p.muted { font-size: 14px; color: var(--muted); }
.tm-side .read-from { font-size: 13.5px; }
.tm-side .s-aside { font-size: 14px; }
.tm-side .req { font-size: 14px; }
.tm-side .lsum { font-size: 14px; }
.tm-side .meter-x { font-size: 13px; }
.tm-side .pv-who { font-size: 14px; }
.tm-side .pv-role, .tm-side .pv-d, .tm-side .pv-none, .tm-side .pv-lab { font-size: 13.5px; }
.tm-side .ov-h { font-size: 14px; }
.tm-side .ov-h span, .tm-side .ov-hint { font-size: 13px; }

/* Next step after a change */
.next-step { margin-top: 14px; padding: 14px 16px; border: 1.5px solid #C5D4EC; border-radius: 12px; background: var(--blue-bg); }
.next-step.card { margin: 12px 18px 0; }

.tm .decision .pill { font-size: 13px; }
.tm .sn-badge { font-size: 13px; }
.tm-side .pill { font-size: 13px; }
.tm-side .linkbtn { font-size: 13.5px; }
.tm-side .btn.sm { font-size: 14px; min-height: 36px; }
.tm-side .kv { font-size: 14px; }

.tm-side .pa, .tm-side .u, .tm-side .d { font-size: 13px; }
.toast { position: fixed; left: 24px; bottom: 24px; z-index: 70; max-width: calc(100% - 48px); display: flex; align-items: center; gap: 10px; padding: 13px 18px; background: var(--surface); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.04); font-size: 13.5px; font-weight: 500; }
@media (max-width: 1023px) {
  .tm-side { position: absolute; top: 0; right: 0; bottom: 0; z-index: 3; width: min(410px, 100%); box-shadow: -12px 0 32px rgba(20, 20, 15, 0.16); }
}
@media (max-width: 767px) {
  .tm-scrim { padding: 0; }
  .tm { max-height: none; border-radius: 0; }
  .tm-head .ver-list { order: 3; flex-basis: 100%; }
  .tm-sub { padding: 0 14px 10px; }
  .tree-body { padding: 10px; }
  .toast { left: 12px; right: 12px; bottom: 12px; max-width: none; }
}

/* ---------- Responsive ----------
   ≥1280  three panes side by side
   1024+  narrower rail and tracking pane
   <1024  the rail becomes a drawer from the left
   <768   the awaiting pane becomes a drawer from the right; one column of work
   The centre adapts to its own width with container queries. */

/* Versions: V1 is the AI's read; each override adds one. The latest drives the decision. */
.versions { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

.ov-mode { display: inline-flex; margin-top: 10px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }

.ov .row .ov-hint { margin-top: 0; }

.exec-lines li::marker { font-family: var(--mono); font-size: 12px; color: var(--faint); }

.exec-miss { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #1E3A66; color: #FFFFFF; }
.exec-miss .kicker { color: #BFD3F2; }

.hist { margin-top: 12px; border-top: 1px solid var(--hair); }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const surname = (p) => p.name.split(',')[0];
const dueLabel = (a) => MONTHS[a.dm - 1] + ' ' + a.dd;
const dueTone = (a) => {
  const left = -daysSince(2026, a.dm, a.dd);
  return left < 0 ? 'late' : left <= 1 ? 'soon' : '';
};
const openItems = (list) => list.filter((a) => !S.done[a.id]).length;
const itemsFor = (mrn) => AWAITING.filter((a) => a.mrn === mrn);

const matchesFilter = (p) => {
  const f = S.filter;
  if (f === 'all') return true;
  if (f === 'external') return p.source === 'External';
  return p.status === f;
};
const dayKey = (y, m, d) => `${y}-${m}-${d}`;
const keyNum = (k) => { const [y, m, d] = k.split('-').map(Number); return ymd(y, m, d); };
const toIso = (k) => { const [y, m, d] = k.split('-'); return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; };
const fromIso = (v) => (v ? v.split('-').map(Number).join('-') : null);
// A picked day, or a range once both ends are set (a start alone matches just that day).
const onDay = (p) => {
  const k = keyNum(dayKey(2026, p.rm, p.rd));
  if (S.rangeMode && S.range.from) return k >= keyNum(S.range.from) && k <= keyNum(S.range.to || S.range.from);
  return S.day === null || k === keyNum(S.day);
};
const dateFiltered = () => (S.rangeMode ? !!S.range.from : S.day !== null);
const ymd = (y, m, d) => y * 10000 + m * 100 + d;
const isFuture = (y, m, d) => ymd(y, m, d) > ymd(TODAY.y, TODAY.m, TODAY.d);
const shortLabel = (k) => { const [y, m, d] = k.split('-').map(Number); return MONTHS[m - 1] + ' ' + d + (y === TODAY.y ? '' : ', ' + y); };
// Referrals received over a range, summed day by day.
function receivedBetween(a, b) {
  let total = 0;
  const [y, m, d] = a.split('-').map(Number);
  for (let t = new Date(y, m - 1, d); ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()) <= keyNum(b); t.setDate(t.getDate() + 1)) {
    total += receivedOn(t.getFullYear(), t.getMonth() + 1, t.getDate()) || 0;
  }
  return total;
}
const dayLabel = (k) => { const [y, m, d] = k.split('-').map(Number); return MONTH_NAMES[m - 1] + ' ' + d + (y === TODAY.y ? '' : ', ' + y); };
// Referrals received each day. October 2026 is the sample month; other months get steady sample volumes.
function receivedOn(y, m, d) {
  if (isFuture(y, m, d)) return null;
  if (y === 2026 && m === 10) return COUNTS[d] || 0;
  const dow = new Date(y, m - 1, d).getDay();
  if (dow === 0 || dow === 6) return 0;
  return 6 + ((Math.imul(ymd(y, m, d), 2654435761) >>> 0) % 10);
}

function renderRail() {
  const { y, m } = S.cal;
  const lead = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="dn">${d}</div>`);
  for (let i = 0; i < lead; i += 1) cells.push('<div class="blank"></div>');
  for (let d = 1; d <= days; d += 1) {
    const n = receivedOn(y, m, d);
    const k = dayKey(y, m, d);
    const future = n === null;
    const r = S.range;
    const end = r.from && (k === r.from || k === r.to);
    const inside = r.from && r.to && keyNum(k) > keyNum(r.from) && keyNum(k) < keyNum(r.to);
    const sel = S.rangeMode ? end : S.day === k;
    const cls = ['cell', k === dayKey(TODAY.y, TODAY.m, TODAY.d) && 'today', sel && 'sel', S.rangeMode && inside && 'inrange', future && 'future'].filter(Boolean).join(' ');
    cells.push(`<button type="button" class="${cls}" data-act="day" data-v="${k}" ${future ? 'disabled' : ''}
      aria-label="${MONTH_NAMES[m - 1]} ${d}, ${future ? 'not yet' : n + ' received'}${sel ? ', selected' : (S.rangeMode && inside ? ', in range' : '')}">
      <span class="n">${d}</span><span class="c">${future ? '' : (n || '·')}</span></button>`);
  }
  const atStart = y === FIRST_YEAR && m === 1;
  const atNow = y === TODAY.y && m === TODAY.m;

  // Quick jump: pick a year, then a month. Months after this one are not selectable.
  const py = S.calPicker;

    <div class="cal-pick" role="dialog" aria-label="Choose a month">

        }).join('')}

  const chip = (id, label, size) => `<button type="button" class="chip ${size || ''}" data-act="filter" data-v="${id}" aria-pressed="${S.filter === id}">${label}</button>`;

    : (S.day === null ? '' : dayLabel(S.day));
  const title = (span ? span + ' · ' : '') + (S.filter === 'all' ? 'All referrals' : FILTERS[S.filter].replace('Declined · ', ''));
  const received = !dateFiltered() ? null
    : S.rangeMode ? receivedBetween(r.from, r.to || r.from)
      : receivedOn(...S.day.split('-').map(Number)) || 0;
  const count = received === null ? String(rows.length) : `${rows.length} of ${received} received`;

        ${filters}
        <div class="rail-title"><span class="kicker">${title}</span><span class="grow"></span><span class="count">${count}</span>${dateFiltered() ? '<button type="button" class="btn-ghost" data-act="clearDay">Show all</button>' : ''}</div>

// Sample numbers for the prototype, not read from Epic: referrals received each month from Jan 2025.
const VOLUME = [118, 124, 131, 127, 139, 142, 136, 151, 158, 149, 163, 141, 148, 161, 172, 158, 183, 176, 169, 190, 201, 187, 96];
const VOL_START = { y: 2025, m: 1 };
const DAYS_TO_APPT = [31, 29, 30, 27, 28, 26, 27, 25, 24, 25, 23, 22]; // average, the last 12 months
const BY_PROVIDER = [['Dr. Shah', 64], ['Dr. L. Nguyen', 51], ['Dr. M. Castillo', 47], ['Dr. J. Brennan', 38], ['Dr. E. Lindgren', 22]];

const volMonth = (i) => { const t = VOL_START.y * 12 + VOL_START.m - 1 + i; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
const isNowMonth = (i) => { const v = volMonth(i); return v.y === TODAY.y && v.m === TODAY.m; };
const sampleTag = '<span class="sample" title="Made-up numbers for the prototype. Not connected to Epic.">Sample</span>';

function volumeCard() {
  let bars;
  if (S.dash === 'quarter') {
    const q = {};
    VOLUME.forEach((n, i) => { const v = volMonth(i); const k = v.y + ' Q' + Math.ceil(v.m / 3); q[k] = q[k] || { n: 0, now: false }; q[k].n += n; q[k].now = q[k].now || isNowMonth(i); });
    bars = Object.keys(q).map((k) => ({ label: k.slice(5) + " '" + k.slice(2, 4), n: q[k].n, partial: q[k].now, tip: `${k}: ${q[k].n} referrals${q[k].now ? ' (to date)' : ''}` }));
  } else {
    bars = VOLUME.slice(-12).map((n, j) => { const i = VOLUME.length - 12 + j; const v = volMonth(i); return { label: MONTHS[v.m - 1], n, partial: isNowMonth(i), tip: `${MONTH_NAMES[v.m - 1]} ${v.y}: ${n} referrals${isNowMonth(i) ? ' (to date)' : ''}` }; });
  }
  const max = Math.max(...bars.map((b) => b.n));
  const peak = bars.findIndex((b) => b.n === max);
  return `
    <section class="dcard wide" aria-label="Referral volume">
      <div class="dcard-h">
        <div class="grow"><div class="dcard-t">Referral volume</div><div class="dcard-s">Referrals received ${S.dash === 'quarter' ? 'each quarter' : 'each month, last 12 months'}</div></div>
        ${sampleTag}
        <div class="seg seg-sm" role="group" aria-label="Group by">
          <button type="button" data-act="dash" data-v="month" aria-pressed="${S.dash === 'month'}">Month</button>
          <button type="button" data-act="dash" data-v="quarter" aria-pressed="${S.dash === 'quarter'}">Quarter</button>
        </div>
      </div>
      <div class="bars" role="img" aria-label="${bars.map((b) => b.tip).join('; ')}">
        ${bars.map((b, i) => `<div class="bar ${b.partial ? 'partial' : ''}" data-tip="${b.tip}">
          <i style="height: ${Math.max(2, Math.round((b.n / max) * 100))}%">${i === peak || i === bars.length - 1 ? `<span class="v">${b.n}</span>` : ''}</i></div>`).join('')}
      </div>
      <div class="bar-x" aria-hidden="true">${bars.map((b) => `<span>${b.label}</span>`).join('')}</div>
      <div class="dcard-foot">${bars[bars.length - 1].partial ? 'The striped bar is the current ' + (S.dash === 'quarter' ? 'quarter' : 'month') + ', to date.' : ''}</div>
    </section>`;
}

function totalCard() {
  const thisYear = VOLUME.filter((n, i) => volMonth(i).y === TODAY.y);
  const months = thisYear.length;
  const lastYear = VOLUME.filter((n, i) => volMonth(i).y === TODAY.y - 1).slice(0, months);
  const a = thisYear.reduce((x, y) => x + y, 0);
  const b = lastYear.reduce((x, y) => x + y, 0);
  const pct = b ? Math.round(((a - b) / b) * 100) : 0;
  return `
    <section class="dcard" aria-label="Total incoming">
      <div class="dcard-h"><div class="grow"><div class="dcard-t">Total incoming</div><div class="dcard-s">Jan–${MONTHS[TODAY.m - 1]} ${TODAY.y}, to date</div></div>${sampleTag}</div>
      <div class="hero-n">${a.toLocaleString()}<small>referrals</small></div>
      <div class="hero-d">${pct >= 0 ? '+' : ''}${pct}% on the same months of ${TODAY.y - 1} (${b.toLocaleString()}). This month so far: ${VOLUME[VOLUME.length - 1]}.</div>
    </section>`;
}

function daysCard() {
  const d = DAYS_TO_APPT;
  const W = 240; const H = 56; const lo = Math.min(...d) - 2; const hi = Math.max(...d) + 2;
  const pts = d.map((v, i) => [Math.round((i / (d.length - 1)) * (W - 8)) + 4, Math.round(H - 4 - ((v - lo) / (hi - lo)) * (H - 8))]);
  const last = pts[pts.length - 1];
  return `
    <section class="dcard" aria-label="Average days to appointment">
      <div class="dcard-h"><div class="grow"><div class="dcard-t">Referral to appointment</div><div class="dcard-s">Average days, received to first hematology visit</div></div>${sampleTag}</div>
      <div class="hero-n">${d[d.length - 1]}<small>days</small></div>
      <div class="hero-d">Down from ${d[0]} a year ago. Last month's average.</div>
      <svg class="spark-big" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Average days to appointment, last 12 months: ${d.join(', ')}">
        <polyline points="${pts.map((x) => x.join(',')).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        ${pts.map((x, i) => `<circle cx="${x[0]}" cy="${x[1]}" r="9" fill="transparent" data-tip="${MONTHS[volMonth(VOLUME.length - 12 + i).m - 1]}: ${d[i]} days"/>`).join('')}
        <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>
      </svg>
    </section>`;

// The roadmap card: the five steps in a row, the outcome at the end. A click opens the full tree there.
// After a change, the next decision point on the path: the step right after the one changed,
// or, for a change with no step (a lab value, a restore), the step where the path now stops.
function nextAfterChange() {
  const latest = latestVer();
  if (!S.lastOv || S.lastOv.n !== latest.n) return null;
  const ev = evaluate(latest);
  const path = chainOf(ev.end).reverse().filter((id) => NODE[id].kind === 'step');
  const from = S.lastOv.step;
  let next = null;
  if (from && path.includes(from)) next = path[path.indexOf(from) + 1] || null;
  else if (!from) { const last = path[path.length - 1]; next = last && ev.steps[last].status !== 'met' ? last : null; }
  return { from, next, ev };
}

function nextStepPanel(where) {
  const info = nextAfterChange();
  if (!info || (where === 'card' && S.lastOv.dismissed)) return '';
  const { from, next, ev } = info;
  const label = (id) => `Step ${NODE[id].step + 1} · ${SHORT[id]}`;
  const close = where === 'card' ? `<button type="button" class="icon-btn" data-act="nextDismiss" aria-label="Hide the next step">${ICON.close}</button>` : '';
  const body = next
    ? `<p>${from ? `With ${label(from)} changed, the path continues to` : 'After this change, the path stops at'} <strong>${label(next)}</strong> <span class="pill xs t-${ev.steps[next].status}">${stepSub(ev.steps[next])}</span></p>
      <div class="ns-acts"><button type="button" class="btn primary sm" data-act="nextStep" data-v="${next}">Go to step ${NODE[next].step + 1}</button>
        <button type="button" class="btn secondary sm" data-act="nextOverride" data-v="${next}">Override step ${NODE[next].step + 1}</button></div>`
    : `<p>The path now ends at <strong>${OUTCOME[ev.end]}</strong>. There is no step after this one.</p>`;
  return `<div class="next-step ${where}" role="status"><div class="ns-h"><span class="kicker">Next step · V${latestVer().n}</span><span class="grow"></span>${close}</div>${body}</div>`;
}

/* ---------- Evidence: lab trends, present/absent results, and the referral's own data ---------- */

// A lab over time against its reference range. Small in tables, large in the tree sidebar.
function trendSvg(sets, k, big) {
  const [lo, hi, label, unit] = CBC_RANGE[k];
  const vals = sets.map((x) => x[k]);
  const W = big ? 340 : 92; const H = big ? 150 : 28;
  const P = big ? { l: 36, r: 16, t: 16, b: 26 } : { l: 4, r: 4, t: 5, b: 5 };
  let dMin = Math.min(lo, ...vals); let dMax = Math.max(lo, ...vals);
  const pad = (dMax - dMin || 1) * 0.25; dMin = Math.max(0, dMin - pad); dMax += pad;
  const t0 = Date.parse(sets[0].date); const t1 = Date.parse(sets[sets.length - 1].date);
  const x = (d) => (t1 === t0 ? (P.l + W - P.r) / 2 : P.l + ((Date.parse(d) - t0) / (t1 - t0)) * (W - P.l - P.r));
  const y = (v) => P.t + (1 - (v - dMin) / (dMax - dMin)) * (H - P.t - P.b);
  const bandTop = y(Math.min(hi, dMax)); const bandBot = y(Math.max(lo, dMin));
  const flag = (v) => (v < lo ? 'low' : v > hi ? 'high' : '');
  const pts = sets.map((s) => [x(s.date), y(s[k]), s]);
  const r = big ? 4.5 : 2.5;
  // End labels sit inside the plot so they are never cut off.
  // Label the newest point, then any older one with room; the rest show on hover.
  const show = new Set(); let lastX = Infinity;
  for (let i = pts.length - 1; i >= 0; i -= 1) { if (lastX - pts[i][0] >= 58) { show.add(i); lastX = pts[i][0]; } }
  const anchor = (i) => (pts.length < 2 ? 'middle' : i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle');
  return `<svg class="${big ? 'trend' : 'spark'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} over time: ${sets.map((s) => isoLabel(s.date) + ' ' + s[k]).join(', ')}. Reference ${lo}–${hi} ${unit}.">
    ${bandBot > bandTop ? `<rect x="${P.l}" y="${bandTop}" width="${W - P.l - P.r}" height="${bandBot - bandTop}" fill="#E7F4EE"/>` : ''}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(lo)}" y2="${y(lo)}" stroke="#9CCDB5" stroke-dasharray="3 3" stroke-width="1"/>
    ${big ? `<text x="${P.l - 6}" y="${y(lo) + 3.5}" text-anchor="end" class="ax">${lo}</text>
      <text x="${W - P.r}" y="${bandTop + 11}" text-anchor="end" class="ax">Reference ${lo}–${hi}</text>
      ${pts.map((q, i) => (!show.has(i) ? '' : `<text x="${q[0]}" y="${H - 8}" text-anchor="${anchor(i)}" class="ax">${isoLabel(q[2].date)}</text>`)).join('')}` : ''}
    <polyline points="${pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="${flag(q[2][k]) ? 'var(--amber-dot)' : 'var(--primary)'}" stroke="var(--surface)" stroke-width="2"/>
      ${big && show.has(i) ? `<text x="${q[0]}" y="${q[1] - 9}" text-anchor="${anchor(i)}" class="val">${q[2][k]}${flag(q[2][k]) ? ' · ' + flag(q[2][k]) : ''}</text>` : ''}
      <circle cx="${q[0]}" cy="${q[1]}" r="${big ? 12 : 8}" fill="transparent" data-tip="${isoLabel(q[2].date, true)}: ${label} ${q[2][k]} ${unit}${flag(q[2][k]) ? ' (' + flag(q[2][k]) + ')' : ''}"/>`).join('')}
  </svg>`;
}
