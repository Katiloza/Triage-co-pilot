/* ---------- Events ---------- */

const ACT = {
  day: (v) => {
    if (!S.rangeMode) { S.day = S.day === v ? null : v; return; }
    // First click starts a range, second click ends it (in either order); a third starts again.
    const r = S.range;
    if (!r.from || r.to) { S.range = { from: v, to: null }; return; }
    S.range = keyNum(v) < keyNum(r.from) ? { from: v, to: r.from } : { from: r.from, to: v };
  },
  rangeMode: () => {
    S.rangeMode = !S.rangeMode;
    S.range = S.rangeMode && S.day ? { from: S.day, to: null } : { from: null, to: null };
    S.day = null;
  },
  // Month arrows step one month, from January of the first year up to this month.
  calStep: (v) => {
    const t = S.cal.y * 12 + (S.cal.m - 1) + +v;
    const max = TODAY.y * 12 + (TODAY.m - 1);
    const min = FIRST_YEAR * 12;
    const c = Math.min(max, Math.max(min, t));
    S.cal = { y: Math.floor(c / 12), m: (c % 12) + 1 };
    S.calPicker = null;
  },
  calPick: () => { S.calPicker = S.calPicker === null ? S.cal.y : null; },
  calYear: (v) => { S.calPicker = Math.min(TODAY.y, Math.max(FIRST_YEAR, S.calPicker + +v)); },
  calMonth: (v) => { S.cal = { y: S.calPicker, m: +v }; S.calPicker = null; },
  calToday: () => { S.cal = { y: TODAY.y, m: TODAY.m }; S.calPicker = null; },
  clearDay: () => { S.day = null; S.range = { from: null, to: null }; },
  filter: (v) => { S.filter = v; },
  open: (v) => {
    if (S.current !== v) { S.tab = 'decision'; S.copied = null; S.reroute = null; }
    // Opening a profile from the day shows only the awaiting column; the list is one click away.
    if (S.view === 'queue') Object.assign(S, { railCollapsed: true, trackCollapsed: false });
    S.current = v; S.view = 'patient'; S.searchMsg = ''; S.drawer = null;
  },
  toQueue: () => { S.view = 'queue'; S.railCollapsed = false; S.trackCollapsed = true; S.searchMsg = ''; S.drawer = null; },
  drawer: (v) => { S.drawer = S.drawer === v ? null : v; },
  closeDrawer: () => { S.drawer = null; },
  // Where the column is a drawer, its hide button closes the drawer instead.
  collapse: (v) => {
    const drawer = matchMedia(v === 'rail' ? '(max-width: 1023px)' : '(max-width: 767px)').matches;
    if (drawer) S.drawer = null;
    else S[v + 'Collapsed'] = true;
  },
  expand: (v) => { S[v + 'Collapsed'] = false; },
  tab: (v) => { S.tab = v; },
  ask: (v) => { ask(v); },
  tick: (v) => { S.done[v] = !S.done[v]; },
  changeStart: () => {
    S.reroute = { target: S.change ? S.change.target : null, why: '', addNode: S.change ? S.change.addNode : true };
    S.focusWhy = true;
  },
  pickTarget: (v) => { if (S.reroute && v !== TREE_END) S.reroute.target = v; },
  changeCancel: () => { S.reroute = null; },
  // Saving records the disagreement twice: on the decision path, and as a note on the patient.
  changeSave: () => {
    const r = S.reroute;
    const why = r.why.trim();
    if (!r.target || !why) return;
    const at = divergeAt(r.target);
    S.change = { target: r.target, why, addNode: r.addNode, at };
    S.reroute = null;
    logNote('Decision changed', `Changed the decision from "${OUTCOME[TREE_END]}" to "${OUTCOME[r.target]}", rerouting at ${stepLabel(at)} of the isolated lymphopenia tree (external, rev. 4).\nReason: ${why}`);
    logEvent('Decision changed by Melissa', `From "${OUTCOME[TREE_END]}" to "${OUTCOME[r.target]}", rerouting at ${stepLabel(at)}. Reason: ${why} Recorded on the decision path and in the notes.`, '#2F5FA8');
    S.treeFocus = { id: r.addNode ? 'note' : at, key: Date.now() };
  },
  changeRevert: () => {
    const was = S.change;
    S.change = null;
    logNote('Decision restored', `Went back to the tree's decision, "${OUTCOME[TREE_END]}". Set aside: "${OUTCOME[was.target]}".`);
    logEvent('Back to the tree\'s decision', `Melissa restored "${OUTCOME[TREE_END]}" and set aside "${OUTCOME[was.target]}". Noted in the patient's notes.`, '#8C8980');
    S.treeFocus = { id: 'g2', key: Date.now() };
  },
  noteToLog: (v) => {
    const m = S.chat[S.current][+v];
    m.frozen = draftNote();
    S.added[S.current] = [{ date: 'OCT 27', who: 'Melissa', text: m.frozen, tag: 'Decision note', fresh: true }].concat(S.added[S.current] || []);
  },
  msgItem: (v) => {
    const [i, id] = v.split(':');
    const m = S.chat[S.current][+i];
    if (m.sent) return;
    m.include[id] = !m.include[id];
    m.body = messageBody(byMrn(S.current), m);
    m.edited = false;
  },
  // Marking it sent records the message where the rest of the referral's story lives.
  msgSent: (v) => {
    const m = S.chat[S.current][+v];
    if (!m.to.trim() || m.sent) return;
    const asked = itemsFor(S.current).filter((a) => m.include[a.id]);
    asked.forEach((a) => { a.asked = 'Oct 27'; });
    m.sent = true;
    const what = asked.length ? asked.map((a) => a.item).join('; ') : 'no outstanding items';
    logNote('Message sent', `Sent a message to ${m.to}.\nAsked for: ${what}.\nSubject: ${m.subject}`);
    logEvent('Message sent to the referring provider', `To ${m.to}. Asked for: ${what}. Sent by Melissa outside the copilot and logged here.`, '#2F5FA8');
  },
  copy: (v) => {
    const m = S.chat[S.current][+v];
    const text = m.kind === 'message' ? messageText(m) : (m.frozen || draftNote());
    const keep = () => [...document.querySelectorAll('.centre-scroll')].map((c) => c.scrollTop);
    const done = () => {
      const top = keep(); S.copied = +v; render();
      document.querySelectorAll('.centre-scroll').forEach((c, i) => { c.scrollTop = top[i]; });
      setTimeout(() => { const t = keep(); S.copied = null; render(); document.querySelectorAll('.centre-scroll').forEach((c, i) => { c.scrollTop = t[i]; }); }, 1800);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
    else done();
  },
  toPip: () => { S.view = 'pip'; S.pipCollapsed = false; S.drawer = null; },
  pipCollapse: () => { S.pipCollapsed = true; },
  pipExpand: () => { S.pipCollapsed = false; },
  toFull: () => { S.view = 'patient'; S.trackCollapsed = false; }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  const scrollers = [...document.querySelectorAll('.rail-scroll, .centre-scroll, .aw-list, .log-list')].map((s) => s.scrollTop);
  fn(el.dataset.v);
  if (el.dataset.act === 'copy') return;
  render();
  // Keep scroll positions when the same view redraws, so ticking does not jump the list.
  if (!['open', 'toQueue', 'tab', 'toFull', 'mode'].includes(el.dataset.act)) {
    document.querySelectorAll('.rail-scroll, .centre-scroll, .aw-list, .log-list').forEach((s, i) => { if (scrollers[i] != null) s.scrollTop = scrollers[i]; });
  }
  scrollToChat();
});

// Redraw from outside a click (the tree canvas), keeping every pane where it was scrolled.
function redraw() {
  const panes = '.rail-scroll, .centre-scroll, .aw-list, .log-list';
  const keep = [...document.querySelectorAll(panes)].map((el) => el.scrollTop);
  render();
  document.querySelectorAll(panes).forEach((el, i) => { if (keep[i] != null) el.scrollTop = keep[i]; });
}

function scrollToChat() {
  if (S.focusWhy) {
    S.focusWhy = false;
    const why = document.getElementById('changeWhy');
    if (why) { why.focus({ preventScroll: true }); why.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  if (!S.scrollChat) return;
  S.scrollChat = false;
  const c = document.querySelector('.centre-scroll');
  if (c) c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' });
}

// Typing in the message keeps focus: fields update the draft in place.
document.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.msg;
  if (i == null) return;
  const m = (S.chat[S.current] || [])[+i];
  if (!m || m.sent) return;
  m[e.target.dataset.f] = e.target.value;
  if (e.target.dataset.f === 'body') m.edited = true;
  const sent = document.getElementById('msgSent' + i);
  if (sent) sent.disabled = !m.to.trim();
});

// The rationale updates the tree preview without redrawing the page, so typing keeps focus.
document.addEventListener('input', (e) => {
  if (e.target.id !== 'changeWhy' || !S.reroute) return;
  S.reroute.why = e.target.value;
  document.getElementById('changeSave').disabled = !(S.reroute.target && S.reroute.why.trim());
  mountTree();
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'rangeFrom' || e.target.id === 'rangeTo') {
    const v = fromIso(e.target.value);
    const r = Object.assign({}, S.range, { [e.target.id === 'rangeFrom' ? 'from' : 'to']: v });
    if (!r.from && r.to) { r.from = r.to; r.to = null; }
    if (r.from && r.to && keyNum(r.to) < keyNum(r.from)) S.range = { from: r.to, to: r.from };
    else S.range = r;
    // Show the month the range starts in.
    if (S.range.from) { const [y, m] = S.range.from.split('-').map(Number); S.cal = { y, m }; }
    redraw();
    return;
  }
  if (e.target.id === 'changeNode' && S.reroute) {
    S.reroute.addNode = e.target.checked;
    mountTree();
    return;
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'search') return;
  e.preventDefault();
  const q = document.getElementById('search').value.trim();
  if (!q) return;
  const digits = q.replace(/\D/g, '');
  const ql = q.toLowerCase();
  const hit = PEOPLE.find((p) => (digits.length >= 3 && p.mrn.replace(/\D/g, '').includes(digits)) || (ql.length >= 3 && surname(p).toLowerCase().startsWith(ql)));
  if (hit) {
    ACT.open(hit.mrn);
  } else if (S.view === 'patient') {
    S.searchMsg = '';
    ask(q);
  } else {
    S.searchMsg = digits.length >= 3
      ? `No open referral matches “${q}”. Check the MRN — closed referrals live in the master list.`
      : `No patient matches “${q}”. Open a patient to ask about their referral, or search by MRN or surname.`;
  }
  render();
  scrollToChat();
});

// Text cut off with an ellipsis shows in full on hover, or when its row has keyboard focus.
// Hovering anywhere on the row is enough; nothing shows when the text already fits.
const TRUNC = [['.aw-row', '.aw-text'], ['.rail-row', '.name'], ['.t-head', '.title']];
const tip = document.createElement('div');
tip.className = 'tip';
tip.setAttribute('role', 'tooltip');
tip.hidden = true;
document.body.appendChild(tip);

function truncatedIn(node) {
  for (const [row, text] of TRUNC) {
    const r = node && node.closest && node.closest(row);
    const el = r && r.querySelector(text);
    if (el) return el.scrollWidth > el.clientWidth ? el : null;
  }
  return null;
}

function showTip(el) {
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.textContent;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left - 9, innerWidth - t.width - 8));
  const top = r.top - t.height - 6 < 8 ? r.bottom + 6 : r.top - t.height - 6;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

document.addEventListener('mouseover', (e) => showTip(truncatedIn(e.target)));
document.addEventListener('focusin', (e) => showTip(truncatedIn(e.target)));
document.addEventListener('focusout', () => { tip.hidden = true; });
document.addEventListener('click', () => { tip.hidden = true; }, true);
document.addEventListener('scroll', () => { tip.hidden = true; }, true);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); return; }
  if (e.key === 'Escape' && S.reroute) { S.reroute = null; redraw(); return; }
  if (e.key === 'Escape' && S.calPicker !== null) { S.calPicker = null; redraw(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    const s = document.getElementById('search');
    if (s) { e.preventDefault(); s.focus(); }
  }
});

render();
</script>
</body>
