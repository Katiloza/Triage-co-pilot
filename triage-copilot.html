<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
:root {
  --ground: #F7F6F2;
  --surface: #FFFFFF;
  --sunk: #F3F2EE;
  --border: #E7E5DF;
  --border-strong: #DEDBD4;
  --hair: #F1EFEA;
  --ink: #1B1B19;
  --ink-2: #3A3832;
  --ink-3: #4A4843;
  --muted: #6E6C66;
  --faint: #8C8980;
  --ghost: #A5A29A;
  --primary: #2F5FA8;
  --amber-bg: #FBF1E0; --amber: #8A5A12; --amber-dot: #C98A2B;
  --red-bg: #FBE8E4;   --red: #8A3324;
  --green-bg: #E7F4EE; --green: #0E7A52;
  --blue-bg: #E9EFF8;  --blue: #2F5FA8;
  --purple-bg: #EFEBFA; --purple: #5B4BB5;
  --shadow-card: 0 1px 2px rgba(20, 20, 15, 0.04);
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #ECEAE4;
  color: var(--ink);
  font-family: 'Figtree', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
.grow { flex-grow: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* The app fills the browser window */
.stage { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.frame { flex-grow: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; background: var(--ground); overflow: hidden; position: relative; }

/* Title bar */
.titlebar { flex-shrink: 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.lights { display: flex; gap: 7px; }
.lights span { width: 11px; height: 11px; border-radius: 50%; background: #E4E1DA; }
.logo { width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: var(--primary); }
.logo.sm { width: 20px; height: 20px; margin: 0; border-radius: 6px; }
.app-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
.today { font-size: 12px; color: var(--faint); font-family: var(--mono); }
.avatar { width: 27px; height: 27px; flex-shrink: 0; border-radius: 50%; background: #F0EFEA; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #5E5B54; }
.follow-btn, .tb-btn { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.follow-btn:hover, .tb-btn:hover { border-color: #C9C6BD; color: var(--ink); }
.tb-btn { display: none; flex-shrink: 0; }
.tb-btn[aria-expanded="true"] { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
.tb-btn .count { font-family: var(--mono); font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }

.cols { flex-grow: 1; min-height: 0; display: flex; position: relative; }
.scrim { display: none; }

/* Left rail */
.rail { width: 320px; flex-shrink: 0; transition: width 0.18s ease; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); }
.seg { display: flex; gap: 5px; padding: 3px; background: var(--sunk); border-radius: 9px; }
.seg button { flex: 1 1 0; min-height: 30px; border: 0; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 20, 15, 0.08); }
/* The calendar and filters stay put; only the referral list scrolls */
.rail-fixed { flex-shrink: 0; }
.rail-scroll { flex-grow: 1; min-height: 0; overflow: auto; }
/* On a short window there is no room for both, so the whole rail scrolls instead */
@media (max-height: 640px) {
  .rail { overflow-y: auto; }
  .rail-scroll { flex: none; overflow: visible; }
}
.cal-head { display: flex; align-items: center; gap: 6px; padding: 0 2px 9px; }
.cal-head .month { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.icon-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--faint); cursor: pointer; }
.icon-btn:disabled { color: #D3D0C8; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .dn { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: var(--ghost); padding-bottom: 3px; }
.cal .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 38px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.cal .cell .n { font-size: 11.5px; font-weight: 500; color: var(--ink); }
.cal .cell .c { font-size: 9.5px; font-family: var(--mono); color: var(--ghost); }
.cal .cell.today { border-color: #CFCCC3; }
.cal .cell.today .n { font-weight: 700; }
.cal .cell.sel { background: var(--primary); border-color: var(--primary); }
.cal .cell.sel .n { color: #FFFFFF; font-weight: 700; }
.cal .cell.sel .c { color: #D6E3F5; }
.cal .cell:not(.sel):hover { border-color: var(--border-strong); }
.cal .blank { min-height: 38px; }
.cal .cell.future { cursor: default; }
.cal .cell.future .n { color: #C9C6BD; }
.cal-month { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 8px; margin-left: -6px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); cursor: pointer; }
.cal-month:hover, .cal-month[aria-expanded="true"] { background: var(--sunk); }
.cal-month svg { color: var(--faint); transition: transform 0.15s; }
.cal-month[aria-expanded="true"] svg { transform: rotate(180deg); }
.cal-cap { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; font-size: 11px; color: var(--faint); }
.cal-mode { flex-shrink: 0; min-height: 24px; padding: 0 9px; border: 1px solid #E2DFD8; border-radius: 12px; background: var(--surface); font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.cal-mode[aria-pressed="true"] { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
/* Date range: typed or picked on the grid, across months */
.range-in { display: flex; align-items: center; gap: 6px; padding: 0 2px 9px; font-size: 11px; color: var(--faint); }
.range-in input { flex: 1 1 0; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); font-family: var(--mono); font-size: 11px; color: var(--ink); }
.range-in input:focus { outline: none; border-color: var(--primary); }
.cal .cell.inrange { background: var(--blue-bg); }
.cal .cell.inrange .n { color: var(--primary); font-weight: 600; }
.rail-top .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.rail-top .icon-btn:not(:disabled):hover { background: var(--sunk); color: var(--ink); }
/* Month and year picker: replaces the grid until a month is chosen */
.cal-pick { padding: 2px 0 4px; }
.cal-pick-year { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; font-size: 13px; font-weight: 600; font-family: var(--mono); }
.cal-pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cal-pick-grid button { min-height: 38px; border: 1px solid var(--hair); border-radius: 9px; background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.cal-pick-grid button:hover:not(:disabled) { border-color: var(--border-strong); }
.cal-pick-grid button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.cal-pick-grid button.now { border-color: #CFCCC3; }
.cal-pick-grid button:disabled { color: #C9C6BD; cursor: default; }
.cal-pick-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
.rail-filters { padding: 2px 12px 10px; }
.rail-filters .sub { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--red-bg); }
.rail-top .kicker { padding-left: 2px; }
.rail-title .btn-ghost { min-height: 24px; padding: 0 8px; align-self: center; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { min-height: 28px; padding: 0 10px; border-radius: 14px; cursor: pointer; font-size: 11.5px; font-weight: 600; background: var(--surface); color: var(--muted); border: 1px solid #E2DFD8; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.chip.active { background: var(--blue-bg); border-color: var(--primary); color: var(--primary); }
.chip.sm { min-height: 26px; padding: 0 9px; border-radius: 13px; font-size: 11px; }
.btn-ghost { flex-shrink: 0; min-height: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.btn-ghost:disabled { color: #C9C6BD; cursor: default; }
.rail-title { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 7px; border-top: 1px solid var(--hair); }
.rail-title .count { font-size: 11px; color: var(--faint); font-family: var(--mono); }
.rail-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left; }
.rail-row:hover { background: #F7F6F2; }
.rail-row.here { background: var(--blue-bg); }
.rail-row .who { flex-grow: 1; min-width: 0; }
.rail-row .name { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-row .mrn { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; font-family: var(--mono); }
.rail-row .age { flex-shrink: 0; font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
.rail-row .age.old { color: var(--red); font-weight: 600; }
.dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; }
.rail-empty { padding: 14px 10px; font-size: 11.5px; line-height: 1.5; color: var(--faint); }
.rail-foot { flex-shrink: 0; padding: 10px 12px 12px; border-top: 1px solid var(--hair); }
.btn-back { display: flex; width: 100%; align-items: center; justify-content: center; gap: 7px; min-height: 36px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; }

/* Centre */
.centre { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
.centre-scroll { flex-grow: 1; min-height: 0; overflow: auto; }
.dot.sm { width: 7px; height: 7px; }
.welcome { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px 24px 48px; text-align: center; }
.welcome .logo { width: 44px; height: 44px; border-radius: 13px; margin-bottom: 6px; }
.welcome h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; }
.welcome p { margin: 0; max-width: 460px; font-size: 14px; line-height: 1.6; color: var(--muted); }
.w-resume { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; min-height: 44px; padding: 0 8px 0 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-card); cursor: pointer; font-size: 13px; color: var(--ink); text-align: left; }
.w-resume:hover { border-color: #C9C6BD; }
.w-resume .k { color: var(--faint); }
.w-resume .go { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--sunk); color: var(--ink-3); }
.r { text-align: right; }
.pill { display: inline-flex; align-items: center; height: 21px; padding: 0 9px; border-radius: 11px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.pill.xs { height: 19px; padding: 0 8px; font-size: 10px; }
.t-awaiting { background: var(--amber-bg); color: var(--amber); }
.t-new { background: var(--blue-bg); color: var(--blue); }
.t-accepted, .t-met { background: var(--green-bg); color: var(--green); }
.t-declined { background: var(--red-bg); color: var(--red); }
.t-missing { background: var(--amber-bg); color: var(--amber); }
.t-gap { background: var(--purple-bg); color: var(--purple); }
.t-cold { background: var(--sunk); color: var(--faint); }
.empty { padding: 40px 20px; text-align: center; }
.empty h2 { margin: 0; font-size: 14px; font-weight: 600; }
.empty p { margin: 6px auto 0; max-width: 420px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

.search { flex-shrink: 0; padding: 12px 20px 16px; border-top: 1px solid var(--border); background: var(--surface); }
.search form { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 14px; background: var(--surface); border: 1.5px solid #CFCCC3; border-radius: 12px; box-shadow: 0 2px 8px rgba(20, 20, 15, 0.07); }
.search form:focus-within { border-color: var(--primary); }
.search input { flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 13.5px; color: var(--ink); padding: 0; }
.search .kbd { flex-shrink: 0; font-size: 11px; color: var(--ghost); font-family: var(--mono); }
.btn-send { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; color: #FFFFFF; cursor: pointer; background: var(--primary); }
.search-msg { margin: 7px 2px 0; font-size: 11.5px; color: var(--muted); }

/* Patient header */
.p-head { flex-shrink: 0; padding: 16px 20px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.p-back { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; margin: -4px 0 8px -8px; padding: 0 9px 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.p-back:hover { background: var(--sunk); color: var(--ink); }
.p-id { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 13px; }
.p-name { flex: 1 1 240px; min-width: 0; }
.p-av { width: 42px; height: 42px; flex-shrink: 0; border-radius: 11px; background: #F0EFEA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #5E5B54; }
.p-id h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.p-id .meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
.facts { display: flex; gap: 22px; padding-top: 2px; margin-left: auto; white-space: nowrap; }
.facts .k { font-size: 10.5px; color: var(--faint); }
.facts .v { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.facts .v.late { color: var(--red); }
.tabs { display: flex; gap: 2px; margin-top: 14px; }
.tabs button { min-height: 38px; padding: 0 13px; border: 0; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.tabs button[aria-pressed="true"] { font-weight: 600; color: var(--ink); box-shadow: inset 0 -2px 0 var(--primary); }
.pad { padding: 18px 20px 24px; }

/* Verdict */
.verdict { padding: 16px 18px; border-radius: 14px; background: var(--amber-bg); }
.verdict .top { display: flex; align-items: flex-start; gap: 13px; }
.v-mark { width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: #F4E2C2; color: var(--amber); }
.v-kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--amber); }
.v-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin-top: 4px; }
.verdict.over { background: var(--blue-bg); }
.verdict.over .v-mark { background: #D8E3F4; color: var(--primary); }
.verdict.over .v-kicker { color: var(--primary); }
.v-was { margin-top: 5px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.v-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(27, 27, 25, 0.08); }
.v-actions .hint { font-size: 11.5px; color: var(--muted); }
/* Changing the decision: rationale first, then where the path should end */
.change { margin-top: 10px; padding: 16px; background: var(--surface); border: 1.5px solid var(--primary); border-radius: 12px; box-shadow: 0 0 0 3px rgba(47, 95, 168, 0.12); }
.change h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.change .sub { margin: 4px 0 0; max-width: 640px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.change .q { display: block; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.change .q .req { font-weight: 500; color: var(--faint); }
.change .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.opt { min-height: 34px; padding: 0 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink-3); border: 1px solid #E2DFD8; }
.opt[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.change .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.change .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
.change .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.change .row .hint { font-size: 11.5px; color: var(--muted); }
.v-tree { flex-shrink: 0; text-align: right; }
.v-tree .k { font-size: 10.5px; color: var(--faint); }
.v-tree .v { font-size: 12px; font-weight: 600; margin-top: 2px; }
.v-tree .s { font-size: 11px; color: var(--faint); margin-top: 1px; font-family: var(--mono); }
.btn { white-space: nowrap; min-height: 40px; padding: 0 15px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn.primary { border: 0; background: var(--primary); color: #FFFFFF; }
.btn.primary.done { background: var(--green); }
.btn.primary:disabled { background: #C9C6BD; cursor: default; }
.btn.primary.done:disabled { background: var(--green); }
.btn.secondary { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 12.5px; }

textarea.field { display: block; width: 100%; resize: none; padding: 10px 11px; border: 1px solid var(--border-strong); border-radius: 9px; outline: none; background: var(--surface); font-family: inherit; font-size: 12.5px; line-height: 1.55; color: var(--ink); }
textarea.field:focus { border-color: var(--primary); }

/* Steps */
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-top: 24px; padding: 0 2px 10px; }
.sec-head .aside { font-size: 11px; color: var(--faint); }
/* Decision tree — React Flow canvas and the detail card for the selected node */
.tree-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.tree-canvas { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); overflow: hidden; }
.tree-bar { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--hair); }
.tree-hint { flex-grow: 1; min-width: 0; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-canvas.narrow .tree-hint { visibility: hidden; }
.tree-zoom { display: flex; margin-left: 4px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.tree-zoom button { width: 30px; height: 28px; border: 0; border-left: 1px solid var(--hair); background: var(--surface); color: var(--ink-3); cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.tree-zoom button:first-child { border-left: 0; }
.tree-zoom button:hover { background: var(--sunk); }
.tree-flow { height: 595px; }
.tree-canvas.narrow .tree-flow { height: 535px; }
.seg-sm { flex-shrink: 0; padding: 2px; gap: 2px; }
.seg-sm button { flex: 0 0 auto; min-height: 26px; padding: 0 11px; font-size: 11.5px; }
/* Inside the card, the selected node reads as a band above the diagram rather than a card of its own */
.tree-canvas .tree-detail { align-self: stretch; min-width: 0; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0; box-shadow: none; }
/* Plain-language view: the path read top to bottom, then the steps it did not take */
.plain .p-sec { padding: 14px 16px 8px; border-top: 1px solid var(--hair); }
.plain .p-sec:first-child { border-top: 0; }
.plain .steps { border: 0; border-radius: 0; box-shadow: none; }
.step.dim { opacity: 0.6; }
.s-num.node { background: var(--sunk); color: var(--muted); }
.s-num.you { background: var(--primary); }
.s-num.tree { background: var(--amber-dot); }
.react-flow__node-tree { cursor: pointer; }
.tn { box-sizing: border-box; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px 10px; box-shadow: var(--shadow-card); transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s; font-family: 'Figtree', system-ui, sans-serif; }
.tn .react-flow__handle { opacity: 0; width: 6px; height: 6px; min-width: 0; min-height: 0; border: 0; pointer-events: none; }
.tn-head { display: flex; align-items: center; gap: 8px; }
.tn-kick { flex-grow: 1; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.tn-title { margin-top: 4px; font-size: 12.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; color: var(--ink); }
.tn.missing { border-color: #E4C48E; background: #FDFAF3; }
.tn.gap { border: 1.5px dashed var(--purple); background: #FAF8FE; }
.tn.stop { border-color: #E4D3AE; background: #FDFBF6; }
.tn.stop .tn-title { color: var(--amber); }
.tn.cold { opacity: 0.62; }
.tn.cold .tn-title { color: var(--faint); }
/* Anything off the path the tree took is greyed, whatever its own status */
.tn.off { opacity: 0.55; background: var(--surface); border-color: var(--border); box-shadow: none; }
.tn.off.gap { border-color: #CFCCC3; }
.tn.off .tn-title { color: var(--faint); }
.tn.off.sel { opacity: 0.9; }
/* After a change: the tree's own route stays visible, dashed */
.tn.ai { opacity: 0.85; border: 1.5px dashed #8FA7CF; background: var(--surface); box-shadow: none; }
.tn.ai .tn-title { color: var(--ink-3); }
.tn.pick { cursor: pointer; }
.tn.pick:hover, .tn.pick.target { outline: 2px solid var(--primary); outline-offset: 2px; opacity: 1; }
.tn-sub { margin-top: 5px; font-size: 10.5px; font-weight: 600; color: var(--primary); }
.tn.note { background: #F2F6FC; border: 1.5px solid #9DB3D9; }
.tn.note .tn-kick { color: var(--primary); }
.tn.note .tn-title { font-size: 12px; font-weight: 500; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tn.note .tn-by { margin-top: 5px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.tree-bar.rerouting { background: var(--blue-bg); }
.tree-bar.rerouting .tree-hint { color: var(--primary); font-weight: 600; visibility: visible; }
.key { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.key::before { content: ''; width: 16px; border-top: 2px solid var(--primary); }
.key.ai::before { border-top-style: dashed; border-top-color: #8FA7CF; }
.tn.on { border-color: var(--primary); opacity: 1; box-shadow: 0 2px 8px rgba(47, 95, 168, 0.14); }
.tn.on .tn-kick { color: var(--primary); }
.tn.sel { box-shadow: 0 0 0 3px rgba(47, 95, 168, 0.28); }
.tree-detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); padding: 14px 16px 15px; align-self: start; }
.tree-detail .d-head { display: flex; align-items: center; gap: 8px; }
.tree-detail .d-title { margin-top: 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
/* Source data behind a node: closed until asked for */
.src-toggle { margin-left: 8px; padding: 2px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--primary); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.src-toggle:hover { background: var(--blue-bg); }
.source { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: #FDFCF8; overflow: hidden; }
.src-item { padding: 12px 14px; border-top: 1px solid var(--hair); }
.src-item:first-child { border-top: 0; }
.src-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.src-kind { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-3); }
.src-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.src-from { margin-top: 3px; font-size: 11px; color: var(--faint); }
.src-scroll { overflow-x: auto; }
.src-table { width: 100%; min-width: 360px; margin-top: 8px; border-collapse: collapse; font-size: 12px; }
.src-table th { padding: 5px 8px 5px 0; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); }
.src-table td { padding: 6px 8px 6px 0; font-family: var(--mono); color: var(--ink-2); border-bottom: 1px solid var(--hair); }
.src-table tr:last-child td { border-bottom: 0; }
.src-table tr.flag td { color: var(--amber); font-weight: 600; }
.src-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; }
.src-kv dt { color: var(--faint); }
.src-kv dd { margin: 0; color: var(--ink-2); }
.src-lines { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.src-quote { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--border-strong); background: var(--surface); font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.src-foot { margin-top: 8px; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.tree-detail .s-row { grid-template-columns: 76px minmax(0, 1fr); }
.d-nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
.d-nav .pos { flex-grow: 1; text-align: center; font-size: 11px; color: var(--faint); font-family: var(--mono); }
.steps { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); overflow: hidden; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 13px; padding: 14px 16px 15px; border-bottom: 1px solid var(--hair); position: relative; }
.step:last-child { border-bottom: 0; }
.step.missing { background: #FDFAF3; box-shadow: inset 3px 0 0 var(--amber-dot); }
.step.gap { background: #FAF8FE; box-shadow: inset 3px 0 0 var(--purple); }
.s-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; font-family: var(--mono); }
.s-num.met { background: var(--green); }
.s-num.missing { background: var(--amber-dot); }
.s-num.gap { background: transparent; color: var(--purple); border: 1.5px dashed var(--purple); }
.s-kick { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-family: var(--mono); }
.s-q { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; margin-top: 2px; }
.s-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; margin-top: 8px; font-size: 12.5px; line-height: 1.6; }
.s-row .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ghost); padding-top: 2px; }
.s-row .v { color: var(--ink-2); max-width: 600px; }
.s-row .src svg { vertical-align: -1px; margin-right: 6px; }
.s-row .src { display: inline; line-height: 2; -webkit-box-decoration-break: clone; box-decoration-break: clone; font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--ground); border: 1px solid var(--hair); border-radius: 6px; padding: 2px 7px; }
.s-aside { margin-top: 10px; padding: 9px 11px; border-radius: 9px; font-size: 12px; line-height: 1.5; }
.s-aside.purple { background: var(--purple-bg); color: #3F3480; }
.s-aside.blue { background: var(--blue-bg); color: #24497F; }

/* Referral and history tabs */
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-card); }
.rec-row { display: flex; gap: 14px; align-items: flex-start; padding: 13px 14px; border-bottom: 1px solid var(--hair); }
.rec-row:last-child { border-bottom: 0; }
.rec-row.missing { background: #FDFBF6; }
.rec-row .k { width: 150px; flex-shrink: 0; font-size: 12px; color: var(--faint); }
.rec-row .v { flex-grow: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.5; }
.rec-row.missing .v { color: var(--amber); }
.lab-grid { display: grid; grid-template-columns: 110px repeat(5, 1fr) 140px; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--hair); font-size: 12px; font-family: var(--mono); }
.lab-grid:last-child { border-bottom: 0; }
.lab-grid.head { padding: 9px 14px; background: var(--ground); border-bottom: 1px solid var(--border); font-family: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.lab-grid .low { color: var(--amber); font-weight: 600; }
.lab-grid .src { font-family: inherit; color: var(--muted); }
.h-row { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--hair); }
.h-row:last-child { border-bottom: 0; }
.h-dot { width: 11px; height: 11px; flex-shrink: 0; margin-top: 4px; border-radius: 50%; border: 2px solid; }
.h-date { width: 104px; flex-shrink: 0; font-size: 11px; color: var(--faint); font-family: var(--mono); padding-top: 1px; }
.h-t { font-size: 13px; font-weight: 600; }
.h-b { font-size: 12px; line-height: 1.55; margin-top: 3px; color: var(--muted); max-width: 560px; }
.n-row { padding: 12px 14px; border-bottom: 1px solid var(--hair); }
.n-row:last-child { border-bottom: 0; }
.n-meta { display: flex; align-items: baseline; gap: 7px; font-size: 10.5px; }
.n-meta .d { font-weight: 600; color: var(--ink-3); font-family: var(--mono); }
.n-meta .w { color: var(--faint); }
.n-text { font-size: 12.5px; line-height: 1.55; margin-top: 4px; color: var(--ink-2); }

/* Right pane */
.track { width: 380px; flex-shrink: 0; transition: width 0.18s ease; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); }
.t-head { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 14px; border-bottom: 1px solid var(--border); }
.rail-top { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 12px 8px 10px 12px; }
.col-toggle { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--faint); cursor: pointer; }
.col-toggle:hover { background: var(--sunk); color: var(--ink); }
/* A collapsed column leaves a slim strip with a way back in */
.strip { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; height: 100%; }
.strip button { width: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; font-size: 12px; font-weight: 600; }
.strip button:hover { background: var(--sunk); color: var(--ink); }
.strip .vert { writing-mode: vertical-rl; letter-spacing: 0.02em; white-space: nowrap; }
.rail .strip .vert { transform: rotate(180deg); }
.strip .count { writing-mode: horizontal-tb; font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }
.t-head .title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw-grid { display: grid; grid-template-columns: minmax(0, 1fr) 56px 70px; gap: 8px; align-items: center; }
.aw-cols { flex-shrink: 0; padding: 8px 14px; background: var(--ground); border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.aw-list { flex: 0 1 auto; min-height: 0; max-height: 40%; overflow: auto; border-bottom: 1px solid var(--border); }
.aw-row { padding: 9px 14px; border-bottom: 1px solid #F4F2ED; }
.aw-row:last-child { border-bottom: 0; }
.aw-item { display: flex; align-items: center; gap: 9px; min-width: 0; }
.aw-text { font-size: 12px; line-height: 1.4; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw-row.done .aw-text { color: var(--ghost); text-decoration: line-through; }
.aw-sub { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.due { font-size: 11px; font-family: var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.due.late { color: var(--red); font-weight: 600; }
.due.soon { color: var(--amber); font-weight: 600; }
.aw-row.done .due { color: var(--ghost); font-weight: 400; }
.tick { width: 16px; height: 16px; padding: 0; flex-shrink: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--surface); border: 1.5px solid #C9C6BD; }
.tick[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); }
.tick:hover { border-color: var(--primary); }
.t-empty { padding: 18px 16px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.t-empty p { margin: 0 0 6px; }
.t-empty strong { color: var(--ink); font-weight: 600; }
/* Full text of anything cut off with an ellipsis, shown on hover or keyboard focus */
.tip { position: fixed; z-index: 100; max-width: 280px; padding: 6px 9px; border-radius: 7px; background: var(--ink); color: #FFFFFF; font-size: 12px; line-height: 1.4; box-shadow: 0 4px 14px rgba(20, 20, 15, 0.18); pointer-events: none; }
.tip[hidden] { display: none; }
.aw-none { padding: 18px 14px; font-size: 12px; line-height: 1.5; color: var(--faint); }

/* Running notes — the notes column from the spreadsheet */
.log-sec { flex: 1 1 0; min-height: 200px; display: flex; flex-direction: column; }
.log-head { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px; }
.log-head .title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.log-head .count { font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
.log-list { flex-grow: 1; min-height: 0; overflow: auto; padding: 0 14px; }
.log-list .n-row { padding: 11px 0; border-bottom: 1px solid #F4F2ED; }
.log-list .n-row:last-child { border-bottom: 0; }
.log-list .n-meta .d { font-size: 10.5px; }
.log-list .n-text { font-size: 12px; line-height: 1.55; white-space: pre-line; }

/* Chat in the centre — where the decision note is drafted */
.chat { margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--border-strong); }
.msg-you { display: flex; justify-content: flex-end; margin-top: 12px; }
.msg-you .bubble { max-width: 70%; padding: 9px 13px; border-radius: 14px 14px 4px 14px; background: var(--blue-bg); color: #24497F; font-size: 13px; line-height: 1.5; }
.msg-bot { display: flex; gap: 10px; margin-top: 12px; }
.msg-bot .logo.sm { margin-top: 2px; }
.bot-card { flex-grow: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); }
.bot-text { padding: 11px 14px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.note-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 9px; }
.note-body { margin: 0 14px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 10px; background: #FDFCF8; font-size: 12.5px; line-height: 1.65; white-space: pre-line; color: var(--ink-2); user-select: text; }
.ai-tag { display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 8px; border-radius: 10px; background: var(--purple-bg); color: var(--purple); font-size: 10px; font-weight: 600; }
.note-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; }
.note-foot .why { flex-grow: 1; min-width: 0; font-size: 11px; line-height: 1.4; color: var(--faint); }
/* Message to the referring provider: drafted in the chat, edited there, sent from the EHR */
.mc { padding: 0 14px; }
.mc-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 8px; }
.mc-row .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ghost); }
.mc-in { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 13px; color: var(--ink); outline: none; }
.mc-in:focus, .mc-body:focus { border-color: var(--primary); }
.mc-in::placeholder { color: var(--amber); }
.mc-ask { margin: 12px 0 0; padding: 8px 12px 10px; border: 1px solid var(--hair); border-radius: 10px; background: var(--ground); }
.mc-ask legend { padding: 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.mc-ask label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.mc-ask input { width: 15px; height: 15px; margin: 0; accent-color: var(--primary); }
.mc-ask .d { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.mc-ask .none { padding: 4px 0; font-size: 12px; color: var(--faint); }
.mc-body { margin-top: 10px; height: 250px; font-size: 12.5px; line-height: 1.6; }
.mc input:disabled, .mc textarea:disabled { background: var(--ground); color: var(--ink-2); }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 9px; }
.suggest .lab { font-size: 11px; color: var(--faint); margin-right: 2px; }

/* Follow-me window */
.desk { position: absolute; inset: 0; background: #E8E6E1; }
.ghost-win { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); }
.ghost-bar { flex-shrink: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--sunk); border-bottom: 1px solid var(--border-strong); font-size: 12.5px; color: var(--ghost); }
.ghost-bar .lights span { background: #D8D5CD; }
.ghost-body { flex-grow: 1; display: flex; min-height: 0; }
.ghost-nav { width: 196px; flex-shrink: 0; padding: 18px 14px; background: #FAF9F6; border-right: 1px solid #EDEBE5; }
.g { border-radius: 4px; background: #F0EEE8; }
.ghost-main { flex-grow: 1; min-width: 0; padding: 26px 30px; }
.ghost-rows { margin-top: 22px; border: 1px solid #EDEBE5; border-radius: 10px; overflow: hidden; }
.ghost-row { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-bottom: 1px solid #F2F0EB; }
.ghost-row:last-child { border-bottom: 0; }
.pip { position: absolute; right: 24px; bottom: 24px; width: 304px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: 0 18px 42px rgba(20, 20, 15, 0.22), 0 2px 6px rgba(20, 20, 15, 0.1); overflow: hidden; }
.pip-bar { display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 12px; border-bottom: 1px solid var(--hair); }
.pip-bar .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.pip-bar .icon-btn:hover { background: var(--sunk); color: var(--ink); }
.pip-body { padding: 12px; }
.pip .aw-row { padding: 9px 0; }
.pip-note { display: flex; align-items: center; gap: 7px; margin-top: 11px; padding: 9px 10px; background: var(--ground); border-radius: 9px; font-size: 11px; line-height: 1.4; color: var(--muted); }
.btn-full { display: flex; width: 100%; align-items: center; justify-content: center; gap: 7px; min-height: 38px; margin-top: 10px; border: 0; border-radius: 9px; color: #FFFFFF; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--primary); }
.pill-win { position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 23px; box-shadow: 0 14px 32px rgba(20, 20, 15, 0.2), 0 2px 5px rgba(20, 20, 15, 0.08); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.pill-win .chev { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--faint); }

/* ---------- Responsive ----------
   ≥1280  three panes side by side
   1024+  narrower rail and tracking pane
   <1024  the rail becomes a drawer from the left
   <768   the awaiting pane becomes a drawer from the right; one column of work
   The centre adapts to its own width with container queries. */

@media (max-width: 1279px) {
  .rail { width: 272px; }
  .track { width: 328px; }
  .facts { gap: 16px; }
}

@media (max-width: 1023px) {
  .tb-btn.for-rail { display: flex; }
  .rail {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 20;
    width: min(320px, 88vw);
    transform: translateX(-102%); transition: transform 0.22s ease;

const ymd = (y, m, d) => y * 10000 + m * 100 + d;
const isFuture = (y, m, d) => ymd(y, m, d) > ymd(TODAY.y, TODAY.m, TODAY.d);
const shortLabel = (k) => { const [y, m, d] = k.split('-').map(Number); return MONTHS[m - 1] + ' ' + d + (y === TODAY.y ? '' : ', ' + y); };
// Referrals received over a range, summed day by day.
function receivedBetween(a, b) {
  let total = 0;
  const [y, m, d] = a.split('-').map(Number);
  for (let t = new Date(y, m - 1, d); ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()) <= keyNum(b); t.setDate(t.getDate() + 1)) {
    total += receivedOn(t.getFullYear(), t.getMonth() + 1, t.getDate()) || 0;
  }
  return total;
}
const dayLabel = (k) => { const [y, m, d] = k.split('-').map(Number); return MONTH_NAMES[m - 1] + ' ' + d + (y === TODAY.y ? '' : ', ' + y); };
// Referrals received each day. October 2026 is the sample month; other months get steady sample volumes.
function receivedOn(y, m, d) {
  if (isFuture(y, m, d)) return null;
  if (y === 2026 && m === 10) return COUNTS[d] || 0;
  const dow = new Date(y, m - 1, d).getDay();
  if (dow === 0 || dow === 6) return 0;
  return 6 + ((Math.imul(ymd(y, m, d), 2654435761) >>> 0) % 10);
}

/* ---------- Rail ---------- */

function renderRail() {
  const { y, m } = S.cal;
  const lead = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="dn">${d}</div>`);
  for (let i = 0; i < lead; i += 1) cells.push('<div class="blank"></div>');
  for (let d = 1; d <= days; d += 1) {
    const n = receivedOn(y, m, d);
    const k = dayKey(y, m, d);
    const future = n === null;
    const r = S.range;
    const end = r.from && (k === r.from || k === r.to);
    const inside = r.from && r.to && keyNum(k) > keyNum(r.from) && keyNum(k) < keyNum(r.to);
    const sel = S.rangeMode ? end : S.day === k;
    const cls = ['cell', k === dayKey(TODAY.y, TODAY.m, TODAY.d) && 'today', sel && 'sel', S.rangeMode && inside && 'inrange', future && 'future'].filter(Boolean).join(' ');
    cells.push(`<button type="button" class="${cls}" data-act="day" data-v="${k}" ${future ? 'disabled' : ''}
      aria-label="${MONTH_NAMES[m - 1]} ${d}, ${future ? 'not yet' : n + ' received'}${sel ? ', selected' : (S.rangeMode && inside ? ', in range' : '')}">
      <span class="n">${d}</span><span class="c">${future ? '' : (n || '·')}</span></button>`);
  }
  const atStart = y === FIRST_YEAR && m === 1;
  const atNow = y === TODAY.y && m === TODAY.m;

  // Quick jump: pick a year, then a month. Months after this one are not selectable.
  const py = S.calPicker;
  const picker = py === null ? '' : `
    <div class="cal-pick" role="dialog" aria-label="Choose a month">
      <div class="cal-pick-year">
        <button type="button" class="icon-btn" data-act="calYear" data-v="-1" aria-label="Previous year" ${py <= FIRST_YEAR ? 'disabled' : ''}>${ICON.left}</button>
        <span aria-live="polite">${py}</span>
        <button type="button" class="icon-btn" data-act="calYear" data-v="1" aria-label="Next year" ${py >= TODAY.y ? 'disabled' : ''}>${ICON.right}</button>
      </div>
      <div class="cal-pick-grid">
        ${MONTHS.map((label, i) => {
          const mm = i + 1;
          const later = py === TODAY.y && mm > TODAY.m;
          return `<button type="button" class="${py === TODAY.y && mm === TODAY.m ? 'now' : ''}" data-act="calMonth" data-v="${mm}" aria-pressed="${py === y && mm === m}" aria-label="${MONTH_NAMES[i]} ${py}" ${later ? 'disabled' : ''}>${label}</button>`;
        }).join('')}
      </div>
      <div class="cal-pick-foot"><button type="button" class="btn-ghost" data-act="calToday">This month</button></div>
    </div>`;

  const chip = (id, label, size) => `<button type="button" class="chip ${size || ''}" data-act="filter" data-v="${id}" aria-pressed="${S.filter === id}">${label}</button>`;
  const declined = S.filter.startsWith('declined');
  const filters = `
    <div class="rail-filters">
      <div class="chips" role="group" aria-label="Filter by decision">
        ${chip('all', 'All')}${chip('awaiting', 'Awaiting')}${chip('accepted', 'Accepted')}
        <button type="button" class="chip ${declined && S.filter !== 'declined' ? 'active' : ''}" data-act="filter" data-v="declined" aria-pressed="${S.filter === 'declined'}">Declined</button>
      </div>
      ${declined ? `<div class="chips sub" role="group" aria-label="Declined, and then">
        ${chip('declined-malig', DECLINE.malig, 'sm')}${chip('declined-invest', DECLINE.invest, 'sm')}
      </div>` : ''}
    </div>`;

  const rows = PEOPLE.filter((p) => onDay(p) && matchesFilter(p));
  const r = S.range;
  const span = S.rangeMode
    ? (r.from ? (r.to && r.to !== r.from ? shortLabel(r.from) + ' – ' + shortLabel(r.to) : shortLabel(r.from) + (r.to ? '' : ' – pick an end day')) : '')
    : (S.day === null ? '' : dayLabel(S.day));
  const title = (span ? span + ' · ' : '') + (S.filter === 'all' ? 'All referrals' : FILTERS[S.filter].replace('Declined · ', ''));
  const received = !dateFiltered() ? null
    : S.rangeMode ? receivedBetween(r.from, r.to || r.from)
      : receivedOn(...S.day.split('-').map(Number)) || 0;
  const count = received === null ? String(rows.length) : `${rows.length} of ${received} received`;
  const maxIso = toIso(dayKey(TODAY.y, TODAY.m, TODAY.d));
  const rangeInputs = S.rangeMode ? `
    <div class="range-in">
      <input type="date" id="rangeFrom" aria-label="From" value="${r.from ? toIso(r.from) : ''}" min="${FIRST_YEAR}-01-01" max="${maxIso}">
      <span>to</span>
      <input type="date" id="rangeTo" aria-label="To" value="${r.to ? toIso(r.to) : ''}" min="${r.from ? toIso(r.from) : FIRST_YEAR + '-01-01'}" max="${maxIso}">
    </div>` : '';
  const list = rows.length
    ? rows.map((p) => {
      const here = S.view === 'patient' && S.current === p.mrn;
      return `<button type="button" class="rail-row ${here ? 'here' : ''}" data-act="open" data-v="${p.mrn}" ${here ? 'aria-current="true"' : ''}>
        <span class="dot" style="background: ${STATUS[p.status].dot}" title="${STATUS[p.status].label}"></span>
        <span class="who"><span class="name">${p.name}</span><span class="mrn">${p.mrn}</span></span>
        <span class="age ${p.days > 14 ? 'old' : ''}">${p.days}d</span>
      </button>`;
    }).join('')
    : '<div class="rail-empty">No referrals match. Pick All, or clear the day.</div>';

  return `
    <aside class="rail ${S.drawer === 'rail' ? 'open' : ''} ${S.railCollapsed ? 'collapsed' : ''}" id="rail" aria-label="Find a patient">
      <div class="strip">
        <button type="button" data-act="expand" data-v="rail" aria-label="Show the patient list" title="Show the patient list">${ICON.panelR}<span class="vert">Patients</span></button>
        ${S.view === 'patient' ? `<button type="button" data-act="toQueue" aria-label="Back to the day" title="Back to the day">${ICON.left}</button>` : ''}
      </div>
      <div class="rail-top">
        <button type="button" class="cal-month" data-act="calPick" aria-expanded="${py !== null}" aria-label="${MONTH_NAMES[m - 1]} ${y}, choose a month">${MONTH_NAMES[m - 1]} ${y}${ICON.down}</button>
        <span class="grow"></span>
        <button type="button" class="icon-btn" data-act="calStep" data-v="-1" aria-label="Previous month" ${atStart ? 'disabled' : ''}>${ICON.left}</button>
        <button type="button" class="icon-btn" data-act="calStep" data-v="1" aria-label="Next month" ${atNow ? 'disabled' : ''}>${ICON.right}</button>
        <button type="button" class="col-toggle" data-act="collapse" data-v="rail" aria-label="Hide the patient list" title="Hide the patient list">${ICON.panelL}</button>
      </div>
      <div class="rail-fixed">
        <div style="padding: 0 12px 10px">${picker || `<div class="cal-cap"><span class="grow">Referrals by date received</span><button type="button" class="cal-mode" data-act="rangeMode" aria-pressed="${S.rangeMode}">Date range</button></div>${rangeInputs}<div class="cal">${cells.join('')}</div>`}</div>
        ${filters}
        <div class="rail-title"><span class="kicker">${title}</span><span class="grow"></span><span class="count">${count}</span>${dateFiltered() ? '<button type="button" class="btn-ghost" data-act="clearDay">Show all</button>' : ''}</div>
      </div>
      <div class="rail-scroll"><div style="padding: 0 8px 12px">${list}</div></div>
      ${S.view === 'patient' ? `<div class="rail-foot"><button type="button" class="btn-back" data-act="toQueue">${ICON.left} Back to the day</button></div>` : ''}
    </aside>`;
}

/* ---------- Centre: the day ---------- */

function renderQueue() {
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const newToday = PEOPLE.filter((p) => p.status === 'new').length;
  const awaiting = PEOPLE.filter((p) => p.status === 'awaiting').length;
  const last = byMrn(S.current);
  const welcome = `
    <section class="welcome" aria-label="Welcome">
      <div class="logo">${ICON.logo.replace(/width="14" height="14"/, 'width="22" height="22"')}</div>
      <h2>${greeting}, Melissa</h2>
      <p>${newToday} new referrals came in today and ${awaiting} are awaiting something. Pick a patient from the list to start, or search by MRN below.</p>
      <button type="button" class="w-resume" data-act="open" data-v="${last.mrn}">
        <span><span class="k">Pick up where you left off ·</span> <strong>${last.name}</strong></span>
        <span class="pill xs t-${last.status}">${STATUS[last.status].label}${last.status === 'awaiting' ? ' · day ' + last.days : ''}</span>

    <main class="centre" aria-label="The day">

}

function renderSearch(placeholder, suggestions) {
  const chips = (suggestions || []).map((q) => `<button type="button" class="chip sm" data-act="ask" data-v="${q}">${q}</button>`).join('');
  return `
    <div class="search">
      ${chips ? `<div class="suggest"><span class="lab">Ask</span>${chips}</div>` : ''}
      <form data-form="search" role="search">
        ${ICON.search}
        <input type="text" id="search" aria-label="Search an MRN or ask a question" placeholder="${placeholder}" autocomplete="off">
        <span class="kbd">⌘K</span>
        <button type="submit" class="btn-send" aria-label="Send">${ICON.send}</button>
      </form>
      ${S.searchMsg ? `<div class="search-msg" role="status">${esc(S.searchMsg)}</div>` : ''}
    </div>`;
}

/* ---------- Centre: the patient ---------- */

function renderPatient() {
  const p = byMrn(S.current);
  const worked = p.mrn === WORKED;
  const tabs = [['decision', 'Decision'], ['referral', 'Referral and results'], ['history', 'History']]
    .map(([id, label]) => `<button type="button" data-act="tab" data-v="${id}" aria-pressed="${S.tab === id}">${label}</button>`).join('');

  let content;
  if (!worked) {
    content = `<div class="empty" style="padding-top: 60px">
      <h2>The tree has not been run on this referral in the prototype</h2>
      <p>The worked example is Alvarez, Rosa M. — isolated lymphopenia, external branch. ${p.waiting ? `This referral is awaiting <strong>${p.waiting.toLowerCase()}</strong>; tick it off on the right when it lands.` : ''}</p>
      <div style="margin-top: 14px"><button type="button" class="btn secondary sm" data-act="open" data-v="${WORKED}">Open the worked example</button></div>
    </div>`;
  } else if (S.tab === 'decision') {
    content = renderDecision();

    content = renderHistory();

  return `
    <main class="centre" aria-label="The patient">
      <div class="p-head">

          <div class="p-av">${initials(p)}</div>

            <h1>${p.name}</h1>

          </div>
          <div class="facts">
            <div><div class="k">Referral</div><div class="v mono">${p.ref}</div></div>
            <div><div class="k">Received</div><div class="v mono">${p.received}, 2026</div></div>
            <div><div class="k">Source</div><div class="v">${p.source}</div></div>

      </div>
      <div class="centre-scroll"><div class="pad">${content}${renderChat(p)}</div></div>

function renderDecision() {
  const c = S.change;
  const r = S.reroute;
  const verdict = c
    ? `<div class="verdict over">
        <div class="top">
          <span class="v-mark">${ICON.person}</span>
          <div class="grow" style="min-width: 0">
            <div class="v-kicker">Your decision · changed from the tree</div>
            <div class="v-title">${OUTCOME[c.target]}</div>
            <div class="v-was">The tree decided <s>${OUTCOME[TREE_END]}</s>. You rerouted at ${stepLabel(c.at)}.</div>
          </div>
          ${treeTag()}
        </div>
        ${r ? '' : `<div class="v-actions">
          <button type="button" class="btn secondary sm" data-act="changeStart">Change it again</button>
          <button type="button" class="btn secondary sm" data-act="changeRevert">Go back to the tree's decision</button>
          <span class="hint">Your reasoning is on the path below and in the patient's notes.</span>
        </div>`}
      </div>`
    : `<div class="verdict">
        <div class="top">
          <span class="v-mark">${ICON.clock}</span>
          <div class="grow" style="min-width: 0">
            <div class="v-kicker">What the tree decided</div>
            <div class="v-title">${OUTCOME[TREE_END]}</div>
          </div>
          ${treeTag()}
        </div>
        ${r ? '' : '<div class="v-actions"><button type="button" class="btn secondary sm" data-act="changeStart">Change the decision</button></div>'}
      </div>`;

  const panel = r ? `
    <section class="change" aria-label="Change the decision">
      <h3>Change the decision</h3>
      <p class="sub">Say why, then pick where the path should end — here or by clicking an outcome in the tree below. Your reasoning is saved on the decision path and in the patient's notes.</p>
      <label class="q" for="changeWhy">Why are you changing it? <span class="req">Required</span></label>
      <textarea class="field" id="changeWhy" placeholder="Your rationale for overriding the tree" style="height: 72px; margin-top: 8px">${esc(r.why)}</textarea>
      <span class="q">Where should it end?</span>
      <div class="opts" role="group" aria-label="Outcome">
        ${Object.keys(OUTCOME).filter((id) => id !== TREE_END).map((id) =>
          `<button type="button" class="opt" data-act="pickTarget" data-v="${id}" aria-pressed="${r.target === id}">${OUTCOME[id]}</button>`).join('')}
      </div>
      <label class="check"><input type="checkbox" id="changeNode" ${r.addNode ? 'checked' : ''}> Add my reasoning to the tree as a node</label>
      <div class="row">
        <button type="button" class="btn primary sm" id="changeSave" data-act="changeSave" ${r.target && r.why.trim() ? '' : 'disabled'}>Save the change</button>
        <button type="button" class="btn secondary sm" data-act="changeCancel">Cancel</button>
        <span class="hint">${r.target ? 'Reroutes at ' + stepLabel(divergeAt(r.target)) + ' to ' + OUTCOME[r.target] + '.' : 'Pick an outcome to reroute the path.'}</span>
      </div>
    </section>` : '';

  const cbcIn = !!S.done.cbc;
  const steps = STEPS.map((s) => `
    <div class="step ${s.status}">
      <span class="s-num ${s.status}" aria-hidden="true">${s.n}</span>
      <div style="min-width: 0">
        <div class="s-kick">Step ${s.n}</div>
        <div class="s-q">${s.q}</div>
        <div class="s-row"><span class="k">Found</span><span class="v">${s.found}</span></div>
        <div class="s-row"><span class="k">Read from</span><span class="v"><span class="src">${ICON.doc}${s.field}</span></span></div>
        ${s.status === 'gap' ? '<div class="s-aside purple"><strong>A gap in the tree, not in the chart.</strong> Flagged for the tree owner. The decision above stands without it.</div>' : ''}
        ${s.n === 2 && cbcIn ? '<div class="s-aside blue">You ticked the repeat CBC as in. The tree still reads one set until the result is filed in the chart — re-run on receipt, no new referral order needed.</div>' : ''}
      </div>
      <span class="pill t-${s.status}" style="align-self: start">${TONE[s.status].label}</span>
    </div>`).join('');

  return `
    ${verdict}
    ${panel}
    <div class="sec-head"><span class="kicker">The path through the tree</span><span class="aside">As a diagram, or read in plain language</span></div>
    ${TREE ? '<div id="tree-slot"></div>' : `<div class="steps">${steps}</div>`}`;
}

const treeTag = () => `

    <div class="k">Decision tree</div>
    <div class="v">Isolated lymphopenia</div>
    <div class="s">External · rev. 4</div>
  </div>`;

function renderHistory() {

  const hist = HISTORY.concat(S.history[S.current] || []).map((h) => `

/* ---------- Chat: the decision note is drafted here ---------- */

function ask(q) {
  const p = byMrn(S.current);
  const thread = S.chat[p.mrn] || (S.chat[p.mrn] = []);
  const ql = q.toLowerCase();
  thread.push({ who: 'you', text: q });
  if (/message|referring|provider|letter|fax/.test(ql)) {
    thread.push(newMessage(p));
  } else if (/note|draft|document|chart|write/.test(ql)) {
    thread.push(p.mrn === WORKED
      ? { who: 'copilot', kind: 'note' }
      : { who: 'copilot', text: `The tree has not been run on ${p.name}'s referral in this prototype, so there is nothing to draft the note from.` });
  } else if (/await|missing|outstanding|wait|left|due/.test(ql)) {
    const open = itemsFor(p.mrn).filter((a) => !S.done[a.id]);
    thread.push({ who: 'copilot', text: open.length
      ? `${open.length} still open on ${surname(p)}: ` + open.map((a) => `${a.item} (due ${dueLabel(a)}${dueTone(a) === 'late' ? ', late' : ''})`).join('; ') + '.'
      : `Nothing is still awaiting on ${p.name}.` });
  } else {
    thread.push({ who: 'copilot', text: 'In this prototype I can draft the decision note, draft a message to the referring provider, or list what is still awaiting. Try one of the suggestions above the box.' });
  }
  S.scrollChat = true;
}

// One message covers one patient. It asks for whatever is still open on their awaiting list;
// the copilot never sends it — the triager copies it into the EHR or a fax, then marks it sent.
function newMessage(p) {
  const prov = PROVIDERS[p.mrn];
  const include = {};
  itemsFor(p.mrn).filter((a) => !S.done[a.id]).forEach((a) => { include[a.id] = true; });
  const m = {
    who: 'copilot', kind: 'message', include, sent: false,
    to: prov ? prov.name + ' · ' + prov.practice : '',
    subject: `Referral ${p.ref} — information needed to complete triage`
  };
  m.body = messageBody(p, m);
  return m;
}

function messageBody(p, m) {
  const prov = PROVIDERS[p.mrn];
  const asks = itemsFor(p.mrn).filter((a) => !S.done[a.id] && m.include[a.id]);
  const lines = asks.map((a) => `• ${a.item} — ${a.asked !== '—' ? 'first requested ' + a.asked + ', ' : ''}needed by ${dueLabel(a)}`).join('\n');
  const need = asks.length
    ? `Thank you for this referral to hematology. To finish triaging it, we still need:\n${lines}\n\nOnce these are in, we will re-triage it — no new referral order is needed.${p.mrn === WORKED ? ' The window for this referral closes Dec 9, 2026.' : ''}`
    : 'Thank you for this referral to hematology. We have what we need for now and will be in touch once triage is complete.';
  return `Dear ${prov ? prov.salutation : 'colleague'},\n\nRe: ${p.name} · MRN ${p.mrn} · referral ${p.ref}, received ${p.received}, 2026\n\n${need}\n\nThank you,\nMelissa\nHematology referral triage`;
}

const messageText = (m) => `To: ${m.to}\nSubject: ${m.subject}\n\n${m.body}`;

function renderMessage(p, m, i) {
  const open = itemsFor(p.mrn).filter((a) => !S.done[a.id] || m.include[a.id]);
  const off = m.sent ? 'disabled' : '';
  const asks = open.length

/* ---------- Decision tree: a React Flow graph that survives redraws ---------- */

// The rest of the page redraws from strings; the tree keeps one React root on a
// host element that is moved into each new #tree-slot, so selection and zoom persist.
const TREE = (() => {
  if (!window.React || !window.ReactDOM || !window.ReactFlow) return null;
  const host = document.createElement('div');
  return { host, root: ReactDOM.createRoot(host) };
})();

function mountTree() {
  if (!TREE) return;
  const slot = document.getElementById('tree-slot');
  if (slot) slot.replaceWith(TREE.host);
  if (!TREE.host.isConnected) return;
  TREE.root.render(React.createElement(DecisionTree, {
    cbcIn: !!S.done.cbc, change: S.change, reroute: S.reroute, focus: S.treeFocus, onPickEnd: pickFromTree
  }));
}

// Clicking an outcome in the canvas while rerouting picks it as the new end of the path.
function pickFromTree(id) {
  if (!S.reroute || !OUTCOME[id] || id === TREE_END) return;
  S.reroute.target = id;
  redraw();
}

const GRAPH = [

    reason: 'Reached when the newest result is over 30 days old. Not reached on this referral, though the Sep 16 draw passed 30 days on Oct 16 — the repeat would now satisfy this step and the one above it.',

const NODE = Object.fromEntries(GRAPH.map((n) => [n.id, n]));
const READ_ORDER = ['root', 'g1', 'b1', 'g2', 'b2', 'g3', 'b3', 'g4', 'b4', 'g5', 'accept'];

// What each node was read from, opened on request. The kind varies with the step:

};
const chainOf = (id) => { const out = []; for (let c = id; c; c = NODE[c].parent) out.push(c); return out; };
const TREE_END = 'b2';
const TAKEN = chainOf(TREE_END);
const OUTCOME = {
  b2: 'Awaiting — hold for the repeat CBC',
  accept: 'Accept · face-to-face',
  b4: 'Decline · Allergy and Immunology first',
  b3: 'Awaiting · newest draw too old',
  b1: 'Leave for the cytopenia path'
};
// Where a rerouted path leaves the tree's own: the deepest node both share.
const divergeAt = (end) => chainOf(end).find((id) => TAKEN.includes(id));
const stepLabel = (id) => (NODE[id].kind === 'step' ? 'step ' + (NODE[id].step + 1) : 'the referral');

function nodeInfo(n) {
  if (n.kind === 'step') {
    const s = STEPS[n.step];
    return { kicker: 'Step ' + s.n, title: s.q, status: s.status, chip: TONE[s.status].label, chipCls: 't-' + s.status };
  }
  if (n.end === 'stop') return { kicker: n.kicker, title: n.title, status: 'stop', chip: 'Stopped here', chipCls: 't-awaiting' };
  if (n.end === 'cold') return { kicker: n.kicker, title: n.title, status: 'cold', chip: 'Not reached', chipCls: 't-cold' };
  return { kicker: n.kicker, title: n.title, status: 'root', chip: '', chipCls: '' };
}

function layoutFor(narrow) {
  const L = narrow
    ? { spineW: 200, branchX: 232, branchW: 172, row: 80 }
    : { spineW: 260, branchX: 330, branchW: 260, row: 84 };
  const pos = {};
  ['root', 'g1', 'g2', 'g3', 'g4', 'g5', 'accept'].forEach((id, i) => { pos[id] = { x: 0, y: i * L.row, w: L.spineW }; });
  GRAPH.filter((n) => n.branch).forEach((n) => { pos[n.id] = { x: L.branchX, y: pos[n.parent].y + 4, w: L.branchW }; });
  pos.noteW = narrow ? 170 : 220;
  pos.noteGap = narrow ? 40 : 56;
  return pos;
}

const h = window.React ? React.createElement : null;

function TreeNode({ data }) {
  const RF = window.ReactFlow;
  const cls = ['tn', data.status, data.state, data.sel && 'sel', data.pick && 'pick', data.target && 'target'].filter(Boolean).join(' ');
  return h('div', { className: cls, style: { width: data.w } },
    h(RF.Handle, { type: 'target', position: RF.Position.Top, id: 't', isConnectable: false }),
    h(RF.Handle, { type: 'target', position: RF.Position.Left, id: 'l', isConnectable: false }),
    h('div', { className: 'tn-head' },
      h('span', { className: 'tn-kick' }, data.kicker),

// The same path as the diagram, read top to bottom: the referral, each step on the path,
// where it ended, and then the steps the path did not go through.
function PlainView({ end, changed, at, why, cbcIn, draft }) {
  const [openSrc, setOpenSrc] = React.useState({});
  const flip = (id) => setOpenSrc((o) => Object.assign({}, o, { [id]: !o[id] }));
  const path = chainOf(end).reverse();
  const row = (k, v) => h('div', { className: 's-row' }, h('span', { className: 'k' }, k), h('span', { className: 'v' }, v));

  const stepItem = (id, dim) => {
    const s = STEPS[NODE[id].step];
    return h('div', { className: 'step ' + s.status + (dim ? ' dim' : ''), key: id },
      h('span', { className: 's-num ' + s.status, 'aria-hidden': true }, s.n),
      h('div', { style: { minWidth: 0 } },
        h('div', { className: 's-kick' }, 'Step ' + s.n),
        h('div', { className: 's-q' }, s.q),
        row('Found', s.found),
        readFromRow(row, s.field, id, !!openSrc[id], () => flip(id)),
        s.status === 'gap' ? h('div', { className: 's-aside purple' }, h('strong', null, 'A gap in the tree, not in the chart. '), 'Flagged for the tree owner. The decision stands without it.') : null,
        s.n === 2 && cbcIn ? h('div', { className: 's-aside blue' }, 'You ticked the repeat CBC as in. The tree still reads one set until the result is filed in the chart.') : null,
        changed && id === at
          ? h('div', { className: 's-aside blue' }, h('strong', null, 'You rerouted here'), ' — the path goes on to ' + OUTCOME[end] + ' instead of stopping at ' + OUTCOME[TREE_END] + '.' + (why ? ' ' + (draft ? 'Your reasoning (not saved yet): “' : 'Your reasoning: “') + why + '”' : ''))
          : null),
      h('span', { className: 'pill t-' + s.status, style: { alignSelf: 'start' } }, TONE[s.status].label));
  };

  const plainItem = (key, mark, markCls, kicker, title, rows, chip) => h('div', { className: 'step', key },
    h('span', { className: 's-num ' + markCls, 'aria-hidden': true }, mark),
    h('div', { style: { minWidth: 0 } }, h('div', { className: 's-kick' }, kicker), h('div', { className: 's-q' }, title), ...rows),
    chip ? h('span', { className: 'pill ' + chip[0], style: { alignSelf: 'start' } }, chip[1]) : h('span'));

  const root = NODE.root;
  const onPath = [plainItem('root', 'R', 'node', 'Referral', root.title, [row('Why', root.reason), readFromRow(row, root.source, 'root', !!openSrc.root, () => flip('root'))])];
  path.filter((id) => NODE[id].kind === 'step').forEach((id) => onPath.push(stepItem(id, false)));
  onPath.push(changed
    ? plainItem('end', '✓', 'you', 'Your decision', OUTCOME[end],
        [row('The tree decided', OUTCOME[TREE_END]), row('Why it differs', why || 'No reason given yet')], ['t-new', draft ? 'Previewing' : 'Changed by you'])
    : plainItem('end', '•', 'tree', 'Where it ended', OUTCOME[end], [row('Why', NODE[end].reason), readFromRow(row, NODE[end].source, end, !!openSrc[end], () => flip(end))], ['t-awaiting', 'The tree\'s decision']));

  const offPath = GRAPH.filter((n) => n.kind === 'step' && !path.includes(n.id)).map((n) => stepItem(n.id, true));

  return h('div', { className: 'plain' },
    h('div', { className: 'p-sec' }, h('span', { className: 'kicker' }, changed ? 'How you got to this decision' : 'How the tree got to this decision')),
    h('div', { className: 'steps' }, onPath),
    offPath.length ? h('div', { className: 'p-sec' }, h('span', { className: 'kicker' }, 'Also checked, not on this path')) : null,
    offPath.length ? h('div', { className: 'steps' }, offPath) : null);
}

function TreeCanvas({ cbcIn, change, reroute, focus, onPickEnd }) {
  const RF = window.ReactFlow;
  const { useState, useEffect, useRef, useMemo } = React;
  const [selected, setSelected] = useState('g2');
  const [narrow, setNarrow] = useState(false);
  // Diagram or plain language; remembered in this browser only, as a convenience.
  const [view, setView] = useState(() => { try { return localStorage.getItem('triage.treeView') || 'diagram'; } catch (e) { return 'diagram'; } });
  const pickView = (v) => { setView(v); try { localStorage.setItem('triage.treeView', v); } catch (e) { /* storage unavailable */ } };
  const box = useRef(null);
  const flow = RF.useReactFlow();

  // Pick the layout from the canvas's own width, and refit whenever it changes.
  useEffect(() => {
    const el = box.current;
    if (!el) return undefined;
    const ro = new ResizeObserver(([entry]) => {
      const w = entry.contentRect.width;
      if (w === 0) return;
      setNarrow(w < 600);
      requestAnimationFrame(() => flow.fitView({ padding: 0.06, maxZoom: 1, duration: 0 }));
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [flow]);

  // Only the route to the current decision is lit: the tree's own, or the one the triager rerouted to.
  // While rerouting, the outcome being picked previews in its place.
  const end = (reroute && reroute.target) || (change ? change.target : TREE_END);
  const lit = chainOf(end);
  const changed = end !== TREE_END;
  const at = changed ? divergeAt(end) : null;
  const why = reroute ? reroute.why.trim() : (change ? change.why : '');
  const hasNote = changed && !!why && (reroute ? reroute.addNode : change.addNode);
  const sel = selected === 'note' && !hasNote ? (at || 'g2') : selected;
  const pos = useMemo(() => layoutFor(narrow), [narrow]);

  // A save or revert outside the canvas asks for a particular node to be selected.
  useEffect(() => { if (focus) setSelected(focus.id); }, [focus && focus.key]);
  // The reasoning node widens the graph, so refit once it has been measured, whenever it or the path changes.
  useEffect(() => {
    const t = setTimeout(() => flow.fitView({ padding: 0.06, maxZoom: 1, duration: 200 }), 80);
    return () => clearTimeout(t);
  }, [hasNote, end, flow]);

  const chipFor = (n) => {
    if (changed && n.id === end) return { chip: 'Your decision', chipCls: 't-new' };
    if (changed && n.id === TREE_END) return { chip: 'Tree\'s decision', chipCls: 't-awaiting' };
    const info = nodeInfo(n);
    return { chip: info.chip, chipCls: info.chipCls };
  };

  const nodes = GRAPH.map((n) => {
    const info = nodeInfo(n);
    const chip = chipFor(n);
    const state = lit.includes(n.id) ? 'on' : (changed && TAKEN.includes(n.id) ? 'ai' : 'off');
    return {
      id: n.id, type: 'tree', position: { x: pos[n.id].x, y: pos[n.id].y },
      data: Object.assign({}, info, chip, {
        w: pos[n.id].w, state, sel: sel === n.id,
        pick: !!reroute && !!OUTCOME[n.id] && n.id !== TREE_END,
        target: !!reroute && reroute.target === n.id,
        sub: n.id === at ? 'You rerouted here' : ''
      }),
      ariaLabel: info.kicker + ': ' + info.title + (chip.chip ? ', ' + chip.chip : '')
    };
  });
  if (hasNote) {
    nodes.push({
      id: 'note', type: 'note', position: { x: -(pos.noteW + pos.noteGap), y: pos[at].y - 6 },
      data: { w: pos.noteW, why, sel: sel === 'note', draft: !!reroute },
      ariaLabel: 'Your reasoning: ' + why
    });
  }

  const edges = GRAPH.filter((n) => n.parent).map((n) => {
    const on = lit.includes(n.id) && lit.includes(n.parent);
    const ai = !on && changed && TAKEN.includes(n.id) && TAKEN.includes(n.parent);
    const label = n.parent === 'root' ? undefined : (n.branch ? 'no' : 'yes');
    return {
      id: n.parent + '-' + n.id, source: n.parent, target: n.id,
      sourceHandle: n.branch ? 'r' : 'b', targetHandle: n.branch ? 'l' : 't',
      type: n.branch ? 'smoothstep' : 'straight',
      label,
      labelStyle: { fontSize: 9.5, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase', fill: on ? '#2F5FA8' : (ai ? '#7F98C2' : '#A5A29A') },
      labelBgStyle: { fill: '#FFFFFF' }, labelBgPadding: [4, 2],
      style: { stroke: on ? '#2F5FA8' : (ai ? '#8FA7CF' : '#D3D0C8'), strokeWidth: on || ai ? 2 : 1.5, strokeDasharray: on ? undefined : (ai ? '6 4' : '5 4') }
    };
  });
  if (hasNote) {
    edges.push({
      id: 'note-' + at, source: 'note', target: at, sourceHandle: 'r', targetHandle: 'l', type: 'smoothstep',
      style: { stroke: '#9DB3D9', strokeWidth: 1.5, strokeDasharray: '3 3' }
    });
  }

  const order = READ_ORDER.slice();
  if (hasNote) order.splice(order.indexOf(at) + 1, 0, 'note');
  const hint = reroute
    ? 'Rerouting — click an outcome in the tree to end the path there'
    : (changed ? 'Highlighted: your path to this decision · drag to pan' : 'Highlighted: the path the tree took to this decision · drag to pan');

  // One card: the view toggle on top, then either the selected node above the diagram, or the plain reading.
  const diagram = view === 'diagram';
  return h('div', { className: 'tree-wrap' },
    h('div', { className: 'tree-canvas' + (narrow ? ' narrow' : ''), ref: box },
      h('div', { className: 'tree-bar' + (reroute ? ' rerouting' : '') },
        h('div', { className: 'seg seg-sm', role: 'group', 'aria-label': 'Show the tree as' },
          h('button', { type: 'button', 'aria-pressed': diagram, onClick: () => pickView('diagram') }, 'Diagram'),
          h('button', { type: 'button', 'aria-pressed': !diagram, onClick: () => pickView('plain') }, 'Plain language')),
        h('span', { className: 'tree-hint' }, diagram ? hint : (reroute ? 'Rerouting — pick an outcome in the panel above' : 'The same path, read step by step')),
        diagram && changed ? h('span', { className: 'key' }, 'Your path') : null,
        diagram && changed ? h('span', { className: 'key ai' }, 'Tree\'s path') : null,
        diagram ? h('span', { className: 'pill xs t-met' }, 'Met') : null,
        diagram ? h('span', { className: 'pill xs t-missing' }, 'Not met') : null,
        diagram ? h('span', { className: 'pill xs t-gap' }, 'Undefined') : null,
        diagram ? h('div', { className: 'tree-zoom', role: 'group', 'aria-label': 'Zoom' },
          h('button', { type: 'button', 'aria-label': 'Zoom out', onClick: () => flow.zoomOut() }, '−'),
          h('button', { type: 'button', 'aria-label': 'Zoom in', onClick: () => flow.zoomIn() }, '+'),
          h('button', { type: 'button', 'aria-label': 'Fit the whole tree', title: 'Fit', onClick: () => flow.fitView({ padding: 0.06, maxZoom: 1, duration: 200 }) },
            h('span', { 'aria-hidden': true, dangerouslySetInnerHTML: { __html: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>' } }))) : null),
      diagram ? h(TreeDetail, { id: sel, cbcIn, onPick: setSelected, order, chip: sel === 'note' ? {} : chipFor(NODE[sel]), at, end, why, draft: !!reroute }) : null,
      diagram ? h('div', { className: 'tree-flow' }, h(RF.default, {
        nodes, edges, nodeTypes: NODE_TYPES,
        fitView: true, fitViewOptions: { padding: 0.06, maxZoom: 1 },
        minZoom: 0.4, maxZoom: 1.6,
        nodesDraggable: false, nodesConnectable: false, elementsSelectable: false,
        zoomOnScroll: false, panOnScroll: false, preventScrolling: false, zoomOnDoubleClick: false,
        onNodeClick: (e, node) => { setSelected(node.id); onPickEnd(node.id); }
      },
        h(RF.Background, { gap: 18, size: 1, color: '#E7E5DF' })))
        : h(PlainView, { end, changed, at, why, cbcIn, draft: !!reroute })));
}

function DecisionTree(props) {
